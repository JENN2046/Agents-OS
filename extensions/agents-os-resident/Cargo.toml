[package]
name = "agents-os-resident"
version = "0.0.0-m0a"
edition = "2024"
rust-version = "1.96.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fs4 = "=1.1.0"
napi = "=3.10.5"
napi-derive = "=3.5.10"
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.19"
unicode-normalization = "=0.1.25"

[build-dependencies]
napi-build = "=2.3.2"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
