schema_version: agents-os.document-registry.v0.1-draft
status: draft_example_not_active
date: 2026-07-01
scope: control-plane/policies/life-core documentation governance pilot
notes:
  - "This is a document registry example for Documentation Governance Pilot 3."
  - "It is not active authority data."
  - "Markdown/JSON/Python files remain the source of truth; future databases may only be rebuildable caches."
  - "This registry must not list sensitive source paths such as state-private, .env files, secrets, private memory raw text, or provider raw responses."
  - "This registry does not authorize bulk moves, external writes, runtime execution, provider calls, or formal Memory registration."
  - "`source_of_truth` means local canonical file for this pilot; upstream Notion source is recorded separately as `upstream_source`."

document_types:
  - index
  - overview
  - tutorial
  - how_to
  - runbook
  - reference
  - explanation
  - decision_record
  - policy
  - registry
  - contract
  - schema
  - template
  - example
  - receipt
  - review
  - incident_review
  - archive_note

statuses:
  - draft
  - review_needed
  - active
  - accepted
  - superseded
  - deprecated
  - archived
  - example
  - blocked

