notes:
  - "This is a document registry example for Documentation Governance Pilot 2."
  - "It is not active authority data."
  - "Markdown/YAML/JSON/Python files remain the source of truth; future databases may only be rebuildable caches."
  - "This registry must not list sensitive source paths such as state-private, .env files, secrets, private memory raw text, or provider raw responses."
