      reducer_owner: F3_command_intake
      ledger_command: TerminalSyntheticHomeIntent
      receiver: existing_LedgerThread
      connection_owner: existing_LedgerThread_only
      transaction_owner: ledger_replay_terminal_synthetic_home_intent
  direct_connection_or_SQL_in_home_module: forbidden
  caller_supplied_database_path: forbidden

home_intent_payload:
  command_type_id: M0_SYNTHETIC_SUBMIT_HOME_INTENT
  command_type_revision: 1
  environment: SYNTHETIC_TEST
  production_compatible: false
  interface_version: agents-os.m0a-synthetic-command.v0.1
  schema_version: agents-os.m0b.synthetic-home-intent-payload.v0.1
  exact_ordered_fields:
    - schema_version
    - handoff_candidate_ref
    - handoff_candidate_revision
    - handoff_candidate_fingerprint
    - intent_candidate_ref
    - intent_candidate_revision
    - intent_candidate_fingerprint
    - owner_commitment_set_fingerprint
    - canonical_candidate_history_fingerprint
    - minimum_trusted_event_sequence
  field_profiles:
    schema_version: {type: string, const: agents-os.m0b.synthetic-home-intent-payload.v0.1}
    handoff_candidate_ref: {type: stable_ref}
    handoff_candidate_revision: {type: positive_safe_integer}
    handoff_candidate_fingerprint: {type: lowercase_sha256}
    intent_candidate_ref: {type: stable_ref}
    intent_candidate_revision: {type: positive_safe_integer}
    intent_candidate_fingerprint: {type: lowercase_sha256}
    owner_commitment_set_fingerprint: {type: lowercase_sha256}
    canonical_candidate_history_fingerprint: {type: lowercase_sha256}
    minimum_trusted_event_sequence: {type: positive_safe_integer}
  additional_properties: false
  raw_or_private_content_fields: forbidden

canonical_derivations:
  payload_bytes: JCS(home_intent_payload_exact_object)
  payload_fingerprint: SHA256(payload_bytes)
  payload_schema_fingerprint: SHA256(JCS([agents-os.m0b.home-intent-payload-schema.v0.1,exact_ordered_fields,field_profiles,additional_properties_false]))
  command_id_digest: SHA256(JCS([agents-os.m0b.home-intent-command-id.v0.1,handoff_candidate_ref,handoff_candidate_revision,handoff_candidate_fingerprint,intent_candidate_ref,intent_candidate_revision,intent_candidate_fingerprint,owner_commitment_set_fingerprint,canonical_candidate_history_fingerprint,minimum_trusted_event_sequence]))
  command_id: command:SYNTHETIC_TEST:home-intent:{command_id_digest}
  canonical_command_bytes: JCS(existing_closed_command_envelope_with_exact_payload)
  canonical_command_fingerprint: SHA256(canonical_command_bytes)
  NAPI_request_bytes: JCS(existing_execute_command_request_with_request_id_equal_command_id)
  request_fingerprint: SHA256(NAPI_request_bytes)
  replay_identity: [command_id, request_fingerprint, NAPI_request_bytes]
  idempotency_key: SHA256(JCS([agents-os.m0b.home-intent-idempotency.v0.1,command_id,request_fingerprint]))

F3_terminal_mapping:
  COMMITTED:
    disposition: COMMITTED
    response_code: HOME_INTENT_COMMAND_COMMITTED_SYNTHETIC
    event_kind: F3_SYNTHETIC_HOME_INTENT_COMMITTED
    event_aggregate_ref: command_id
    event_aggregate_revision: 1
    first_event_count: 1
    first_external_call_count: 0
    rows_written_in_one_transaction:
      - inbox_command
      - command_envelope
      - event
      - replay_index
  VALIDATION_REJECTED:
    disposition: REJECTED
    response_code: INVALID_HOME_INTENT_COMMAND
    event_kind: null
    first_event_count: 0
    first_external_call_count: 0
    rows_written: 0
  CONTRACT_NOT_ACTIVE:
    disposition: INDETERMINATE
    response_code: CONTRACT_NOT_ACTIVE
    event_kind: null
    first_event_count: 0
    first_external_call_count: 0
    rows_written: 0
  PROTOCOL_CONFLICT:
    disposition: REJECTED
    response_code: PROTOCOL_CONFLICT
    event_kind: null
    additional_event_count: 0
    additional_external_call_count: 0
    returns_prior_response: false
  EXACT_REPLAY:
    disposition: COMMITTED
    response_code: HOME_INTENT_COMMAND_COMMITTED_SYNTHETIC
    additional_event_count: 0
    additional_external_call_count: 0
    returned_response_bytes: exact_first_response_bytes
    returned_accounting: exact_first_accounting

boundary:
