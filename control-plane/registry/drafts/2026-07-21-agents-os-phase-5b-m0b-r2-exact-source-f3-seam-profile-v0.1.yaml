      transaction_owner: ledger_transaction_commit_home_candidate
    - operation: FORM_F8_HANDOFF_LINK
      reducer_owner: home_handoff
      ledger_command: CommitHomeHandoff
      receiver: existing_LedgerThread
      connection_owner: existing_LedgerThread_only
      transaction_owner: ledger_transaction_commit_home_handoff
