archive_encoding:
  format: POSIX_USTAR
  compression: NONE
  byte_stream: complete_raw_tar_bytes
  checksum_algorithm: SHA-256
  checksum_preimage: complete_raw_tar_bytes_including_two_512_byte_zero_blocks
  root_prefix: agents-os-resident/
  explicit_directory_entries: forbidden
  regular_files_only: true
  member_order: UTF8_BYTEWISE_ASCENDING_SOURCE_PATH
  path_separator: FORWARD_SLASH_ONLY
  reject_absolute_traversal_backslash_duplicate_or_non_NFC_paths: true
  member_manifest:
    algorithm: SHA-256
    preimage: canonical_JSON_array_of_exact_member_projection_rows
    encoding: UTF-8
    object_key_order: LEXICOGRAPHIC_SORTED
    separators: NO_INSIGNIFICANT_WHITESPACE
    row_field_inventory: [source_path, archive_path, kind, mode, uid, gid, uname, gname, mtime, byte_length, sha256]
  header:
    mode_octal: '0644'
    uid: 0
    gid: 0
    uname: ''
    gname: ''
    mtime_unix_seconds: 0
    pax_headers: forbidden
    hardlinks_symlinks_devices_named_pipes: forbidden
  end_of_archive_zero_blocks: 2

output_lifecycle:
  caller_supplied_output_path: forbidden
  staging_root: newly_created_owned_synthetic_temporary_directory
  archive_location_before_delivery: owned_temp_root/archive.tar
  delivery_mode: RETURN_IN_MEMORY_BYTES_ONLY
  serialized_success_return_fields: [archive_sha256, archive_byte_length, archive_bytes_in_memory_b64]
  serialized_failure_return_fields: [stable_error_code]
  success_events:
    - {ordinal: 1, event: STAGING_ROOT_CREATED, location: OWNED_TEMP_ROOT}
    - {ordinal: 2, event: ARCHIVE_WRITTEN, location: OWNED_TEMP_ROOT}
    - {ordinal: 3, event: ARCHIVE_HASH_VERIFIED, location: OWNED_TEMP_ROOT}
    - {ordinal: 4, event: ARCHIVE_COPIED_TO_MEMORY, location: MEMORY_ONLY}
    - {ordinal: 5, event: STAGING_ROOT_REMOVED, location: OWNED_TEMP_ROOT}
    - {ordinal: 6, event: SUCCESS_RETURNED, location: MEMORY_ONLY}
  failure_events:
    - {ordinal: 1, event: STAGING_ROOT_CREATED, location: OWNED_TEMP_ROOT}
    - {ordinal: 2, event: FAILURE_DETECTED, location: OWNED_TEMP_ROOT}
    - {ordinal: 3, event: STAGING_ROOT_REMOVED, location: OWNED_TEMP_ROOT}
    - {ordinal: 4, event: FAILURE_RETURNED, location: NO_ARCHIVE_BYTES}
  actual_observation_contract:
    initial_owned_root_inventory: []
    success_before_cleanup_inventory: [archive.tar]
    failure_before_cleanup_inventory: []
    post_cleanup_owned_root_exists: false
    post_cleanup_residue_relative_paths: []
  required_negative_actual_probes:
    - CLEANUP_RESIDUE_DETECTED
    - RETURN_BYTES_MISMATCH_DETECTED

