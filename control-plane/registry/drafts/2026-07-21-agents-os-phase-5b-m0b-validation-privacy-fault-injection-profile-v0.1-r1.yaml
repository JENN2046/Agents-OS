date: 2026-07-21
status: fixed_for_hash_bound_independent_review
runtime_usable: false

test_environment:
  profile: SYNTHETIC_TEST
  domain_tag: PHASE_5B_M0B_PLAN_R1_SYNTHETIC_NONAUTHORITY
  network: forbidden
  provider: forbidden
  active_runtime_config: forbidden
  production_credentials: forbidden
  private_raw_memory: forbidden
  state_private: forbidden
  database: per_test_temporary_directory_only_after_implementation_start
  VCPToolBox_server_start: forbidden
  plugin_manifest_state: blocked
  deterministic_clock_principals_and_owner_assessments: required

validation_layers:
  - id: L1
    name: closed_schema_and_canonical_primitives
    required: true
    cases:
      - duplicate_JSON_keys_rejected
      - float_NaN_Infinity_and_unsafe_integer_rejected
      - non_NFC_string_rejected
      - unknown_field_enum_type_and_nullability_rejected
      - bool_is_not_integer
      - canonical_bytes_and_SHA256_recomputed
  - id: L2
    name: session_nonpromotion
    required: true
    cases:
      - ephemeral_discard_and_remain_make_zero_canonical_writes
      - missing_or_unknown_branch_fails_closed
      - ordinary_conversation_has_zero_Goal_Task_or_candidate_writes
      - ordinary_thought_cannot_promote
  - id: L3
    name: F7_candidate_revision
    required: true
    cases:
      - explicit_Life_Stream_candidate_only
      - observe_and_discard_do_not_promote
      - explicit_Memory_Candidate_is_not_Memory
      - explicit_Intent_Candidate_is_not_Command
      - exact_predecessor_and_current_head
      - same_revision_changed_content_rejected
  - id: L4
    name: F8_handoff_composition
    required: true
    cases:
      - exact_owner_commitment_tuple_required
      - exact_canonical_candidate_history_required
      - phantom_candidate_rejected
      - minimum_Event_watermark_enforced
      - direct_Task_Command_or_effect_request_rejected
      - relationship_trust_or_PBL_no_match_never_creates_authority
  - id: L5
    name: F3_synthetic_Command_seam
    required: true
    cases:
      - existing_execute_command_is_only_NAPI_entry
      - adapter_cannot_write_F3_rows
      - F3_committed_rejected_and_indeterminate_outcomes_projected
      - exact_replay_owned_by_F3
      - synthetic_command_definition_rejected_outside_SYNTHETIC_TEST
  - id: L6
    name: SQLite_atomicity_recovery_and_privacy
    required: true
    cases:
      - v1_to_v2_migration_only_in_temporary_test_database
      - candidate_Event_head_commit_together
      - handoff_link_Event_commit_together
      - rollback_has_no_partial_row_or_pointer
      - quick_check_PASS_and_foreign_key_check_empty
      - raw_content_private_Memory_provider_or_credential_scan_empty
  - id: L7
    name: inherited_M0A_and_packaging
    required: true
    cases:
      - every_Phase_5A_test_remains_PASS
      - five_NAPI_methods_unchanged
      - one_writer_one_connection
      - no_new_dependency_or_lock_change
      - VCPToolBox_core_diff_zero
      - blocked_manifest_not_discoverable
      - deterministic_package_manifest_and_content_tree

