    - private_memory
    - provider_response
    - credential
    - token
    - cookie
    - secret
    - audio_payload
    - image_payload
    - sensor_payload
  scope:
    - NAPI_frames
    - canonical_requests
    - SQLite_schema_and_rows
    - Event_payloads
    - receipts_and_diagnostics
  match_result: BLOCK
  payload_echo_in_failure_output: forbidden

