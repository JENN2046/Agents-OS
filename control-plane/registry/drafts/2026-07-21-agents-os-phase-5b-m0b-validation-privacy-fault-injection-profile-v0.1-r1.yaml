crash_matrix:
  mechanism: future_subprocess_failpoint_and_forced_exit
  failpoints:
    - before_candidate_BEGIN_IMMEDIATE
    - after_candidate_insert
    - after_candidate_Event
    - after_candidate_head_CAS_before_COMMIT
    - after_candidate_COMMIT_before_response
    - before_handoff_BEGIN_IMMEDIATE
    - after_candidate_currentness_recheck
    - after_handoff_link_insert
    - after_handoff_Event_before_COMMIT
    - after_handoff_COMMIT_before_F3_submission
    - after_F3_commit_before_acknowledgement_projection
  required_post_restart_invariants:
    - no_partial_candidate_Event_or_head_visible
    - no_partial_handoff_link_or_Event_visible
    - exact_committed_candidate_replays_first_accounting
