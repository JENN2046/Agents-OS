node_contracts:
  route:
    required_fields: [operation, ledger_command, receiver, connection_owner, transaction_owner]
    connection_owner_const: existing_LedgerThread_only
  owner_commitment:
    required_fields: [owner, commitment_ref, commitment_revision, commitment_fingerprint, issued_event_sequence, result, current_head]
    current_head_type: strict_boolean
  candidate_revision:
    required_fields: [candidate_id, candidate_revision, candidate_ref, semantic_class, source_ref, source_revision, source_fingerprint, payload_commitment, predecessor_ref, predecessor_fingerprint, created_event_sequence]
  history:
    required_fields: [ordered_candidate_refs, ordered_candidate_fingerprints, latest_candidate_ref, latest_candidate_fingerprint]
  handoff:
    required_fields: [handoff_ref, handoff_revision, intent_candidate_ref, intent_candidate_revision, intent_candidate_fingerprint, owner_commitment_set_fingerprint, canonical_candidate_history_fingerprint, minimum_trusted_event_sequence]
  command:
    required_fields: [command_type_id, command_type_revision, payload_fingerprint, command_id, command_fingerprint, request_fingerprint, idempotency_key]
  crash:
    required_fields: [transaction, failpoint, committed, visible_rows_after_restart, automatic_retry]

