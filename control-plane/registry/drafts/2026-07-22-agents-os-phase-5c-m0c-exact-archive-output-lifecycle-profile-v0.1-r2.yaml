    - {ordinal: 3, event: ARCHIVE_HASH_VERIFIED, location: OWNED_TEMP_ROOT}
    - {ordinal: 4, event: ARCHIVE_COPIED_TO_MEMORY, location: MEMORY_ONLY}
    - {ordinal: 5, event: STAGING_ROOT_REMOVED, location: OWNED_TEMP_ROOT}
    - {ordinal: 6, event: SUCCESS_RETURNED, location: MEMORY_ONLY}
  failure_events:
    - {ordinal: 1, event: STAGING_ROOT_CREATED, location: OWNED_TEMP_ROOT}
    - {ordinal: 2, event: FAILURE_DETECTED, location: OWNED_TEMP_ROOT}
    - {ordinal: 3, event: STAGING_ROOT_REMOVED, location: OWNED_TEMP_ROOT}
    - {ordinal: 4, event: FAILURE_RETURNED, location: NO_ARCHIVE_BYTES}
  residue_relative_paths_after_return: []
  success_return_fields: [archive_sha256, archive_byte_length, archive_bytes_in_memory]
  failure_return_fields: [stable_error_code]

