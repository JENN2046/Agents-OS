schema_version: agents-os.document-registry.v0.1-draft
status: draft_example_not_active
date: 2026-07-01
scope: control-plane/registry documentation governance pilot
notes:
  - "This is a document registry example, not active authority data."
  - "Markdown/YAML files are the source of truth; future databases may only be rebuildable caches."
  - "This registry must not list sensitive source paths such as state-private, .env files, secrets, private memory raw text, or provider raw responses."
  - "This registry does not authorize bulk moves, external writes, runtime execution, provider calls, or formal Memory registration."

document_types:
  - index
  - overview
  - tutorial
  - how_to
  - runbook
  - reference
  - explanation
  - decision_record
  - policy
  - registry
  - contract
  - schema
  - template
  - example
  - receipt
  - review
  - incident_review
  - archive_note

statuses:
  - draft
  - review_needed
  - active
  - accepted
  - superseded
  - deprecated
  - archived
  - example
  - blocked

field_matrix:
  stage: document-governance-9.5-stage-1
  mode: strict_for_current_registry
  required_value_fields:
    all_statuses:
      - title
      - scope
      - owner
      - canonical_path
      - source_of_truth
      - last_reviewed
      - review_by
      - freshness
      - security_boundary
      - validation
  required_key_fields:
    all_statuses:
      - supersedes
      - superseded_by
      - related
  migration_notes:
    - superseded records without superseded_by remain warning-level until reviewed backfill is complete
    - lifecycle_transition is optional metadata, but if present it must match an allowed transition

lifecycle:
  stage: document-governance-9.5-stage-1
  statuses:
    - draft
    - review_needed
    - active
    - accepted
    - superseded
    - deprecated
    - archived
    - example
    - blocked
  allowed_transitions:
    - from: draft
      to: review_needed
    - from: draft
      to: active
    - from: draft
      to: accepted
    - from: draft
      to: archived
    - from: review_needed
      to: draft
    - from: review_needed
      to: active
    - from: review_needed
      to: accepted
    - from: active
      to: superseded
    - from: active
      to: deprecated
    - from: active
      to: archived
    - from: accepted
      to: superseded
    - from: accepted
      to: deprecated
    - from: accepted
      to: archived
    - from: deprecated
      to: superseded
    - from: deprecated
      to: archived
    - from: superseded
      to: archived
    - from: example
      to: example
    - from: blocked
      to: draft
    - from: blocked
      to: archived
  hard_rules:
    - example records cannot auto-promote to active
    - archived records cannot auto-promote to canonical active documents
    - optional lifecycle_transition.to must match the current document status

