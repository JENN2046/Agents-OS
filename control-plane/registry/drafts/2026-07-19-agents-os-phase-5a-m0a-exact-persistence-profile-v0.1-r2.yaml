dedicated_row_class_mapping:
  COMMAND_DEFINITION: command_definition
  COMMAND_INBOX: inbox_command
  COMMAND_ENVELOPE: command_envelope
  COMMAND_REPLAY_RESULT: replay_index
  EVENT: event
  OUTBOX_INTENT: outbox_intent
  OUTBOX_CLAIM: outbox_claim
  DELIVERY_ATTEMPT: delivery_attempt
  DISPATCH_ARM_AND_STORED_FIRST_ACCOUNTING: dispatch_arm
  DELIVERY_RECEIPT: delivery_receipt
  FIRST_APPLY_ELIGIBILITY: first_apply_guard
  TASK_COMPLETION: task_completion

transaction_owners:
  command_intake:
    writes: [inbox_command, command_envelope, event, replay_index]
    atomicity: one_BEGIN_IMMEDIATE_commit_or_zero_rows
  canonical_fact_advance:
    writes: [event, canonical_fact, current_fact_pointer]
    atomicity: insert_fact_and_event_plus_pointer_CAS_or_zero_rows
  outbox_enqueue:
    writes: [event, outbox_intent]
    atomicity: one_BEGIN_IMMEDIATE_commit_or_zero_rows
  outbox_claim:
    writes: [event, outbox_claim]
    atomicity: exact_current_claim_epoch_CAS_or_zero_rows
  dispatch_arm:
    writes: [event, delivery_attempt, dispatch_arm]
    atomicity: prebranch_replay_check_then_first_arm_once_or_exact_stored_replay
  receipt_apply:
    writes: [event, delivery_receipt, first_apply_guard, canonical_fact, current_fact_pointer]
    atomicity: compatibility_currentness_and_first_apply_guard_same_transaction
  task_completion:
    writes: [event, canonical_fact, current_fact_pointer, task_completion]
    atomicity: recheck_all_current_inputs_and_DONE_CAS_same_transaction

crash_windows:
  - before_BEGIN: zero_rows_restart_safe
  - after_BEGIN_before_first_write: rollback_zero_rows
  - after_event_before_pointer_CAS: rollback_all_rows
  - after_dispatch_arm_before_mock_call: restart_reads_arm_and_returns_stored_first_accounting_without_new_call
  - after_mock_call_before_receipt: reconcile_to_UNKNOWN_no_automatic_retry
  - after_receipt_before_first_apply_guard: rollback_receipt_and_guard
  - after_commit_before_response: replay_index_or_dispatch_arm_returns_first_committed_result
  - completion_after_recheck_before_DONE: rollback_event_fact_pointer_and_completion

forbidden:
  - opaque_Event_payload_without_canonical_fact_kind
  - caller_supplied_table_name
  - dynamic_schema_expansion
  - JavaScript_SQL
  - second_connection
  - hidden_retry
  - production_database
