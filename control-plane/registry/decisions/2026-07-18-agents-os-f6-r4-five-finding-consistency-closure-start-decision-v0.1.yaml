decision_basis:
  source: Jenn_current_explicit_instruction_after_F6_R3_independent_BLOCK
  statement_summary: >-
    Jenn directed that R4 correct only five surfaces: one exact Task identity
    across Task, Requirement, Validation Set, attempt, completion and the F1
    Task assessment; exact equality between every consumer assessment revision
    and its resolved assessment; waiver expiry and currentness derived from
    TrustedTime; evidence subject binding to exact Requirement revision and
    attempt context; and strict Event order for attempt predecessors and carry
    sources. No other F6, F7, implementation or runtime scope is authorized.

