  - python3 -c "import hashlib,json,yaml; from pathlib import Path; p=yaml.safe_load(open('control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-sealed-source-inventory-v0.1-r2.yaml')); root=Path(p['source_root']); assert len(p['records']) == p['record_count']; assert hashlib.sha256(json.dumps(p['records'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest() == p['records_canonical_sha256']; assert all((root/r['source_path']).is_file() and (root/r['source_path']).stat().st_size == r['byte_length'] and hashlib.sha256((root/r['source_path']).read_bytes()).hexdigest() == r['sha256'] for r in p['records'])"
