  - python3 control-plane/registry/validate-phase-5c-m0c-plan-r3-structural-witness.py control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r3-structural-witness-v0.1.json --self-test
  - sh -c 't=$(mktemp); python3 control-plane/registry/build-phase-5c-m0c-plan-r3-structural-witness.py "$t" && cmp "$t" control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r3-structural-witness-v0.1.json; r=$?; rm -f "$t"; exit $r'
  - python3 -c "from pathlib import Path; ps=[Path(p) for p in ['control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-plan-r3-narrow-correction-amendment-v0.1.md','control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-exact-archive-output-lifecycle-profile-v0.1-r3.yaml','control-plane/registry/phase5c_m0c_r3_structural_core.py','control-plane/registry/build-phase-5c-m0c-plan-r3-structural-witness.py','control-plane/registry/validate-phase-5c-m0c-plan-r3-structural-witness.py','control-plane/registry/build-phase-5c-m0c-plan-r3-review-package.py']]; assert not [(p,i) for p in ps for i,l in enumerate(p.read_text().splitlines(),1) if l.rstrip()!=l]"

required_review_questions:
  - all_85_declared_inputs_match_and_are_fully_read
  - seven_subjects_form_one_atomic_R1_R2_preserving_R3_narrow_correction
  - all_46_sealed_extension_source_rows_are_rehashed_against_the_R2_source_inventory_profile
  - one_eleven_field_member_manifest_preimage_is_normative_and_matches_builder_fixture_and_validator
  - POSIX_ustar_no_compression_header_member_order_and_complete_raw_archive_checksum_preimage_are_exact
  - source_to_archive_member_mapping_is_closed_regular_file_only_and_deterministically_derived
  - synthetic_archive_bytes_are_constructed_parsed_and_returned_from_structural_records_not_claimed_determinism
  - success_failure_cleanup_residue_and_wrong_return_probes_are_actual_owned_temp_root_observations_and_fail_closed
  - complete_ZIP_runs_all_eight_fixed_commands_after_no_Git_extraction_without_missing_dependency
  - sealed_VCPToolBox_commit_path_blob_and_SHA_records_are_exactly_consumed_without_worktree_access
  - entrypoint_bytes_derive_CommonJS_exports_and_lazy_native_load_placement
  - native_NAPI_surface_remains_exactly_five_methods
  - every_R1_and_R2_unrepresentable_attack_class_is_now_representable_and_semantically_rejected_after_full_resigning
  - no_second_plugin_loader_service_writer_permission_identity_Task_Command_or_effect_authority_exists
  - no_implementation_activation_database_private_Memory_provider_sensing_or_effect_is_authorized_or_performed
  - no_internal_contradiction_implementation_impossibility_or_legal_input_over_rejection_remains

independent_adversarial_minimum:
  - fully_resign_sealed_commit_path_blob_or_sha_substitution
  - add_remove_duplicate_reorder_or_replace_sealed_source_or_archive_inventory_members
  - use_symlink_traversal_absolute_backslash_or_caller_selected_output_paths
  - alter_entrypoint_to_eager_native_load_and_propagate_source_mapping_hashes
  - add_a_sixth_NAPI_method_or_enabled_plugin_manifest_evidence
  - alter_five_vs_eleven_field_member_manifest_preimage_ustar_metadata_checksum_member_order_or_raw_archive_bytes_and_fully_resign
  - forge_success_or_failure_return_bytes_cleanup_residue_or_actual_lifecycle_record_and_fully_resign
  - remove_the_R1_validator_or_R1_fixture_from_a_rebuilt_archive_and_confirm_self_containment_check_fails
  - add_unknown_fields_wrong_types_unsafe_integers_non_NFC_or_duplicate_JSON_keys
  - distinguish_target_semantic_rejections_from_stale_hash_or_fixture_seal_rejections

required_output_contract:
  schema_version: agents-os.hash-bound-independent-review.v0.1
  allowed_results: [PASS_NO_BLOCKER, BLOCK]
  must_report:
    - reviewer_identity_and_independence_basis
    - manifest_path_and_sha256
    - 85_hashes_and_full_reads
    - eight_fixed_commands_in_workspace_and_no_Git_extracted_archive
    - ZIP_SHA256_CRC_path_duplicate_symlink_traversal_and_CHECKSUMS_results
    - independent_fully_resigned_attack_count
    - semantic_rejection_count
    - favorable_invalid_path_count
    - legal_input_over_rejection_count
    - blocker_major_minor_counts
    - requires_R4

decision_gate:
  package_ready: true
  independent_review_started: false
  plan_freeze_ready: false
  automatic_freeze: forbidden
  automatic_implementation_start: forbidden

non_authorization:
