findings:
  blocker:
    - id: "F2-R18-V9-MCR-B01"
      title: "Delegation subject contains a materialization-created responsibility_scope_fingerprint field"
      source_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-14-agents-os-actor-identity-delegation-v0.1.draft.md"
          lines: "586-611"
          evidence: "The R1 DelegationGrantRevision subject contains responsibility_scope but no separate responsibility_scope_fingerprint field."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r3-amendment.draft.md"
          lines: "385-417"
          evidence: "The exact delegation issuance-intent projection contains responsibility_scope and no separate responsibility_scope_fingerprint position."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r7-amendment.draft.md"
          lines: "998-1024"
          evidence: "R7 replaces the scope value with ResponsibilityScopeV0_1R7, whose complete object already carries canonical_fingerprint; it does not add a separate Delegation subject field."
      materialization_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "1153-1188"
          evidence: "DelegationGrantRevisionV0_1R15Effective adds responsibility_scope_fingerprint at line 1166 while claiming the R3/R4 intent and subject formulas remain exact."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "2200,2252-2258"
          evidence: "The exhaustive index treats the polluted schema as source-exact and states source-field equality."
      impact: >-
        The added field is absent from R1-R18 and is not committed by the exact
        R3 issuance-intent projection. Retaining it either creates an unhashed
        semantic field or silently changes the source-defined known object and
        fingerprint contract. This violates source exactness and the prohibition
        on materialization-created semantics.
      required_correction: >-
        Remove the separate Delegation subject field and regenerate the schema,
        fingerprint description, and inventory from the R1/R3/R4/R7 effective
        source chain without adding an amendment-absent field.

    - id: "F2-R18-V9-MCR-B02"
      title: "Synthetic Binding activation provenance is not materialized consistently"
      source_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r8-amendment.draft.md"
          lines: "807-820"
          evidence: "For synthetic CREATE, Binding activation stewardship source is replaced by the exact SyntheticManifestDerivedLifecycleRef and no distinct synthetic action ref is invented."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r18-amendment.draft.md"
          lines: "263-287,289-310"
          evidence: "Synthetic M0 Binding activation has no separate BINDING_ACTIVATION action and consumes manifest assurance transitively."
      materialization_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "1288-1306"
          evidence: "The evidence schema retains only JENN_ROOT_BOOTSTRAP_DECISION or AUTHENTICATED_STEWARD_ACTION and states that every non-bootstrap mode requires all steward fields, including steward_action_ref."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "1346-1362"
          evidence: "The later assurance table instead says synthetic mode has no activation action and must be selected before stewardship-source rows."
      impact: >-
        The printed evidence contract cannot represent the R8 synthetic derived
        stewardship source without selecting a bootstrap/authenticated kind, and
        its all-non-bootstrap steward-action rule contradicts the R8/R18 no-action
        synthetic path. The schema and reducer therefore do not form one
        source-exact synthetic activation graph.
      required_correction: >-
        Materialize the R8 synthetic stewardship-source replacement and its exact
        conditional field rules explicitly, then keep the R18 assurance
        projection action-free and transitive without requiring or inventing a
        steward action.

  major:
    - id: "F2-R18-V9-MCR-M01"
      title: "The indexed complete Assignment reducer omits source-required assurance branches"
      source_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r15-amendment.draft.md"
          lines: "303-318"
          evidence: "The complete Assignment reducer requires INVALIDATED issuance assurance to produce REVOKED and CHALLENGED or INDETERMINATE assurance to produce INDETERMINATE."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "541-564"
          evidence: "Every directly affected assessment must apply the assurance mapping before ordinary object currentness and preserve safer effects."
      materialization_locations:
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "537-550,1052-1057"
          evidence: "Section 6.2 is called the sole complete Assignment reducer but does not print the R15 invalidated/challenged branches or explicitly compose the R16 prelude."
        - path: "/home/jenn/AGENTS_OS_Workspace/control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v9.draft.md"
          lines: "1710-1729,2239"
          evidence: "The common prelude is scoped to five later reducers, while the Assignment reducer index points only to Section 6.2."
      impact: >-
        Section 15 restates a high-level impact table, but the sole indexed
        Assignment reducer is not a source-exact, self-consistent definition of
        the R15/R16 reduction order. The 13/13 row count therefore does not prove
        reducer semantic completeness.
      required_correction: >-
        Integrate the R15 assurance branches and the R16 common reduction order
        into the indexed Assignment reducer, or define and index an explicit
        common prelude that unambiguously composes with every directly affected
        reducer.

  minor: []

