author_corrections_before_hash_fixing:
  - correction_id: F2-R7-SR-01
    issue: >-
      A first synthetic M0 shape placed completed Profile and Principal subjects
      inside a manifest that those subjects referenced, creating a fingerprint
      cycle.
    correction: >-
      The fixed R7 subject uses non-referential creation specs, then requires a
      separate Jenn decision to accept the exact manifest fingerprint before
      created subjects may reference it.
    outcome: CLOSED_BEFORE_HASH_FIXING
  - correction_id: F2-R7-SR-02
    issue: >-
      Activation assessments needed explicit transition inputs and effective
      Binding status needed exact mappings from Actor, Principal, Profile, and
      credential assessments.
    correction: >-
      Added transition refs to both activation assessments and a
      precedence-complete Binding effective reducer with separate activation
      and effective projections.
    outcome: CLOSED_BEFORE_HASH_FIXING
  - correction_id: F2-R7-SR-03
    issue: >-
      Profile and Principal lifecycle-controller authority and synthetic
      manifest acceptance basis were initially under-typed.
    correction: >-
      Added typed lifecycle-controller refs, exact profile-steward classes,
      credential-status-provider binding, and lifecycle action authority-basis
      fingerprints.
    outcome: CLOSED_BEFORE_HASH_FIXING
  - correction_id: F2-R7-SR-04
    issue: >-
      Compromise impact needed its own one-head revision stream, terminality,
      and exact clear-challenge target rule.
    correction: >-
      Added impact stream ID, revision/CAS, Event CAS, terminal invalidation,
      and exact challenged-target equality for clearing.
    outcome: CLOSED_BEFORE_HASH_FIXING
  - correction_id: F2-R7-SR-05
    issue: >-
      Binding and Delegation subjects lacked explicit missing current-head CAS
      additions, and Binding issuance needed bootstrap-safe provenance.
    correction: >-
      Added exact CAS overlays and typed Binding issuance routes that omit an
      Actor issuer for bootstrap, provisioning, and synthetic flows.
    outcome: CLOSED_BEFORE_HASH_FIXING

