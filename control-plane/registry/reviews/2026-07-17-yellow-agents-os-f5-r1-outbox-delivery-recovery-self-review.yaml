author_findings_closed_before_hash_fix:
  - id: F5-R1-ASR-01
    severity: blocker
    finding: >-
      The initial retry wording allowed a second arm after a
      PRE_EFFECT_NOT_EXECUTED attempt, conflicting with frozen F4 one-invocation
      and one-physical-claim semantics.
    correction: >-
      R1 now permits automatic replay only for pre-arm enqueue, claim, lease,
      and lost-reply work. Every post-arm outcome has
      automatic_retry_eligible=false; replacement requires a new upstream F4
      handoff.
    status: CLOSED
  - id: F5-R1-ASR-02
    severity: major
    finding: >-
      The first claim schema did not fingerprint-bind the F4-owned currentness
      observation consumed by the claim reducer.
    correction: >-
      Added exact claim observation ref/fingerprint and an observation_purpose
      enum separating CLAIM from the later DISPATCH_ARM observation.
    status: CLOSED
  - id: F5-R1-ASR-03
    severity: major
    finding: >-
      Claimant or authority INDETERMINATE originally collapsed into a stale
      reason and did not preserve total fail-closed result semantics.
    correction: >-
      Added CLAIMANT_UNAVAILABLE and AUTHORITY_UNAVAILABLE with deterministic
      precedence and INDETERMINATE results.
    status: CLOSED
  - id: F5-R1-ASR-04
    severity: major
    finding: >-
      Safe expired-lease reclaim was described as a fictional transition back
      to PENDING and the reducer rejected the realistic CLAIMED projection.
    correction: >-
      The reducer now accepts only an explicit expired pre-arm CLAIMED state,
      advances claim epoch previous-plus-one, and never erases the prior fact.
    status: CLOSED
  - id: F5-R1-ASR-05
    severity: major
    finding: >-
      An arm-time authority check alone did not state what happens when trusted
      time expires between transaction commit and adapter invocation.
    correction: >-
      Added no-scheduling-gap and immediate trusted-time rules. Expiry skips
      the adapter and records PRE_EFFECT_NOT_EXECUTED; restart or uncertainty
      becomes UNKNOWN without re-arm.
    status: CLOSED

