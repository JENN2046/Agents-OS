prior_finding_readjudication:
  - id: F1-IR-B01
    status: UNRESOLVED
    basis: >-
      R2 supplies a versioned total reducer, authority checks, evidence currentness,
      and fail-closed corruption behavior, but its CARRY_FORWARD predecessor is not
      an exact revision tuple. The remaining ambiguity is detailed in F1-R2-IR-B01.
  - id: F1-IR-B02
    status: RESOLVED
    basis: >-
      R2 Sections 3.1-3.3 synchronously bind current parent spec, parent criterion,
      delegation, and ancestry facts; fence achieved closure while stale; constrain
      non-achieved stale closure; and bind the actual assessment into closure.
  - id: F1-IR-B03
    status: UNRESOLVED
    basis: >-
      R2 Section 4 closes the canonical envelope, scalar, reference, duplicate, and
      array catalog gaps, but R2 introduces undefined semantic fingerprints as
      normative carry-forward gates. The remaining gap is detailed in F1-R2-IR-B02.
  - id: F1-IR-M01
    status: RESOLVED
    basis: >-
      R2 Sections 5.1-5.3 define a total disjoint role partition, exact supplemental
      coverage, exact binding cardinalities, and bidirectional frontier coverage.
  - id: F1-IR-M02
    status: RESOLVED
    basis: >-
      R2 Section 5.4 reduces leaf/container classification across every current
      membership for one task_id and applies the result consistently to progress
      and exact route support.
  - id: F1-IR-M03
    status: RESOLVED
    basis: >-
      R2 Sections 6.1-6.3 make CLOSED current meaning immutable and require explicit
      reopen revisions, pointer rebinding, non-current prior decisions, preserved
      history, and a new closure basis.
  - id: F1-IR-N01
    status: RESOLVED
    basis: >-
      R2 Section 1 replaces the inaccurate closure claim with proposal-only wording
      and preserves Jenn-only exact hash-bound acceptance.

blockers:
  - id: F1-R2-IR-B01
    severity: BLOCKER
    prior_finding_link: F1-IR-B01
    sections:
      - "R1 7.3 Current criterion decision"
      - "R2 2.1 Reducer identity and input"
      - "R2 2.2 Decision operations"
      - "R2 2.5 Carry-forward"
      - "R2 2.6 Total reduction"
    finding: >-
      Reducer identity is the exact tuple (goal_id, goal_spec_revision,
      criterion_id, criterion_revision), but CARRY_FORWARD validates only a
      source_decision_event_id from the "immediately preceding criterion revision."
      It does not bind or define the source goal_spec_revision, does not require the
      source tuple to be the immediate predecessor in the current GoalSpec lineage,
      and does not define the predecessor when a new GoalSpec keeps the same
      criterion revision. One criterion revision can occur in multiple GoalSpec
      tuples with distinct heads, so implementations can disagree about whether a
      named source is eligible or can carry an older satisfied head past a newer
      exact-tuple head. The Event bytes choose a source ID but the contract does not
      totally decide source validity.
    impact: >-
      Criterion currentness and CLOSED plus ACHIEVED can depend on a non-canonical
      predecessor interpretation, defeating the promised total reducer and the
      exact GoalSpec currentness boundary.
    required_amendment: >-
      Put the full source tuple in every CARRY_FORWARD Event and define one total
      predecessor relation for both cases: a GoalSpec revision change with the same
      criterion revision, and a criterion revision advance. Require the exact latest
      eligible predecessor head in the current spec/criterion lineage, reject skips
      and branches, and bind its decision fingerprint and reducer version.

  - id: F1-R2-IR-B02
    severity: BLOCKER
    prior_finding_link: F1-IR-B03
    sections:
      - "R2 2.5 Carry-forward"
      - "R2 4.1 Fingerprint envelope"
      - "R2 4.2 Scalar and object normalization"
      - "R2 6.2 Explicit reopen"
    finding: >-
      R2 makes "criterion_summary semantic fingerprint unchanged" and
      "REOPEN_CARRY_FORWARD requires semantic fingerprint equality" authoritative
      gates, but it defines neither semantic fingerprint value shape, field
      projection, contract version, nor comparison inputs. Section 4 defines the
      envelope and canonicalization of an entire normalized F1 value; that full
      value necessarily includes revision/provenance fields that change across the
      revisions being compared and therefore cannot supply the unstated semantic
      projection. Natural-language semantic equivalence also cannot be inferred by
      the deterministic Rust reducer.
    impact: >-
      Implementations can compare different field subsets or can make
      REOPEN_CARRY_FORWARD and criterion CARRY_FORWARD permanently unreachable.
      Replay cannot verify that the same semantic equality rule was used.
    required_amendment: >-
      Define versioned, typed semantic-fingerprint projections for criterion
      carry-forward and GoalSpec reopen carry-forward, enumerate included and
      excluded fields, use the Section 4 FingerprintEnvelope, bind the projection
      contract version in the Event, and require exact digest equality. Ambiguous
      natural-language equivalence must fail closed to REOPEN_REVISED or a new
      authoritative criterion decision.

