    correction: >-
      Added an explicit paired cross-writer fixture and limited rejection to
      empty, duplicate, wildcard, unknown, or invalid-revision contexts.
    outcome: CLOSED

blocker_readjudication:
  - finding_id: F2-R3-IR-B01
    result: RESOLVED_IN_R4
    basis: >-
      BindingScopeV0_1 is a closed exact-set value with deterministic tuple
      sorting and an exact fingerprint. Proof, action, and acknowledgement refs
      have complete canonical projections. Both evidence replay identities,
      evidence fingerprints, and assessment fingerprints have exact
      domain-separated JCS field lists and self-field exclusions. The removed
      acknowledging_action_ref appears in no normative formula.
  - finding_id: F2-R3-IR-B02
    result: RESOLVED_IN_R4
    basis: >-
      AuthenticatedActorActionRef now has a complete fingerprint covering every
      R2 field. The final grant subject binds that fingerprint and F3 contract
      version after the action commits while the action continues to bind only
      the earlier issuance intent, preserving the acyclic order.

