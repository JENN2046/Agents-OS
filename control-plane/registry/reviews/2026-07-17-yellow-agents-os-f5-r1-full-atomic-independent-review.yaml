finding_ids_with_exact_evidence_counterexample_and_required_correction:
  - finding_id: F5_R1_BLOCKER_001_ARM_REPLAY_RELATION_NOT_CLOSED
    severity: blocker
    status: OPEN_REQUIRES_R2
    exact_evidence:
      - >-
        The normative contract at Section 4.7 lines 365-366 requires exact arm
        replay to return the first arm accounting and changed bytes to be an
        integrity failure; Section 13 lines 829-831 requires both adversarial
        decisions independently.
      - >-
        The fixed ARM_DUPLICATE vector has only already_armed=true and
        integrity=true and expects result=NOT_EXECUTABLE,
        primary_reason=ALREADY_ARMED. The ARM_INTEGRITY vector instead has
        already_armed=false and integrity=false. Neither vector carries an
        exact-byte-versus-changed-byte relation for an existing arm identity.
      - >-
        Builder evaluate(arm) lines 345-384 and validator independent_reduce(arm)
        lines 187-207 reduce only already_armed and a caller-precomputed
        integrity boolean; they cannot derive exact replay versus changed bytes
        under the same arm identity.
    counterexample: >-
      After one ARMED fact commits, submit the byte-identical arm request again.
      The contract requires replay of the first accounting with no second call,
      but the only fixed duplicate vector returns NOT_EXECUTABLE/ALREADY_ARMED.
      Submit changed arm bytes under the same identity and the same reducer has
      no canonical replay-relation input that deterministically distinguishes
      that request from exact replay.
    impact: >-
      The one-time physical-effect seam lacks deterministic, hash-bound replay
      semantics across the atomic contract, fixture and validator. Exact replay
      and changed-byte conflict are required high-risk recovery cases.
    required_correction: >-
      Create R2 bytes that define an explicit arm request identity and canonical
      replay relation, separate reducer disposition from the persisted first
      ARMED fact, and add fixed independent vectors for FIRST_APPLY,
      EXACT_DUPLICATE_REPLAY with no Event and no call, and
      CHANGED_BYTES_SAME_IDENTITY with integrity conflict. Rebuild and freshly
      validate the complete atomic bundle.

  - finding_id: F5_R1_BLOCKER_002_VALIDATOR_CLAIM_EXCEEDS_EXECUTABLE_COVERAGE
    severity: blocker
    status: OPEN_REQUIRES_R2
    exact_evidence:
      - >-
        Contract Section 14 lines 863-866 says the validator independently
        computes all object fingerprints, derived identity formulas, transition
        legality and negative mutations, and must reject a merely byte-equal but
        semantically invalid fixture.
      - >-
        The validator contains schema field inventories and reducers only for
        enqueue, claim, lease, arm, attempt, receipt dedup mode and recovery
        window. Neither executable subject contains any of the five normative
        derived-ID domains agents-os.f5-outbox-intent-id.v0.1,
        agents-os.f5-outbox-claim-id.v0.1,
        agents-os.f5-outbox-claim-fence.v0.1,
        agents-os.f5-delivery-attempt-id.v0.1 or
        agents-os.f5-dispatch-arm-id.v0.1.
      - >-
        The fixture contains field profiles rather than instances of the twelve
        production schemas, so their object fingerprints, derived identities,
        receipt-kind/status compatibility and state-transition legality cannot
        be recomputed. The 15 mutations at validator lines 424-502 do not add
        those absent checks.
      - >-
        Mandatory Section 13 attacks not independently encoded include lease
        upper-bound comparison, exact-versus-changed arm replay, caller-selected
        idempotency key, old-epoch terminal advancement, reconciliation attempt
        creation, recovery-barrier bypass and PBL/role influence.
    counterexample: >-
      The current fixture can pass with no F5OutboxIntent, F5OutboxClaimFact,
      F5DispatchArmFact or F5DeliveryReceipt object instance at all. Therefore
      the validator reports PASS without ever recomputing outbox_intent_id,
      claim_id, claim_fencing_token, attempt_id, dispatch_arm_id, the transition
      table, or a receipt-kind/status pair. This directly falsifies the declared
      validation surface even though the reported 13/64/15 counts reproduce.
    impact: >-
      Validator PASS is insufficient evidence for the semantic claims that the
      acceptance unit itself says it validates. A byte-equal fixture and
      mutually mirrored reducer tables can conceal central identity, replay and
      transition errors.
    required_correction: >-
      R2 must either narrow the normative validator claim and review gate to the
      actual limited witness surface, or preferably extend the deterministic
      fixture with canonical instances and derived identities for every schema,
      complete transition and replay vectors, and each mandatory adversarial
      case. The independent validator must recompute those values without
      importing builder logic and include fully resigned negative mutations.

  - finding_id: F5_R1_MAJOR_001_REASON_PRECEDENCE_NOT_NORMATIVELY_TOTAL
    severity: major
    status: OPEN_REQUIRES_R2
    exact_evidence:
      - >-
        Contract Section 6 lines 632-635 requires multiple failures to use the
        fixed precedence declared by the relevant schema.
      - >-
        Sections 4.5, 4.6 and 4.7 lines 266-348 enumerate possible
        primary_reason literals for claim, lease and arm but do not declare
        their fixed precedence. Their literal order is not the order used by
        builder lines 280-384 or validator lines 138-207.
      - >-
        Only one selected multi-failure vector exists for each of claim, lease
        and arm, which does not totalize all simultaneous-failure combinations.
    counterexample: >-
      A claim with integrity=false and terminal=true has both
      INTEGRITY_FAILURE and TERMINAL_ALREADY_RECORDED true. The executable
      reducers choose INTEGRITY_FAILURE, while the schema provides no normative
      precedence list and lists TERMINAL_ALREADY_RECORDED before
      INTEGRITY_FAILURE in its enum surface. Two implementations can therefore
      emit different primary reasons while each claims schema compliance.
    impact: >-
      Claim, lease and arm result/reason totality is an explicit required review
      question and is not closed by the normative bytes.
    required_correction: >-
      Add explicit normative precedence lists for claim, lease and arm, align
      builder and validator to those lists, and add pairwise or otherwise
      complete multi-failure vectors proving the order and sorted full reason
      sets.

  - finding_id: F5_R1_MAJOR_002_RECEIPT_KIND_STATUS_MATRIX_NOT_CLOSED
    severity: major
    status: OPEN_REQUIRES_R2
    exact_evidence:
      - >-
        Contract Section 4.8 lines 396-412 makes ACKED, SUCCEEDED, FAILED,
        UNKNOWN and PRE_EFFECT_NOT_EXECUTED disjoint at attempt level and states
        that ACKED is not completion.
      - >-
        Section 4.9 lines 430-431 declares receipt_kind and effect_status as two
        independent enums but provides no allowed or rejected compatibility
        matrix, including the polymorphic EFFECT_QUERY_RESULT case.
      - >-
        Builder and validator receipt reducers examine only NEW,
        EXACT_DUPLICATE and CHANGED_SAME_KEY; no receipt vector contains
        receipt_kind or effect_status.
    counterexample: >-
      A structurally schema-valid receipt with receipt_kind=TRANSPORT_ACK and
      effect_status=SUCCEEDED passes the declared field enums. The prose says
      ACK cannot prove completion, but the atomic bundle supplies no
      deterministic receipt compatibility reducer or vector that rejects this
      exact pair. EFFECT_QUERY_RESULT pairings are likewise unspecified.
    impact: >-
      ACK/FAILED/UNKNOWN/NOT_EXECUTED disjointness and the adversarial
      ACK-to-SUCCEEDED rejection are not mechanically closed at the receipt
      boundary.
    required_correction: >-
      Define a total receipt_kind by effect_status compatibility and evidence
      table, including EFFECT_QUERY_RESULT, epoch/fence currentness and terminal
      transition effects. Add positive and negative vectors and fully resigned
      mutations for every allowed and forbidden pairing.

