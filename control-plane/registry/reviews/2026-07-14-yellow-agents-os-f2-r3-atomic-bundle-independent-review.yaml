findings:
  - finding_id: F2-R3-IR-B01
    severity: BLOCKER
    title: The activation evidence and assessment fingerprint graph is still not fully canonical
    subject_locations:
      - subject: R2
        section: "5 Binding activation evidence"
        lines: "269-324"
      - subject: R2
        section: "6 Delegation activation evidence"
        lines: "339-382"
      - subject: R3
        section: "3 Acyclic binding activation fingerprint graph"
        lines: "181-263"
      - subject: R3
        section: "4 Acyclic delegation activation fingerprint graph"
        lines: "265-328"
    finding: >-
      R3 establishes the correct subject-to-evidence-to-assessment direction and exact stable
      evidence IDs, but three inputs within that graph remain non-deterministic. First, the
      binding subject fingerprint includes binding_scope and says to use its declared schema
      order, while R1-R3 never declare a BindingScope schema, canonical field projection, or
      opaque scope fingerprint. Second, BindingActivationAssessment and
      DelegationActivationAssessment contain canonical_fingerprint fields without an exact
      domain-separated projection or a rule stating precisely which fields are covered and
      excluded. Third, R2's delegation-evidence replay formula still names the R3-removed
      acknowledging_action_ref; R3 supplies an acknowledgement Command replay identity but no
      replacement replay identity for DelegationActivationEvidence itself. R2's binding-evidence
      replay formula also retains an unbound evidence_kind tuple rather than an exact
      domain-separated JCS projection. Because both evidence fingerprints include replay_identity,
      independent writers can still derive different evidence or assessment bytes from the same
      subject.
    impact: >-
      The graph is acyclic but not yet uniquely reproducible. Startup recovery can disagree on a
      binding subject, an activation evidence fingerprint, or an assessment fingerprint, and the
      removed acknowledgement field leaves delegation-evidence replay validation without a valid
      normative formula. These are deterministic contract defects in the exact area R3 must close.
    required_amendment: >-
      Define BindingScope as a closed canonical schema or replace it with one exact typed scope
      fingerprint. Give binding evidence, delegation evidence, and both assessments exact
      domain-separated JCS field projections, including nested-ref treatment and self-field
      exclusions. Replace both activation-evidence replay formulas with exact domain-separated
      JCS formulas; the delegation formula must bind the new acknowledgement ref or its exact
      replay/fingerprint value and contain no acknowledging_action_ref. Add cross-writer and
      startup-recovery fixtures that assert byte-identical IDs and fingerprints.

  - finding_id: F2-R3-IR-B02
    severity: BLOCKER
    title: The final delegation subject fingerprint does not commit the complete issuance action ref
    subject_locations:
      - subject: R2
        section: "2 Common external action-attribution interface"
        lines: "53-92"
      - subject: R3
        section: "5.2 Delegation grant issuance provenance"
        lines: "347-370"
      - subject: R3
        section: "5.3 Acyclic issuance-intent and grant-subject fingerprints"
        lines: "372-451"
    finding: >-
      R3 correctly breaks the issuance-action cycle by having the F3 action commit an issuance
      intent before the final grant subject exists. However, the immutable grant stores
      issuance_action_ref as the full AuthenticatedActorActionRef interface while the final
      subject fingerprint commits only action_ref_id, command_envelope_fingerprint, and
      F3_intake_event_sequence. It does not commit the ref's F3 contract version, Actor and
      identity revision, Principal and binding, authentication refs, responsibility source,
      delegation-chain fingerprint, prohibited-list revision, boundary evidence, or intake-state
      ref. Those omitted fields are exactly the provenance later rules rely on to prove who issued
      the grant and from which current responsibility. No accepted clause defines action_ref_id
      as a content address for all those fields or supplies an immutable action-ref fingerprint.
    impact: >-
      Two serialized DelegationGrantRevision subjects can differ in security-relevant issuance
      attribution while producing the same canonical grant fingerprint. Resolving the ID through
      a future F3 store may detect the mismatch, but the F2 subject fingerprint itself does not
      bind its declared immutable field and therefore cannot independently prove the claimed
      exact committed issuance action during recovery or cross-contract verification.
    required_amendment: >-
      Keep the acyclic intent-first order, but add a domain-separated canonical fingerprint for
      AuthenticatedActorActionRef that covers every declared field, and bind that fingerprint in
      the final delegation subject. Alternatively store only an immutable action ID whose
      accepted F3 contract explicitly makes it content-addressed over the complete ref. The
      final subject formula must bind the F3 contract version and exact action attribution without
      making the action depend on the final subject. Add a negative test that changes each omitted
      action-attribution field while holding the current three hashed fields constant.

prior_finding_disposition:
  - finding_id: F2-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R2 closes assignment source lineage, CAS, and kind/scope/time/depth attenuation, and R3
      forbids assignment self-issuance. Delegation issuance provenance remains cryptographically
      underbound by F2-R3-IR-B02.
  - finding_id: F2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R2 supplies typed activation evidence and R3 removes the circular subject-to-evidence
      pointer. F2-R3-IR-B01 leaves canonical scope, replay, and assessment projections incomplete.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_EXPLICIT_F3_OWNERSHIP_REPLACEMENT
    rationale: >-
      R2 precisely moves Command payload schema, canonicalization, nonce/replay intake, CAS,
      crash state, and domain handoff to F3 and keeps runtime intake closed until F3 is accepted.
  - finding_id: F2-IR-M01
    disposition: RESOLVED
    rationale: >-
      R2 defines the closed steward relation, authenticated stewardship action, complete affected
      binding set, set-equality check, exact compromise/recovery revisions, and atomic recovery.
  - finding_id: F2-R2-IR-B01
    disposition: RESOLVED
    rationale: >-
      R3's activation-purpose-only acknowledgement authenticates the exact delegate through an
      already-active binding, carries no responsibility source, rejects the pending grant as
      responsibility, binds the current Prohibited Behavior List, reserves replay identities,
      and atomically creates acknowledgement, evidence, assessment, and Event. It is an explicit
      F3 dependency and does not claim F3 is implemented or started.
  - finding_id: F2-R2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R3 establishes acyclic subject/evidence/assessment ordering and exact stable evidence IDs,
      but the complete graph remains non-canonical for the reasons in F2-R3-IR-B01.
  - finding_id: F2-R2-IR-B03
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R3 adds the exception-free assignment self-issuance invariant and reconstructable root,
      assignment, and parent grant rules. The final grant fingerprint still fails to bind the
      complete issuance-action attribution as described in F2-R3-IR-B02.

author_self_review_readjudication:
  - correction_id: F2-R3-SR-01
    disposition: DIRECTION_CONFIRMED_BUT_NOT_CANONICALLY_CLOSED
    rationale: >-
      The intent-before-action-before-subject order removes the cycle. The final subject's partial
      action-ref projection leaves the distinct underbinding defect in F2-R3-IR-B02.
  - correction_id: F2-R3-SR-02
    disposition: CONFIRMED
    rationale: >-
      R3 names its exact R1/R2 replacements and replaces R2 atomic acceptance with the R3 bundle.
  - correction_id: F2-R3-SR-03
    disposition: SEMANTIC_RULE_CONFIRMED_BUT_FINGERPRINT_BINDING_BLOCKED
    rationale: >-
      Root, assignment-rooted, and child rules bind issuance responsibility semantically, but the
      immutable subject fingerprint does not commit the complete action-attribution ref.

