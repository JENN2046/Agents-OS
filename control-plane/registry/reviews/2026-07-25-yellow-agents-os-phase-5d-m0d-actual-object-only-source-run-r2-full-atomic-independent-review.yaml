findings:
  - id: AOOSR-R2-BLOCKER-001
    severity: blocker
    title: Scanner code executes before its manifest hash is verified
    evidence:
      - runner_line_26_executes_scanner_with_runpy_run_path_at_module_import
      - bound_manifest_verification_begins_only_inside_run_actual_at_runner_line_607
      - scanner_hash_drift_is_therefore_detected_only_after_the_changed_scanner_has_already_executed
    impact: >
      The scanner is nominally hash-bound but is not verify-before-execute.
      A substituted scanner can perform arbitrary top-level Python behavior
      before the runner rejects its digest, defeating the stated executable
      subject boundary.
    required_disposition:
      - remove top-level scanner execution from runner import
      - verify manifest and scanner bytes before executing scanner code
      - execute only the already verified byte buffer or embed the reviewed scanner
      - add a negative test whose substituted scanner has a top-level side effect and prove the side effect cannot occur

  - id: AOOSR-R2-BLOCKER-002
    severity: blocker
    title: A signal pending during finalization can coexist with a success receipt and then terminate the process
    evidence:
      - block_for_finalizer_blocks_SIGINT_SIGTERM_SIGHUP_before_cleanup_and_receipt_write
      - the receipt is written while those signals remain blocked
      - SignalGuard_exit_restores_previous_handlers_before_restoring_the_previous_mask
      - independent_child_probe_queued_SIGTERM_in_the_masked_window
      - independent_child_probe_created_the_success_marker_then_exited_with_returncode_minus_15
    impact: >
      A catchable interruption that arrives before terminal receipt commit can
      be delivered only after a success receipt already exists. The process
      then terminates by signal while durable evidence claims success, so exit
      status and receipt semantics are contradictory.
    required_disposition:
      - define an explicit signal-safe terminal commit point
      - ensure a signal received before that point downgrades result and receipt to an interruption outcome
      - prevent a pending catchable signal from terminating the process after a success receipt is committed
      - add real subprocess tests for signals arriving during cleanup and receipt finalization

  - id: AOOSR-R2-BLOCKER-003
    severity: blocker
    title: Runner fixture mode still accepts and follows a caller-selected symlink path
    evidence:
      - argparse_exposes_fixture_as_an_unrestricted_Path_argument
      - load_json_no_duplicates_uses_Path_read_text_without_lstat_realpath_or_no_follow_checks
      - independent_probe_passed_a_random_tmp_symlink_to_the_valid_fixture
      - the_caller_selected_symlink_fixture_was_accepted_with_PASS_NO_BLOCKER
      - the_successor_package_claims_R2_executable_subjects_admit_no_caller_selected_paths
    impact: >
      The actual-capable runner can be directed to read arbitrary caller-chosen
      UTF-8 files through fixture mode, including symlink targets. Although the
      mode does not invoke Git, it violates the declared closed input surface
      and can cross protected-file read boundaries.
    required_disposition:
      - make fixture mode use only the exact hash-bound synthetic fixture path
      - or apply the same workspace-relative protected-path, regular-file, realpath and O_NOFOLLOW checks before reading
      - add protected-path and symlink fixture negative tests

