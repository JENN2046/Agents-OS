reviewer_diagnostic_incident:
  occurred: true
  description: >
    An initial helper-level finalizer probe attempted to redirect runner
    globals to a random temporary root, but runpy returned a mapping distinct
    from the function globals. The helper therefore created the literal run
    root twice without invoking actual mode or Git. The first instance was
    finalized immediately; the second was left by the probe exception and was
    then removed with the runner's exact non-recursive finalizer.
