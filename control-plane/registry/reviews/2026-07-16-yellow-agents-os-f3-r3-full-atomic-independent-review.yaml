findings:
  - id: F3-R3-FULL-ATOMIC-IR-M01
    severity: MAJOR
    title: Abandoned restore reservation makes its unconsumed lineage unretryable
    exact_section_evidence: >-
      R3 Section 3.4 requires a restore decision's new_restore_lineage_id never
      to have appeared in any reservation and says the decision is consumed only
      by one matching COMMITTED restore boundary. R3 Section 3.5 says a restore
      reservation with no bound ledger epoch is ABANDONED, after which recovery
      rechecks the decision and uses a later witness generation. The later
      reservation must still carry the exact lineage ID from that unconsumed
      decision, but that ID already appeared in the abandoned reservation.
    concrete_counterexample: >-
      Witness H=9 and restored ledger R=6. Jenn decision D names fresh lineage L.
      Startup reserves generation 10 for global epoch 10 and lineage L, then
      crashes before committing the ledger epoch. Recovery abandons generation
      10. D was not consumed, so retry generation 11 must use L; Section 3.4 now
      rejects L because it appeared in reservation 10. Choosing a new L changes
      D and requires a new Jenn decision, which is not the specified crash retry.
    impact: >-
      The explicit restore reducer has no total result for a mandatory crash
      window. It fails closed but cannot automatically complete or consistently
      classify the still-unconsumed decision, so crash-total restore semantics
      and the anti-rollback lineage closure are incomplete.
    required_correction: >-
      R4 must define a canonical retry lineage state. Permit later generations
      to reuse the exact lineage of the same still-unconsumed decision after an
      ABANDONED reservation while forbidding all competing decision/lineage use,
      or explicitly consume/replace the decision and define the complete new
      Jenn-decision transition. Bind the reservation retry chain and its terminal
      COMMITTED/ABANDONED uniqueness in closed schemas and crash rules.
    categories: [authority_restore_currentness, crash_totality, internal_contradiction]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M04, F3-R2-FULL-ATOMIC-IR-M02]

  - id: F3-R3-FULL-ATOMIC-IR-M02
    severity: MAJOR
    title: R3 canonical graphs remain fingerprinted as the R2 atomic bundle
    exact_section_evidence: >-
      R2 Section 1 defines
      F3_RESIDENT_SINGLETON_NAPI_IDENTITY_CONTINUITY_V0_1_R2_ATOMIC_BUNDLE as
      the effective bundle-version literal and explicitly substitutes it into
      every R1 field named F3_contract_version. R3 Sections 1 and 7 define an R3
      atomic acceptance unit but never explicitly replace that R2 substitution
      with an R3 literal. R3 Section 5.3 calls entries 30 and 39 effective R3
      CanonicalCommand objects without giving a different field value.
    concrete_counterexample: >-
      Materialize an activation Command, context, envelope, intake graph, and
      frozen F2 action/ack projection under the effective R1+R2+R3 precedence.
      Every F3_contract_version field remains the R2 literal. The same canonical
      activation bytes and replay key can therefore be presented as an R2 or R3
      graph even though R3 changes the pre-intake and authority semantics; no
      fingerprinted field binds the graph to the R3 atomic bundle.
    impact: >-
      The closed version boundary is internally inconsistent and replay evidence
      cannot prove which amendment semantics governed the commit. R3 acceptance
      would freeze canonical records that self-identify as the prior blocked
      bundle, creating one replay/version ambiguity.
    required_correction: >-
      R4 must explicitly define the effective R3-or-R4 bundle literal for every
      F3_contract_version field and propagate it through CanonicalCommand,
      AuthenticatedCommandContext, CommandEnvelope, intake/action/ack projections,
      fingerprints, and synthetic fixtures. If a stable schema-version literal
      is intended instead, add a separate canonical contract-bundle digest/ref
      that unambiguously binds the governing amendment set.
    categories: [replay_ambiguity, version_binding, internal_contradiction]
    prior_lineage: []

  - id: F3-R3-FULL-ATOMIC-IR-M03
    severity: MAJOR
    title: Synthetic activation has no complete registered CommandTypeDefinition
    exact_section_evidence: >-
      R1 Section 10.1 requires every CommandTypeDefinitionV0_1 to contain exact
      owner, payload ref/digest, target, responsibility, effect, reducer
      ref/digest, sorted gates, maximum duration, unknown-field policy, and
      canonical fingerprint. R1 Section 14.1 gives DELEGATION_ACTIVATION_ACK
      only command ID/version, responsibility/effect modes, target kind, and
      expected-revision policy. R3 Section 4 completes only DELEGATION_ISSUANCE.
      R3 Section 5 places issuance descriptors/definition at entries 26-28 but
      starts the activation Command at entry 39 with no activation descriptors
      or complete definition anywhere in the 57-entry manifest.
    concrete_counterexample: >-
      Two fixture builders choose different activation payload-schema digests,
      reducer digests, gate sets, maximum validity durations, definition refs,
      and canonical fingerprints while preserving every field displayed in R1
      Section 14.1. Both can claim to implement the partial activation type, but
      their CanonicalCommand fingerprints and gate/reducer behavior differ.
      A strict Section 10.1 decoder instead rejects both as unregistered.
    impact: >-
      Entry 39 cannot be deterministically constructed or admitted, so entries
      40-50 and the claimed issuance-to-activation/replay witness are not a
      concrete M0 proof. The prior synthetic-genesis lineage remains open.
    required_correction: >-
      R4 must provide exact no-newline payload and reducer descriptors plus one
      full DELEGATION_ACTIVATION_ACK CommandTypeDefinition instance and verified
      fingerprint. Add those exact objects to the closed synthetic vocabulary
      and predecessor mapping, updating cardinality/topology and every affected
      manifest fingerprint rule, or bind them to exact already-frozen named
      objects with complete digests and fields.
    categories: [M0_impossibility, missing_normative_schema]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M06, F3-R2-FULL-ATOMIC-IR-M03]

  - id: F3-R3-FULL-ATOMIC-IR-M04
    severity: MAJOR
    title: Seven claimed exact M0 mappings have no closed fingerprintable schema
    exact_section_evidence: >-
      R3 Section 5.1 requires every one of 57 entries to have a subject_ref and
      subject_fingerprint, and Section 5.3 calls its third column the exact
      schema/interface mapping. Rows 7, 8, and 9 name only a "current Jenn-root
      direction fact", a "frozen F2 trusted-time decision interface", and a
      "frozen F2 prohibited-boundary evidence interface" without exact named
      field-order schemas or fingerprint domains. Rows 25 and 55 name an "R1
      closed Resident readiness projection", while R1 Section 8 defines only
      lifecycle transitions and READY predicates, not a projection schema or
      fingerprint. Rows 36 and 46 similarly name "R1 closed" Event projections,
      but R1 Section 13 defines transaction relationships and no Event field-order
      schema or fingerprint domain.
    concrete_counterexample: >-
      Materializer A fingerprints a READY projection as [lifecycle, identity,
      epoch, generation, watermark]; materializer B additionally includes the
      witness fingerprint and contract heads. Both prove every R1 READY predicate
      and satisfy the descriptive row label, yet yield different entry-25 and
      entry-55 fingerprints. Equivalent divergence is possible for Event rows
      36/46 and the three descriptive F2 inputs. The fixed mapping cannot reject
      one as the wrong schema.
    impact: >-
      Enum cardinality/order and numeric topology are reproducible, but exact
      schema mapping is only 50/57. The manifest cannot validate all leaf bytes,
      detect a wrong schema for those kinds, or meet its own complete 57-entry
      constructive-witness claim.
    required_correction: >-
      R4 must bind each of the seven rows to one existing accepted named schema
      and exact fingerprint domain, or define a closed field order, conditional
      shape, ref derivation, and fingerprint formula for it. Recompute the
      mapping/topology and demonstrate all 57 or revised-count leaf objects from
      exact bytes rather than descriptive projection labels.
    categories: [M0_impossibility, missing_normative_schema]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M06, F3-R2-FULL-ATOMIC-IR-M03]

