findings:
  - id: F6-R1-IR-B01
    severity: blocker
    title: Task completion can combine PASSED attempts with a different current candidate or dependency context
    evidence: >-
      ValidationAttempt binds candidate and dependency refs, but Requirement
      reduction never compares them with completion_input's exact current
      candidate and dependency. Fully re-signed probes P14 and P15 remained
      SATISFIED and ELIGIBLE with mutually different contexts.
    required_correction:
      - bind_each_attempt_to_the_exact_current_TaskCommitmentSnapshot_revision_ref_and_fingerprint
      - bind_the_complete_dependency_authority_envelope
      - require_every_current_PASSED_head_to_match_the_completion_context
  - id: F6-R1-IR-B02
    severity: blocker
    title: F1-owned Task lifecycle is an unsigned caller field in the positive completion formula
    evidence: >-
      task_completion_context_fingerprint excludes task_lifecycle. The same
      unchanged F1 TASK_CURRENTNESS assessment accepted both VERIFYING and
      ACTIVE caller values after re-signing.
    required_correction:
      - consume_an_exact_F1_TaskCurrentState_or_TaskLifecycle_assessment
      - bind_lifecycle_and_exact_state_revision_in_the_assessment_subject
      - remove_unassessed_task_lifecycle_from_the_completion_formula
  - id: F6-R1-IR-B03
    severity: blocker
    title: Opaque upstream assessment subject revisions are carried but never consumed
    evidence: >-
      Six independent fully re-signed subject_revision substitutions were
      accepted, including validator authority revision 1 to 999.
    required_correction:
      - define_expected_subject_revision_for_every_owner_kind_pair
      - compare_subject_revision_at_each_consumer
      - reject_ref_fingerprint_matches_with_revision_mismatch
  - id: F6-R1-IR-B04
    severity: blocker
    title: Waiver grant authenticity and current Jenn authority are caller-asserted
    evidence: >-
      An arbitrary caller-selected Jenn decision ref and fingerprint retained
      CURRENT_ACCEPTED and produced an active WAIVED Requirement.
    required_correction:
      - bind_GRANT_to_exact_authenticated_F3_Command_and_committed_Event
      - bind_exact_Jenn_authority_assessment_or_accepted_decision_bytes
      - verify_current_binding_at_the_decision_barrier
  - id: F6-R1-IR-B05
    severity: blocker
    title: Requirement provenance and revision lineage do not prove source authority or predecessor existence
    evidence: >-
      Revision 2 without a predecessor was accepted; boolean true was accepted
      as predecessor revision 1; arbitrary JENN_EXPLICIT provenance was also
      accepted after re-signing.
    required_correction:
      - validate_complete_Requirement_revision_chain
      - require_actual_predecessor_object_and_fingerprint
      - reject_boolean_as_integer
      - bind_provenance_to_accepted_owner_assessment_and_authenticated_Command_Event
  - id: F6-R1-IR-B06
    severity: blocker
    title: Cross-object Event causality is not closed
    evidence: >-
      Requirements created after snapshot freeze and a waiver Event before its
      base snapshot were both accepted.
    required_correction:
      - enforce_Requirement_creation_before_containing_snapshot
      - enforce_base_snapshot_before_waiver_Event
      - enforce_waiver_head_before_consuming_snapshot
      - enforce_current_snapshot_before_attempt
  - id: F6-R1-IR-B07
    severity: blocker
    title: Claimed ten-schema closure and Requirement reducer totality are not actually proven
    evidence: >-
      The fixture contains no derived schema-profile inventory; the count 10 is
      hard-coded. Canonical decision outputs are not closed-schema instantiated.
      PASSED with NOT_APPLICABLE authority remained SATISFIED, and a
      FRESH_VALIDATION row with VALID carry-forward was accepted.
    required_correction:
      - materialize_closed_instances_for_all_ten_normative_schemas
      - derive_schema_count_from_validated_inventory
      - require_PASSED_authority_result_CURRENT_ACCEPTED
      - freeze_complete_cross_field_matrix
  - id: F6-R1-IR-M01
    severity: major
    title: evidence_refs is not an exact assessed evidence set
    evidence: >-
      Adding an unassessed stable ref while retaining the original assessment
      subject and digest was accepted.
    required_correction:
      - bind_sorted_unique_complete_evidence_refs_and_digests
      - reject_extra_duplicate_unsorted_or_partially_assessed_evidence
  - id: F6-R1-IR-M02
    severity: major
    title: Positive graph coverage omits canonical carry-forward and effectful F5-bound attempts
    evidence: >-
      The positive graph has zero carry-forward attempts and zero effectful
      Requirements; only simplified pre-labeled vectors exercise those seams.
    required_correction:
      - add_graph_level_carry_forward_positive_and_chain_attack
      - add_graph_level_effectful_F5_bound_positive_and_negative_cases
  - id: F6-R1-IR-m01
    severity: minor
    title: Author self-review mutation count text is stale
    evidence: >-
      F6-R1-ASR-05 says 30 root-re-signed probes while the fixed validator,
      manifest and later self-review fields report 32.
    required_correction:
      - record_as_historical_R1_count_error
      - use_32_in_R2_without_editing_R1_self_review

