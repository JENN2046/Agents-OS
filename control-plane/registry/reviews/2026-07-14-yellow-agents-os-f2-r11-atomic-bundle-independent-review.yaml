findings:
  - finding_id: F2-R11-IR-B01
    severity: BLOCKER
    title: Synthetic Binding precommit requires an Actor creation spec that cannot be a manifest member
    affected_sections:
      - R11 Sections 2-4
      - R8 Section 6.2
      - Materialization Sections 3.3 and 7
    finding: >-
      R11 successfully removes manifest, activation, own Binding-spec, Event,
      action, intent, replay, assessment, and proof values from the precommit
      input. However the replacement input requires
      actor_creation_spec_ref/fingerprint, and Section 3 requires the final
      issuance source to prove that this Actor spec is an exact member of the
      same ACTIVE manifest. The effective manifest schema defines controller,
      synthetic_profile_creation_specs, synthetic_principal_creation_specs,
      permitted_binding_creation_specs, and credential handles, but no
      synthetic_actor_creation_specs collection. R11 does not amend that
      schema or its array ordering/fingerprint.
    impact: >-
      Under the unknown-field rejection rule, no accepted manifest can contain
      the Actor creation spec that R11 requires. Treating the Actor spec as an
      external object contradicts the same-manifest membership predicate. The
      revised graph is no longer self-referential, but it is still not
      constructible.
    required_amendment: >-
      Choose one exact source. Either add a sorted
      synthetic_actor_creation_specs collection to the manifest schema/body,
      define its creation-spec tag/fingerprint and atomic Actor derivation, or
      replace the Actor creation-spec fields with an exact pre-existing
      synthetic Actor identity ref/fingerprint plus its accepted provisioning
      basis. Update the derived issuance proof and fixtures to match that one
      choice.

  - finding_id: F2-R11-IR-M01
    severity: MAJOR
    title: Corrected materialization still misstates Profile-controller basis inputs
    affected_sections:
      - R9 Section 5.2
      - Materialization Section 4.1
    finding: >-
      The full basis matrix says PROFILE_CONTROLLER_ACTION always requires a
      target ACTIVE Profile assessment. R9 explicitly split target Profile
      state from controller currentness: a Profile RESUME requires the target
      Profile assessment to be SUSPENDED, and RETIRE permits ACTIVE or
      SUSPENDED, while the separate controller assessment remains operational.
      The generic matrix therefore contradicts the lifecycle table immediately
      below it.
    impact: >-
      The derived file is non-authoritative, but it remains internally
      inconsistent on the exact issue R9 corrected. An implementer cannot use
      it as the promised complete authority surface without returning to the
      amendments.
    required_amendment: >-
      Make the PROFILE_CONTROLLER_ACTION matrix target-kind aware: for Profile
      mutations, bind the target assessment at the lifecycle row's source
      status and bind controller_currentness_assessment_ref separately; for
      Principal/Binding mutations, require the ACTIVE authenticator Profile.

