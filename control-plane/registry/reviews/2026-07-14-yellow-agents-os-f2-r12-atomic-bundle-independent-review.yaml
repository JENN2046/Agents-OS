findings:
  - finding_id: F2-R12-IR-B01
    severity: BLOCKER
    title: The non-production Actor fixture predicate is not deterministic
    affected_sections:
      - R12 Sections 2-3
      - R7 Section 6.5
      - R8 Sections 3.1 and 7.2
      - Materialization Sections 3.3 and 7
    finding: >-
      R12 correctly replaces the impossible Actor creation-spec membership
      with an exact pre-existing Actor revision and checks that revision as
      ACTIVE at the manifest ACCEPT Event. It additionally requires an
      "M0-allowed non-production Actor fixture", but neither R12 nor the
      effective Actor schema defines the exact predicate for that category.
      ActorIdentityRevisionV0_1R8 has no environment or fixture-kind field,
      and R12 does not bind the Actor's creation authority basis, lifecycle
      action, actor_class allowlist, workspace fixture, or other immutable
      provenance into the synthetic predicate.
    impact: >-
      Rust can deterministically prove identity and ACTIVE currentness, but it
      cannot determine from the contract whether the referenced Actor is an
      allowed synthetic fixture or a prohibited production/Jenn/active-host
      Actor. The R7 rule that a synthetic manifest cannot contain a production
      Actor binding therefore remains narrative rather than enforceable.
    required_amendment: >-
      Define one closed M0 Actor eligibility predicate over already-existing
      immutable fields and provenance. For example, require an allowed
      actor_class plus an exact SYNTHETIC_TEST Jenn governance/provisioning
      authority ref and lifecycle-action fingerprint, and explicitly reject
      Jenn, production, and active-host Actor sources. Bind or revalidate those
      exact refs at ACCEPT without adding the Actor to the manifest and without
      placing Event-time assessments in the precommit body.

  - finding_id: F2-R12-IR-M01
    severity: MAJOR
    title: The materialized synthetic Binding predicate retains the old assessment rule
    affected_sections:
      - R12 Section 2
      - Materialization Section 4.4
    finding: >-
      R12 requires the exact pre-existing Actor assessment to be ACTIVE at the
      ACCEPT Event. The supposedly effective Binding issuance table instead
      says SYNTHETIC_M0_FIXTURE requires only ACTIVE
      manifest/controller/spec membership and forbids "every pre-existing
      current assessment". Its column is also labelled "at intent head",
      while R12 deliberately moves the Actor check to the later ACCEPT Event.
    impact: >-
      The prose in Materialization Sections 3.3 and 7 describes R12 correctly,
      but the closed exact-predicate table gives an implementer the opposite
      instruction about the Actor assessment and its watermark.
    required_amendment: >-
      Rewrite the SYNTHETIC_M0_FIXTURE row to separate forbidden precommit or
      authority fields from required ACCEPT-time validation evidence. Require
      the exact pre-existing Actor ref/fingerprint and its ACTIVE assessment at
      the ACCEPT Event, while keeping Profile, Principal, and Binding
      same-manifest membership separate.

