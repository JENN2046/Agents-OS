    evidence: R2 Section 4
    assessment: >-
      NOT_YET_ACTIVE, ACTIVE, SUSPENDED, COMPROMISED, RETIRED, EXPIRED,
      SUPERSEDED, INDETERMINATE, and unknown input each have one fail-closed path.
  - id: JavaScript_direct_SQL_or_read_pool_as_second_authority_path
    result: PASS
    evidence: R1 Sections 7.3 and 9
    assessment: >-
      JavaScript direct SQL, independent reads, another writer thread, and a
      second connection are explicitly forbidden.
  - id: unknown_N_API_method_schema_or_field_reaches_reducer
    result: PASS
    evidence: R1 Section 9 and R2 Section 2.1
    assessment: >-
      Unknown method/version/schema/digest/enum/field rejects before ledger use
      and before a canonical Command identity exists.
  - id: caller_supplied_context_envelope_intake_Event_action_or_generation
    result: PASS
    evidence: R1 Section 11.2 and R2 Sections 2 and 5
    assessment: >-
      Every listed value is Rust-derived from current canonical evidence; caller
      supply is an unknown field and rejects.
  - id: authentication_assertion_Command_fingerprint_cycle
    result: PASS
    evidence: R1 Sections 11.1-11.2 and R2 Section 3
    assessment: >-
      The assertion is outside the Command fingerprint and binds the already
      computed exact canonical Command fingerprint.
  - id: intake_ref_content_address_cycle
    result: PASS
    evidence: R2 Sections 2.2 and 2.6
    assessment: >-
      Intake and replay refs derive only from namespace and command_id; envelope
      and completed intake fingerprints cannot point backward into themselves.
  - id: rejected_command_retried_after_gate_change
    result: BLOCK
    evidence: R1 Sections 8-9 and R2 Sections 2.3 and 2.7
    counterexample: >-
      Decode Command X while READY, then let lifecycle become DRAINING before the
      writer transaction. Unchanged R1 requires no canonical intake, while R2's
      lifecycle-negative gate plus no-entry REJECTED branch persists X. After
      READY returns, identical X either has no entry and may evaluate again or
      must replay the first rejection.
    finding_ids: [F3-R2-FULL-ATOMIC-IR-M01]
  - id: same_command_id_changed_source_or_payload
    result: PASS
    evidence: R2 Sections 2.1 and 2.7
    assessment: >-
      Source claims participate in the Command fingerprint and global command_id
      lookup; any changed fingerprint returns PROTOCOL_CONFLICT without replacement.
  - id: lost_response_causes_second_mutation
    result: PASS
    evidence: R2 Section 2.7 and R1 Section 16.3
    assessment: >-
      Identical COMMITTED replay returns the first envelope/result and appends no
      Event or reducer mutation.
  - id: revocation_and_Command_use_different_currentness_watermarks
    result: PASS
    evidence: R1 Section 12 and R2 Sections 2.3 and 2.7
    assessment: >-
      Gate evidence, target/reducer preconditions, and commit share the one
      authoritative transaction watermark.
  - id: synthetic_activation_before_constructive_issuance
    result: PASS
    evidence: R2 Sections 6.3-6.5
    assessment: >-
      The activation target cannot exist before the issuance transaction and a
      pre-issuance ACK rejects with no envelope/action/Event.
  - id: pending_Delegation_used_as_its_own_activation_responsibility
    result: PASS
    evidence: R1 Section 14 and R2 Sections 6.4-6.5
    assessment: >-
      ACK responsibility mode is NONE_ACTIVATION_PURPOSE_ONLY and every source,
      scope, and chain field is null.
  - id: synthetic_fixture_depends_on_real_secret_provider_host_runtime_or_effect
    result: PASS
    evidence: R2 Sections 6.2-6.6
    assessment: >-
      The fixture is fixed synthetic evidence and explicitly rejects real
      credentials, providers, hosts, runtime, private Memory, or effects.
  - id: F3_envelope_or_issuance_treated_as_F4_TaskPermit_or_host_admission
    result: PASS
    evidence: R1 Sections 3 and 17; R2 Sections 1 and 6.5
    assessment: >-
      Envelope, action, issuance, and activation remain ledger evidence only;
      they create no TaskPermit, host admission, fence, or effect authority.
  - id: reserved_Outbox_or_reconcile_method_performs_partial_operation
    result: PASS
    evidence: R1 Section 9 and invariant F3-I19
    assessment: >-
      Reserved methods return CONTRACT_NOT_ACTIVE and perform no partial operation.

additional_adversarial_checks:
  - id: exact_matching_Jenn_restore_after_multiple_newer_committed_epochs
    result: BLOCK
    evidence: R2 Sections 5.2-5.5
    counterexample: >-
      Witness history retains committed epochs 7, 8, and 9. Restore exact backup
      at epoch 6 under a matching decision and reserve generation 10. Choosing
      restored-ledger epoch 7 obeys N+1 but duplicates retained epoch 7; choosing
      epoch 10 avoids duplication but skips restored-ledger predecessors.
    finding_ids: [F3-R2-FULL-ATOMIC-IR-M02]
  - id: non_READY_after_decode_before_writer_transaction
    result: BLOCK
    evidence: R1 Sections 8-9 and R2 Sections 2.3 and 2.7
    counterexample: >-
      The same canonical bytes can have either no canonical intake record or a
      durable terminal record depending on which effective clause an
      implementation follows.
    finding_ids: [F3-R2-FULL-ATOMIC-IR-M01]
  - id: two_complete_synthetic_registry_materializations_from_displayed_R2_values
    result: BLOCK
    evidence: R1 Section 10.1 and R2 Sections 6.1 and 6.6
    counterexample: >-
      Two implementations choose different payload/reducer digests and different
      closed_subject_kind literals while preserving every displayed R2 value;
      both cannot have the same CommandTypeDefinition or genesis-manifest
      fingerprint.
    finding_ids: [F3-R2-FULL-ATOMIC-IR-M03]

findings:
  - id: F3-R2-FULL-ATOMIC-IR-M01
    severity: MAJOR
    title: Non-READY submissions have contradictory no-intake and persisted-terminal semantics
    section: R1 Sections 8 and 9; R2 Sections 2.3 and 2.7
    evidence: >-
      Unreplaced R1 says there is no canonical Command intake outside READY and
      execute_command is available only in READY. R2 nevertheless makes
      RESIDENT_LIFECYCLE_NOT_READY, RESIDENT_READINESS_INDETERMINATE,
      IDENTITY_CONTINUITY_DISCONTINUOUS, and IDENTITY_CONTINUITY_INDETERMINATE
      closed gate results, then requires every no-entry REJECTED or gate-derived
      INDETERMINATE result to commit an intake record and replay entry. R2 names
      only R1 Sections 13.1, 13.2, and 13.4 as replacements, not Sections 8 or 9.
    counterexample: >-
      Command X is decoded while the Resident appears READY, but the ledger-thread
      recheck sees DRAINING or DISCONTINUOUS. Following R1 writes no intake.
      Following R2 commits a terminal rejection/indeterminate entry. When READY
      and CONTINUOUS return, identical X either has no entry and is reevaluated or
      must replay the first terminal result. Both implementations can cite fixed
      effective clauses.
    impact: >-
      One command_id has no unique first-disposition or retry rule across a
      declared currentness race. This reopens persisted rejection semantics and
      prevents deterministic recovery/replay from the fixed bytes.
    required_correction: >-
      In R3, explicitly replace the relevant R1 lifecycle/N-API clauses or define
      a closed pre-intake response class that is never persisted. State exactly
      which readiness/continuity failures may open a write transaction, which
      create terminal replay entries, and what identical retry does after READY
      returns. Preserve the rule that no domain mutation or envelope is created.
    categories: [replay_ambiguity, internal_contradiction]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M01]

  - id: F3-R2-FULL-ATOMIC-IR-M02
    severity: MAJOR
    title: Explicit older-ledger restore has no total authority-epoch lineage reducer
    section: R2 Sections 5.2, 5.3, 5.4, and 5.5
    evidence: >-
      R2 requires authority_epoch to advance exactly by one in the ledger and
      forbids skipping, retains every COMMITTED witness entry outside backup and
      restore, and makes duplicate/forked epoch state INDETERMINATE. Its explicit
      restore branch then tells an older restored ledger to commit its next
      ledger epoch under a new witness generation. The decision contains a
      new_restore_lineage_id, but no epoch/witness identity rule scopes duplicate
      detection by that lineage or defines a different numeric successor rule.
    counterexample: >-
      The witness has immutable commits for epochs 7, 8, and 9; an exact Jenn
      decision restores a bound backup at epoch 6. A new reservation at generation
      10 must either commit epoch 7, satisfying restored-ledger contiguity while
      duplicating a retained committed epoch, or commit a globally new epoch,
      violating the no-skip N+1 rule. The fixed reducer supplies no third result.
    impact: >-
      A matching authorized restore can either remain permanently INDETERMINATE
      or require an implementation-specific exception to duplicate/fork/no-skip
      invariants. The restore and authority-currentness graph is not uniquely
      constructible even though ordinary rollback detection is sound.
    required_correction: >-
      R3 must define the canonical restore lineage and ordering key. Either bind
      lineage_id into epoch and witness identity and explicitly scope duplicate
      rules, or advance from an external global epoch high-watermark with an
      explicit restore-only predecessor/gap rule. Define exact checks for all
      retained pre-restore commits and the single value that becomes current.
    categories: [internal_contradiction, authority_restore_ambiguity]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M04]

  - id: F3-R2-FULL-ATOMIC-IR-M03
    severity: MAJOR
    title: Synthetic issuance registry and genesis manifest are not normatively closed
    section: R1 Section 10.1; R2 Sections 6.1 and 6.6
    evidence: >-
      R1 CommandTypeDefinitionV0_1 requires interface_version,
      payload_schema_sha256, reducer_sha256, and canonical_fingerprint in
      addition to the other displayed fields, and rejects missing/digest-mismatched
      definitions. R2's sole DelegationIssuanceCommandTypeV0_1R2 omits those
      required values, so it cannot produce the exact registered definition that
      the issuance Command must pass. Separately, the final genesis manifest
      declares closed_subject_kind and says one closed enum is used, but provides
      no enum members or exact kind-to-object mapping.
    counterexample: >-
      Two fixture builders use the same displayed command and genesis values but
      choose different payload-schema/reducer digests and different subject-kind
      literals. They derive different registry and manifest fingerprints, while
      neither choice violates an enumerated R2 value. Conversely, strict R1
      decoding rejects both partial type records for missing mandatory fields.
    impact: >-
      The pending Delegation issuance cannot pass one exact closed registry gate,
      and the completed fixture cannot be validated against one exact manifest
      vocabulary. The M06 constructive witness remains non-unique and the
      no-missing-normative-schema gate fails.
    required_correction: >-
      R3 must provide one complete CommandTypeDefinitionV0_1 instance for
      DELEGATION_ISSUANCE, including exact interface, payload and reducer refs and
      digests, ownership binding, registry revision, and fingerprint rule/value.
      It must also enumerate closed_subject_kind and the exact topological
      membership/mapping for every required genesis, issuance, activation,
      restart, replay, and dual-start evidence leaf.
    categories: [M0_impossibility, missing_normative_schema]
    prior_lineage: [F3-R1-FULL-ATOMIC-IR-M06]

review_boundaries_and_non_findings:
  - >-
    Concrete OS lock, durable-journal, filesystem, fsync, SQLite, Rust, and N-API
    implementation choices remain future implementation profiles and were not
    treated as missing contract semantics when the required behavior was closed.
  - >-
    The accepted architecture does not require N-API to resist a fully controlled
    same-process or same-OS-user attacker; this excluded threat model is not a
    finding.
  - >-
    F4 TaskPermit/host/fence, F5 delivery/retry/reconciliation, and F6 Validation
    detail are correctly deferred and their absence is not a finding.
  - >-
    No implementation or runtime tests are required for this contract review.
    All findings are demonstrable from fixed contract bytes and frozen authority
    inputs.

