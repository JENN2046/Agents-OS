prior_R1_major_recheck:
  - id: F3-R1-FULL-ATOMIC-IR-M01
    result: NOT_CLOSED_WITHOUT_REGRESSION
    current_finding_ids: [F3-R2-FULL-ATOMIC-IR-M01]
    assessment: >-
      R2 correctly persists ordinary REJECTED and gate-derived INDETERMINATE
      dispositions, but it also enumerates lifecycle-not-READY and continuity
      failure results without resolving R1's prohibition on any non-READY
      canonical intake. The original replay requirement is therefore not closed
      for that declared gate class.
  - id: F3-R1-FULL-ATOMIC-IR-M02
    result: CLOSED
    assessment: >-
      R2 uses exactly AuthenticationAssessmentV0_1R15.assessment = AUTHENTICATED
      and confines VERIFIED to the frozen principal-control proof interface.
  - id: F3-R1-FULL-ATOMIC-IR-M03
    result: CLOSED
    assessment: >-
      The replacement reducer is precedence-ordered over all eight frozen Actor
      assessment values and has an unknown-input INDETERMINATE fallback; a Jenn
      decision cannot turn a non-ACTIVE Actor assessment into CONTINUOUS.
  - id: F3-R1-FULL-ATOMIC-IR-M04
    result: NOT_CLOSED_FOR_EXPLICIT_RESTORE
    current_finding_ids: [F3-R2-FULL-ATOMIC-IR-M02]
    assessment: >-
      The external monotonic generation closes ordinary coherent-ledger rollback
      and both crash windows, but the matching Jenn restore branch does not
      reconcile restored-ledger N+1 with already retained witness commits for
      that same authority_epoch value.
  - id: F3-R1-FULL-ATOMIC-IR-M05
    result: CLOSED
    assessment: >-
      Intake, gate-result, and replay-entry schemas, fingerprint domains,
      disposition shapes, and independent intake/replay references are defined
      without the R1 content-address cycle.
  - id: F3-R1-FULL-ATOMIC-IR-M06
    result: NOT_CLOSED_NORMATIVELY
    current_finding_ids: [F3-R2-FULL-ATOMIC-IR-M03]
    assessment: >-
      Issuance-before-activation is now the right graph, but the added issuance
      type omits required closed CommandTypeDefinition values and the final
      manifest relies on an unenumerated closed_subject_kind vocabulary, so no
      unique exact fixture can yet pass its own digest/schema gates.

