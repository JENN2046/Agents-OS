  rationale: >-
    Atomic scope, hashes, live dual-writer exclusion, F2 AUTHENTICATED exactness,
    total Actor-continuity reduction, acyclic intake references, and downstream
    non-authorization pass. Three correctable major contract defects remain:
    non-READY submissions have contradictory no-intake versus persisted-terminal
    semantics; an explicitly authorized older-ledger restore has no total rule
    reconciling ledger-contiguous epochs with retained duplicate-epoch witness
    history; and the synthetic issuance surface cannot instantiate the closed
    Command registry or manifest vocabulary from fixed normative values.

