mandatory_count_basis:
  identity_spoofing: >-
    Identity remains bound to canonical identity facts and Jenn decisions;
    incarnation, process, model, session, prompt, and provider are non-evidence.
  dual_writer: >-
    The OS lock plus current witness/epoch/generation checks leave no construction
    in which two live incarnations can both write.
  circular_proof: >-
    Independent intake/replay/gate refs and forward-only envelope/action/result
    edges remove the identified fingerprint cycles.
  authority_expansion: >-
    No actor, effect, provider, runtime, database, service, F4, F5, or F6
    authority is actually granted by the bundle; the missing registry closure is
    counted as an M0/schema defect, not a proven grant.
  fail_open_currentness: >-
    The ordinary rollback path and ordinary Command currentness paths deny
    safely. The explicit-restore defect is a contradictory/undefined branch,
    not a demonstrated unapproved READY path, and is counted under internal
    contradiction.
  replay_ambiguity: F3-R2-FULL-ATOMIC-IR-M01
  downstream_boundary_leak: >-
    F4 permits/hosts/fences, F5 Outbox operations, and F6 Validation currentness
    remain excluded and reserved methods perform no partial operation.
  M0_impossibility: F3-R2-FULL-ATOMIC-IR-M03
  internal_contradiction: >-
    F3-R2-FULL-ATOMIC-IR-M01 and F3-R2-FULL-ATOMIC-IR-M02 each admit mutually
    incompatible effective readings.

