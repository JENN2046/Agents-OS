findings:
  blocker: []
  major:
    - id: "F2-R18-V11-MCR-M01"
      title: "The sole indexed synthetic-manifest reducer uses role aliases superseded by R17"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "510-525"
          evidence: >-
            R16 used MANIFEST_CREATE, MANIFEST_ACCEPT, and MANIFEST_REVOKE as
            prose role names for the manifest assessment.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r17-amendment.draft.md"
          lines: "28-30,35-120,169-215"
          evidence: >-
            R17 has exact precedence over R16 action-role prose, replaces it with
            the closed SYNTHETIC_MANIFEST_CREATE, SYNTHETIC_MANIFEST_ACCEPT, and
            SYNTHETIC_MANIFEST_REVOKE vocabulary, and rejects aliases.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v11.draft.md"
          lines: "2184-2208"
          evidence: >-
            The sole indexed SyntheticM0ManifestAssessmentReducer correctly
            prints coverage, R15 invalidation/challenge effects, derived-subject
            non-activity, safer REVOKE preservation, and CONFIRMED-only success,
            but lines 2201 and 2206-2207 require MANIFEST_CREATE and
            MANIFEST_ACCEPT rather than the R17-effective role identifiers.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v11.draft.md"
          lines: "1977-2027,2073-2075,2310"
          evidence: >-
            V11 itself prints the closed R17 role enum and mapping and indexes
            the reducer to R17 Section 2.3, making the stale reducer tokens an
            internal source-precedence contradiction rather than an omitted index row.
      impact: >-
        A literal implementation cannot satisfy the reducer with the closed R17
        role set: it must either accept aliases that R17 requires it to reject or
        fail to recognize the required manifest create/accept assurance. The sole
        indexed reducer is therefore not an exact implementable composition even
        though its state-transition branches are otherwise complete. Inventory
        row counts cannot cure this semantic mismatch.
      required_correction: >-
        Replace every reducer use of MANIFEST_CREATE and MANIFEST_ACCEPT with the
        exact R17-effective SYNTHETIC_MANIFEST_CREATE and
        SYNTHETIC_MANIFEST_ACCEPT identifiers; scan the complete materialization
        for every other superseded R16 assurance-role token, recompute the
        materialization hash, and submit the corrected bytes to a fresh
        hash-bound independent materialization consistency review.
  minor:
    - id: "F2-R18-V11-MCR-m01"
      title: "The common R16 prelude misstates the number of reducers to which it applies"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "541-564"
          evidence: "R16 defines one order for each directly affected schema reducer."
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v11.draft.md"
          lines: "1758-1781,1783-1883"
          evidence: >-
            Section 18.1 says the five reducers below use the common prelude, but
            only four object-specific reducers follow in Section 18.2 through
            18.5 before Section 19 begins.
      impact: >-
        The count does not by itself change the four printed reducer bodies, but
        it leaves the intended application set ambiguous and weakens the claimed
        exactness of the materialization.
      required_correction: >-
        State the exact reducer names governed by the prelude and correct the
        count. If a fifth reducer was intended, identify it explicitly and make
        its composition source-exact rather than relying on positional prose.

