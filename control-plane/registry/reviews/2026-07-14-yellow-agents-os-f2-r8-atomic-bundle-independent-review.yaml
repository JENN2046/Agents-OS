findings:
  - finding_id: F2-R8-IR-B01
    severity: BLOCKER
    title: Synthetic manifest activation contains a direct decision-intent fingerprint cycle
    affected_sections:
      - R8 Section 2.2 SYNTHETIC_M0_MANIFEST_ACTIVATION body projection
      - R8 Sections 2.3-2.4
      - R8 Section 6.3
      - Materialization Sections 3 and 7
    finding: >-
      The activation mutation body explicitly includes Jenn_decision_ref and
      Jenn_decision_fingerprint. The resulting body fingerprint is included in
      MutationIntent. LifecycleActionRef then requires the same later Jenn
      decision bytes to contain that intent and body fingerprint, and Section
      6.3 requires the activation Jenn decision fields to equal the decision in
      LifecycleActionRef. The decision fingerprint is therefore required to
      compute the body that the same decision must bind.
    impact: >-
      Neither manifest ACCEPT nor terminal REVOKE can be serialized without a
      cryptographic fixed point. The claimed acyclic M0 bootstrap graph is not
      constructible.
    required_amendment: >-
      Remove the later decision ref/fingerprint from the pre-action activation
      body. Let the body and intent bind manifest, transition, CAS, authority
      basis, and Event; after the Jenn decision commits, derive and verify the
      decision fields in the final activation revision through the exact
      LifecycleActionRef.

  - finding_id: F2-R8-IR-B02
    severity: BLOCKER
    title: Binding issuance has no complete R8 mutation kind, schema, or fingerprint path
    affected_sections:
      - R7 Section 7.1
      - R8 Sections 2.1-2.4
      - R8 Sections 6.2 and 6.4
      - Materialization Sections 3 and 7
    finding: >-
      R8 globally replaces LifecycleActionRefV0_1 with the intent-bound R8
      reference, while a non-synthetic Binding still obtains
      binding_issuance_source_ref from the replaced R7 lifecycle interface.
      MutationIntent has no BINDING_REVISION mutation kind or binding body
      projection, so a conforming non-synthetic Binding cannot create the new
      action ref. The synthetic path also says every derived subject receives
      mutation_body_fingerprint, mutation_intent_ref, lifecycle_action_ref, and
      replay fields, but the effective Binding schema has only
      binding_issuance_source_ref and its R3/R4 fingerprint formula does not
      contain the generic R8 overlay or the R7/R8 issuance provenance.
    impact: >-
      Binding creation is either impossible under the exact-intent rule or
      implementation-defined. Synthetic Binding bytes cannot be reproduced
      from the claimed common overlay, and representation currentness depends
      on this unresolved subject.
    required_amendment: >-
      Add BINDING_REVISION to the mutation-kind/target/body tables and publish
      one complete effective Binding schema and fingerprint formula, including
      exact issuance provenance and R8 action/intent/replay fields. Define the
      synthetic derived-field replacement against that same schema rather than
      adding unnamed generic fields.

  - finding_id: F2-R8-IR-B03
    severity: BLOCKER
    title: A compromise-impact successor can silently drop an earlier challenged action
    affected_sections:
      - R7 Section 9.2
      - R8 Sections 5.1-5.4
    finding: >-
      HistoricalImpactInputSet indexes only current impact-stream heads whose
      current head names the action. CLEAR_CHALLENGE must preserve the exact
      challenged set, but neither R7 nor R8 requires an INVALIDATE successor to
      preserve the current target set or monotonically retain every previously
      challenged action. A CHALLENGE head for actions A and B can therefore be
      succeeded by INVALIDATE naming only A. The current-head index no longer
      finds the stream for B, so B becomes CONFIRMED without an exact clear.
    impact: >-
      The new completeness watermark cannot detect this within-stream omission.
      Historical assurance can be silently relaxed and Assignment/Delegation
      currentness can become ACTIVE from the same incident history.
    required_amendment: >-
      Make the target-action set immutable for one impact_stream_id, or define
      per-action monotonic stream state with explicit set-delta rules. No
      successor may remove a CHALLENGED action except exact CLEAR_CHALLENGE, and
      INVALIDATED membership must remain terminal and discoverable.

  - finding_id: F2-R8-IR-M01
    severity: MAJOR
    title: Typed transition authority does not bind its currentness watermark exactly
    affected_sections:
      - R8 Sections 2.1 and 3.1
    finding: >-
      TransitionAuthorityBasis contains based_on_event_sequence and
      MutationIntent contains expected_ledger_head_event_sequence, but R8 never
      states their required equality or an exact alternative relation. The
      prose says inputs must be current and stale inputs reject, without
      defining the deterministic currentness boundary.
    impact: >-
      Implementations can disagree whether a basis assessed one or more Events
      earlier is stale, and a transition can cite identity, Binding,
      responsibility, Profile, or controller state that changed before the
      intended mutation Event.
    required_amendment: >-
      Require authority_basis.based_on_event_sequence to equal the intent's
      expected ledger head for current-state bases. If a prior immutable basis
      is allowed, enumerate that basis kind separately and define its validity
      window and revalidation rule.

  - finding_id: F2-R8-IR-M02
    severity: MAJOR
    title: PROFILE_CONTROLLER_ACTION is internally inconsistent for suspended Profile transitions
    affected_sections:
      - R8 Sections 3.1-3.2
    finding: >-
      The basis kind requires an exact ACTIVE Profile assessment. The transition
      table nevertheless permits PROFILE_CONTROLLER_ACTION to RESUME a target
      Profile whose required current state is SUSPENDED and to RETIRE a target
      Profile from SUSPENDED. No distinct controller-currentness assessment is
      supplied that could satisfy the ACTIVE Profile field without referring to
      the suspended target.
    impact: >-
      The table is mechanically total but advertises controller routes that
      cannot satisfy their own required inputs. Writers may either reject the
      route or reinterpret profile_assessment_ref as an unspecified other
      Profile.
    required_amendment: >-
      Split target_Profile_state from lifecycle_controller_currentness. For a
      Profile target, bind the exact target assessment at the transition's
      required source state and separately bind the controller Actor/component
      or synthetic manifest assessment.

  - finding_id: F2-R8-IR-M03
    severity: MAJOR
    title: The regenerated materialization omits required full authority tables and overclaims closure
    affected_sections:
      - R8 Section 8.2
      - Materialization Sections 3, 4, 6, and 7
    finding: >-
      R8 requires the regenerated surface to print every total reducer and
      authority table. The materialization abbreviates Profile and Principal
      lifecycle rows as the exact R8 Section 3.2 subset instead of printing the
      table, summarizes rather than resolves several complete body projections,
      and repeats the cyclic activation decision and incomplete Binding
      materialization as if they were acyclic and exact.
    impact: >-
      The file remains useful as a source map but is not yet the complete,
      implementation-safe resolved reading surface required to close prior
      finding F2-R7-IR-M01.
    required_amendment: >-
      Regenerate it only after the subject blockers are closed. Include every
      effective lifecycle/transition row, exact changed subject schema and
      formula, explicit action/body ordering, and no claim stronger than the
      fixed subjects support.

