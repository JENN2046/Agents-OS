author_findings_closed_before_hash_fix:
  - id: F6-R1-ASR-01
    severity: blocker
    finding: >-
      An early waiver shape bound a grant to the current Validation Set while
      the current set also fingerprint-bound that grant, creating a circular
      proof surface.
    correction: >-
      Waiver identity now binds an immutable base snapshot. A later
      WAIVER_CHANGE snapshot binds the independently committed waiver head.
      The validator recomputes the graph in base-snapshot, waiver, current-
      snapshot topological order.
    status: CLOSED
  - id: F6-R1-ASR-02
    severity: blocker
    finding: >-
      Evidence refs, evidence digest and currentness assessment could initially
      be mutually self-consistent without proving that the assessment subject
      was the exact evidence object consumed by the attempt.
    correction: >-
      Terminal attempts now require the assessment subject ref in evidence_refs
      and exact equality between assessment subject_fingerprint and
      evidence_digest. Candidate currentness likewise binds the exact candidate
      commitment fingerprint.
    status: CLOSED
  - id: F6-R1-ASR-03
    severity: major
    finding: >-
      Validation Set source bindings were hashed but were not initially proven
      to contain the complete Requirement provenance set.
    correction: >-
      The contract and validator now require the duplicate-free exact union of
      all current membership Requirement provenance, with omission,
      substitution and conflicting fingerprints rejected.
    status: CLOSED
  - id: F6-R1-ASR-04
    severity: major
    finding: >-
      Carry-forward fields were closed-schema but the equivalence fingerprint
      and original fresh source relationship lacked a complete independent
      derivation formula.
    correction: >-
      R1 now freezes the equivalence tuple and requires source equals root,
      resolves to an earlier original FRESH_VALIDATION PASSED chain head for
      the same Requirement, and rejects carry-forward chains, human acceptance
      and effectful delivery evidence reuse.
    status: CLOSED
  - id: F6-R1-ASR-05
    severity: major
    finding: >-
      The first mutation runner counted validator exceptions as successful
      mutation rejection, which could hide a broken adversarial probe.
    correction: >-
      Mutation exceptions now fail the validator. All 30 root-re-signed probes
      execute normally and are rejected by closed schema, stable-ID or semantic
      validation.
    status: CLOSED
  - id: F6-R1-ASR-06
    severity: blocker
    finding: >-
      An authority or F5 assessment could initially match the expected kind and
      result while assessing a different validator contract or delivery subject.
    correction: >-
      Validation authority now binds the exact Requirement validator contract.
      Effectful Requirements carry an exact delivery subject ref/fingerprint,
      and the F5 APPLIED_CURRENT assessment must bind that subject. Non-effectful
      Requirements reject every F5 delivery binding.
    status: CLOSED
  - id: F6-R1-ASR-07
    severity: major
    finding: >-
      The completion witness used F5 CLEAR without distinguishing an F6
      consumer requirement from an already accepted frozen F5 owner interface.
    correction: >-
      R1 now labels the F5 completion-blocking assessment as an
      UNACCEPTED_OWNER_INTERFACE_REQUIREMENT with runtime_usable=false and
      synthetic_fixture_only=true. A real eligibility decision remains
      non-issuable until a separately accepted owner or implementation profile
      materializes it from frozen F5 semantics.
    status: CLOSED
  - id: F6-R1-ASR-08
    severity: blocker
    finding: >-
      Completion quiescence counts were initially fingerprinted only inside
      the caller input, so a caller could re-sign zero counts without an
      independently owned currentness assertion.
    correction: >-
      The exact Task context and all five counts now derive one completion-
      guard subject fingerprint bound to a current accepted-owner assessment.
      The interface is explicitly unaccepted, synthetic-only and nonruntime;
      count changes without a new exact owner assessment are rejected.
    status: CLOSED

