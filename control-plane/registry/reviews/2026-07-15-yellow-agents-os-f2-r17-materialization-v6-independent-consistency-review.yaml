findings:
  - finding_id: F2-R17-V6-ICR-M01
    severity: MAJOR
    title: Activation and proof schemas still differ from the fixed R2-R4 subjects
    affected_surfaces:
      - PrincipalControlProofAssessmentRefV0_1R15
      - BindingActivationEvidenceR15Effective
      - DelegationActivationEvidenceR15Effective
    finding: >-
      V6 does not print the exact effective activation/proof field sets. The
      Principal control-proof ref replaces R2/R4 principal_id plus
      principal_revision with principal_ref and adds assessed_at_utc_ms, which
      no R15 overlay authorizes. Binding activation evidence replaces the exact
      Actor and Principal ID/revision fields and the R2/R4 stewardship_source
      plus steward Actor/Binding/action fields with new actor_identity_ref,
      principal_ref, stewardship_source_ref, and
      identity_stewardship_assessment_ref fields. Delegation activation
      evidence changes the delegate ID/revision pair and acknowledgement field,
      narrows status, and reintroduces acknowledging_action_ref even though R3
      explicitly removes that field and R4 says no effective formula contains
      it. R15 changes the registered canonical domains; it does not define
      these field substitutions.
    impact: >-
      An implementation using v6 would validate and hash different proof and
      activation evidence objects from the fixed subjects. In particular it
      would restore the responsibility-dependent delegation activation edge
      that R3 removed to break the activation cycle. The materialization is
      therefore not an exact implementation reading surface.
    required_amendment: >-
      Regenerate only the derived materialization. Print the R2 proof and
      activation evidence fields with the exact R3 replacements and R4
      fingerprint projections, then apply only R15's explicit canonical-domain
      overlay. Do not infer new ref shapes, stewardship fields, status
      narrowing, or action refs.

  - finding_id: F2-R17-V6-ICR-M02
    severity: MAJOR
    title: Two synthetic M0 schemas retain source-inaccurate fields
    affected_surfaces:
      - SyntheticM0ControllerRefV0_1
      - SyntheticM0ManifestActivationRevisionV0_1R9
    finding: >-
      The controller ref renames R8's exact profile_spec_id and
      profile_spec_fingerprint to target_profile_creation_spec_ref and
      target_profile_creation_spec_fingerprint; no R9-R17 subject defines that
      rename. The manifest activation revision adds authority_basis_ref,
      authority_basis_fingerprint, expected_ledger_head_event_sequence, and
      mutation_body_fingerprint to the final subject. Those values belong to
      R9's separately printed pre-action body and MutationIntent. R9 Section
      2.2 explicitly keeps the final R8 activation schema effective and adds
      predicates, not four subject fields.
    impact: >-
      Both changes alter known-object bytes under existing fingerprint domains.
      The controller ref no longer matches the accepted R8 interface, and the
      activation subject hashes body/intent inputs as new direct fields. The
      62-row index remains internally consistent with v6 but is not
      source-consistent.
    required_amendment: >-
      Restore the exact R8 controller-ref field names. Keep
      SyntheticM0ManifestActivationBodyV0_1R9 as the separate pre-action body,
      and print the unchanged R8 final activation revision with only the R9
      predicates and derived Jenn-decision equality applied.

prior_findings_disposition:
  F2-R17-FULL-IR-M01:
    result: RESOLVED
    basis: >-
      V6 prints the exact R1 CommandTypeDefinition, CanonicalCommand,
      AuthenticationAssertionValue, and AuthenticatedCommandContext; the exact
      R8 MutationIntent and LifecycleActionRef; and only the explicit R9/R15
      mutation-kind and target-kind enum additions. It no longer assigns
      standalone F2 domains to the R1 command/authentication interfaces.
  F2-R17-FULL-IR-M02:
    result: PARTIALLY_RESOLVED_NOT_CLOSED
    basis: >-
      V6 now has 62 unique printed surfaces, 62 matching index rows, eight
      unique named reducers, eight matching reducer rows, and source-existing
      domain tags or NOT_STANDALONE classifications. Exact source-field
      equality still fails for the five surfaces in M01 and M02, so internal
      row equality does not establish a complete exact effective surface.

