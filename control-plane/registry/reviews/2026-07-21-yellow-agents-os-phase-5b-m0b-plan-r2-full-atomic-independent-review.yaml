finding_details:
  - id: PHASE5B_PLAN_R2_IR_B01
    severity: blocker
    title: Fixed public N-API baseline contradicts the sealed Rust export set
    subjects:
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-exact-source-f3-seam-profile-v0.1.yaml
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-plan-r2-amendment-v0.1.md
    authority_inputs:
      - extensions/agents-os-resident/src/lib.rs
      - extensions/agents-os-resident/src/napi_frame.rs
    exact_locations:
      - exact_source_F3_seam_lines_10_16
      - R2_amendment_lines_30_50
      - sealed_lib_rs_lines_172_237
      - validator_lines_144_147
    evidence: >-
      R2 freezes start_resident, get_resident_status, execute_command,
      claim_outbox and reconcile as the existing public five-method surface.
      The hash-bound sealed lib.rs instead exports execute_command,
      execute_query, claim_outbox, acknowledge_outbox and reconcile. The
      validator hard-codes the incorrect profile list and never derives the
      actual export inventory from sealed source.
    impact: >-
      The exact ABI preservation target is factually wrong. Implementing the
      profile literally changes two exported methods; preserving sealed source
      violates the fixed profile.
    closure_required:
      - derive_and_freeze_the_exact_public_export_set_from_sealed_lib_rs
      - add_a_source_bound_export_inventory_check

  - id: PHASE5B_PLAN_R2_IR_B02
    severity: blocker
    title: Canonical candidate history is not insertable under its own schema-v2 profile
    subjects:
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-schema-v2-transaction-profile-v0.1.yaml
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-constructive-graph-profile-v0.1.yaml
    author_evidence:
      - control-plane/registry/build-phase-5b-m0b-plan-r2-constructive-graph.py
      - control-plane/registry/examples/2026-07-21-agents-os-phase-5b-m0b-plan-r2-constructive-graph-v0.1.json
      - control-plane/registry/validate-phase-5b-m0b-plan-r2-constructive-graph.py
    exact_locations:
      - schema_v2_profile_lines_23_53
      - builder_lines_53_79_and_118_132
      - validator_lines_272_289
    evidence: >-
      The builder hard-codes revision 1 for every candidate, then creates
      candidate:intent:1 with a non-null predecessor pointing to the distinct
      life-stream candidate_id. Schema v2 requires every revision-1 predecessor
      field to be null and constrains predecessor history through a composite
      foreign key containing the same candidate_id. The fixed fixture therefore
      cannot be inserted under the fixed schema, yet the validator returns PASS.
    impact: >-
      This is a favorable invalid path in the canonical evidence and an
      implementation impossibility for the fixed constructive witness.
    closure_required:
      - choose_and_freeze_one_consistent_candidate_identity_and_revision_model
      - bind_the_graph_validator_to_all_schema_genesis_predecessor_and_FK_rules

  - id: PHASE5B_PLAN_R2_IR_B03
    severity: blocker
    title: Constructive F3 Command and request fingerprints use an invented shape
    subjects:
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-exact-source-f3-seam-profile-v0.1.yaml
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-constructive-graph-profile-v0.1.yaml
    authority_inputs:
      - extensions/agents-os-resident/src/reducers/command_intake.rs
      - extensions/agents-os-resident/src/napi_frame.rs
      - extensions/agents-os-resident/src/lib.rs
    author_evidence:
      - control-plane/registry/build-phase-5b-m0b-plan-r2-constructive-graph.py
      - control-plane/registry/validate-phase-5b-m0b-plan-r2-constructive-graph.py
    exact_locations:
      - exact_source_F3_seam_lines_121_132
      - command_intake_rs_lines_21_148
      - validator_lines_319_354
    evidence: >-
      The graph derives command_fingerprint from a simplified five-field object
      and request_fingerprint from method/request_id/payload. Sealed F3 requires
      the ten-field canonical Command, a five-field authentication assertion,
      and the six-field canonical NAPI request frame. The graph therefore does
      not materialize the sealed CommandSubmission or request bytes promised by
      the R2 profile.
    impact: >-
      The fixed graph's Command, request and replay fingerprints cannot be used
      as the constructive proof of the sealed F8-to-F3 seam.
    closure_required:
      - materialize_the_exact_sealed_outer_Command_authentication_and_NAPI_frame
      - derive_all_fingerprints_from_those_exact_bytes

  - id: PHASE5B_PLAN_R2_IR_B04
    severity: blocker
    title: Composite foreign-key parent tuples lack an exact parent key
    subjects:
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-schema-v2-transaction-profile-v0.1.yaml
    exact_locations:
      - schema_v2_profile_lines_23_102
    evidence: >-
      Three foreign keys reference the four-column parent tuple candidate_id,
      candidate_revision, candidate_ref and candidate_fingerprint. The declared
      parent keys are only PK(candidate_id,candidate_revision),
      UNIQUE(candidate_ref,candidate_revision), and
      UNIQUE(candidate_fingerprint). No exact four-column PRIMARY KEY or UNIQUE
      parent key is present. The exact closed constraint inventory leaves no
      authorized place to add it during implementation.
    impact: >-
      The specified SQLite foreign keys have no valid exact parent key and the
      frozen schema is not directly implementable.
    closure_required:
      - declare_the_exact_composite_parent_key_or_redesign_each_FK
      - add_static_parent_key_coverage_validation_for_every_FK

  - id: PHASE5B_PLAN_R2_IR_B05
    severity: blocker
    title: Fixed mutation evidence proves fixture sealing rather than target semantics
    subjects:
      - control-plane/registry/drafts/2026-07-21-agents-os-phase-5b-m0b-r2-constructive-graph-profile-v0.1.yaml
    author_evidence:
      - control-plane/registry/validate-phase-5b-m0b-plan-r2-constructive-graph.py
    exact_locations:
      - constructive_graph_profile_lines_100_144
      - validator_lines_411_426
      - independent_case_results_cases_001_014
    evidence: >-
      Fourteen independent coordinated mutations recomputed every affected
      inner commitment and all dependent candidate, history, handoff, payload,
      Command, request, replay, node, section and root fingerprints. All 14 were
      rejected only by fixture != builder.build_fixture(). None produced a
      target-semantic error outside that exact-output seal. The fixed author's
      mutation helper also re-signs only outer graph fingerprints for many
      cases, leaving inner dependent commitments stale.
    impact: >-
      The claimed 32/32 mutation result does not satisfy the manifest requirement
      that fully propagated attacks be rejected by target semantics rather than
      stale hashes, unpropagated references or an exact fixture seal.
    closure_required:
      - separate_semantic_validation_from_exact_fixture_reproduction
      - implement_fully_propagated_independent_attack_cases
      - require_each_attack_to_name_the_specific_semantic_rule_that_rejected_it

