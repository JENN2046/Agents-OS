findings:
  - finding_id: F2-R9-IR-B01
    severity: BLOCKER
    title: Binding issuance requires exact current proof but does not bind a proof or its assessment
    affected_sections:
      - R9 Sections 3.1-3.3
      - R9 Section 5.1
      - R2 Section 5
    finding: >-
      The Binding issuance table requires exact Actor, Principal, Profile,
      proof, scope, and time inputs for interactive issuance and analogous exact
      target inputs for the other modes. The complete Binding schema and body
      contain target Actor/Principal/Profile refs, scope, and time, but neither
      they nor TransitionAuthorityBasisV0_1R9 contain a target Actor assessment,
      PrincipalAssessment, or PrincipalControlProofAssessment ref/fingerprint.
      The proof first appears in later BindingActivationEvidence, which the R3
      acyclic graph intentionally creates only after the immutable Binding
      subject. Consequently no fixed issuance body or authority object selects
      the exact proof named by the mandatory issuance predicate.
    impact: >-
      One implementation can treat proof as a later activation-only fact,
      another can require existence of any current proof, and another can
      reject issuance because the exact proof is unbound. The intent/action
      bytes do not determine the stated issuance result, so the complete
      Binding mutation remains non-reproducible.
    required_amendment: >-
      Choose one boundary explicitly. Recommended: remove proof from Binding
      subject issuance, require exact current Actor/Principal/Profile
      assessments at the intent watermark, and leave Principal control proof
      solely in the later activation-evidence graph. Alternatively add exact
      assessment/proof refs and fingerprints to the Binding authority/body and
      preserve the subject-before-evidence DAG. Publish mode-specific
      required/forbidden fields for either choice.

  - finding_id: F2-R9-IR-M01
    severity: MAJOR
    title: Synthetic Binding creation-spec canonicalization has an incomplete precedence declaration
    affected_sections:
      - R8 Section 6.2
      - R9 Sections 1 and 3.4
    finding: >-
      R8 says every creation spec has its own domain tag and fingerprint. R9
      instead requires the Binding creation-spec fingerprint to be the
      BINDING_REVISION mutation-body fingerprint and explicitly says it is not
      a second digest domain. That later rule is clear, but R9's exact
      precedence list names R8 Sections 6.3-6.4 and does not name the conflicting
      creation-spec rule in R8 Section 6.2.
    impact: >-
      A strict precedence resolver can retain the R8 spec-domain digest while
      another applies the R9 mutation-body digest, producing different
      manifest and derived Binding bytes.
    required_amendment: >-
      Add the exact R8 Section 6.2 Binding-creation-spec rule to R9 precedence
      and state that only Binding specs use the BINDING_REVISION body domain;
      leave Profile and Principal spec domains unchanged unless separately
      amended.

  - finding_id: F2-R9-IR-M02
    severity: MAJOR
    title: The R9 materialization still does not print the complete required authority and reducer tables
    affected_sections:
      - R9 Section 6
      - Materialization Sections 3.4, 4.4-4.5, and 6
    finding: >-
      R9 requires the derived surface to print complete Profile, Principal,
      Binding, transition, Actor, and impact authority tables and all unchanged
      R8 total reducers used by R9. The materialization's Binding table omits
      the required-current-facts column, its governed-transition table omits
      source-state/additional predicates and forbidden combinations, its Actor
      table replaces exact enum basis kinds with narrative Jenn/steward labels,
      and Section 6 gives only Delegation precedence plus references instead of
      the complete Binding and Delegation reducers.
    impact: >-
      The materialization remains non-authoritative and cannot change contract
      semantics, but it still fails the explicit implementation-safe reading
      requirement and cannot close the prior materialization finding.
    required_amendment: >-
      Regenerate the surface after the Binding predicate is fixed. Copy every
      required/forbidden field rule, source/target predicate, exact authority
      enum, and complete reduction order rather than referring the reader back
      to older amendments.

