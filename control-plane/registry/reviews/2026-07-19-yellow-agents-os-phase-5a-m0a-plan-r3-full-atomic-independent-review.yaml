terminal_disposition: >-
  Package integrity, fixed commands, digest preimage rules, many relational constraints and all
  nonauthorization boundaries pass. The effective independent DDL and fixed VCP implementation
  evidence nevertheless reproduce three blocker groups: F3 authority-epoch ownership is not
  representable or transactionally owned, F5 exact cross-table/stored-first bindings admit favorable
  invalid graphs, and the manager-to-module projection contradicts the fixed VCP call path. The plan
  cannot be frozen and implementation cannot start. A narrow R4 is required.
