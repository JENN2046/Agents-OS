finding_details:
  - finding_id: PHASE5A-M0A-PLAN-R3-IR-B01
    severity: blocker
    title: F3_incarnation_and_authority_epoch_persistence_and_transaction_ownership_are_not_closed
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-semantic-owner-corrections-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-persistence-transaction-corrections-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-exact-persistence-profile-v0.1-r2.yaml
      - control-plane/registry/drafts/2026-07-16-agents-os-f3-resident-singleton-napi-identity-continuity-v0.1-r1.draft.md
    evidence:
      - >-
        Frozen F3 ResidentAuthorityEpoch requires resident identity and fingerprint, authority epoch,
        exact expected predecessor epoch, incarnation ID, previous incarnation ID, ownership-started
        Event sequence and its canonical fingerprint.
      - >-
        The effective schema inherits resident_authority_epoch unchanged from R2. It stores only
        resident_id, authority_epoch, epoch_fingerprint and created_event_sequence. It has no
        incarnation identity, predecessor epoch, previous incarnation or Event foreign key.
      - >-
        Independent SQLite case X06 committed epoch 1 followed by epoch 3 and accepted a nonexistent
        created_event_sequence 999. Thus the table permits a gap and a provenance-free authority epoch.
      - >-
        The R3 owner row assigns F3_incarnation_and_authority_epoch to resident_lifecycle_advance,
        but that transaction's ordered steps contain neither an incarnation insert nor an authority
        epoch insert. Case X07 reproduces this exact owner/transaction mismatch.
    counterexample: >-
      Two process incarnations can be present while the same resident_authority_epoch rows remain
      byte-identical under either assignment of epochs to incarnations. The persistence mapping is
      non-injective: restart recovery cannot prove which incarnation owns the current epoch. A gap
      from epoch 1 to 3 and a nonexistent ownership Event also commit successfully.
    impact: >-
      F3's dual gate cannot be reconstructed or validated from the exact persistence profile. READY
      may be projected without proof that the current epoch belongs to the live incarnation, so the
      11 semantic-owner replacements are not closed.
    required_correction:
      - Replace resident_authority_epoch within the same closed 18-table inventory with the exact frozen incarnation, predecessor and Event commitments.
      - Freeze one transaction owner that writes the new incarnation, exact next authority epoch, lifecycle fact, current pointer and Event atomically where F3 requires them together.
      - Add positive restart and negative gap, fork, wrong-incarnation and missing-Event SQLite cases.

  - finding_id: PHASE5A-M0A-PLAN-R3-IR-B02
    severity: blocker
    title: F5_exact_cross_table_bindings_and_stored_first_accounting_remain_underdetermined
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-semantic-owner-corrections-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-persistence-transaction-corrections-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-17-agents-os-f5-outbox-delivery-recovery-v0.1-r3-amendment.draft.md
      - control-plane/registry/drafts/2026-07-17-agents-os-f5-outbox-delivery-recovery-v0.1-r6-amendment.draft.md
    evidence:
      - >-
        Case X01 committed a receipt for attempt A2/intent I2 while binding the first-apply guard
        fingerprint for attempt A1/intent I1. The receipt relation has no exact composite binding to
        the winning attempt and intent.
      - >-
        Case X02 committed a dispatch_arm whose request ID, fingerprint and bytes differ from its
        referenced delivery_attempt. The two records are related only by attempt/intent/claim IDs.
      - >-
        Case X03 committed an outbox claim whose lease tuple references an unrelated canonical fact
        kind and logical identity rather than OUTBOX_CLAIM_LEASE for the same intent.
      - >-
        Frozen F5 constructive first apply is exactly one Event and one call authorization. Case X04
        committed a dispatch arm with both committed counts equal to zero even while carrying a
        non-null Event and call-authorization tuple; the DDL permits any nonnegative counts.
      - >-
        The transaction steps use labels such as exact_identity_prebranch_check and
        validate_source_receipt_attempt_currentness but freeze no exact equality predicates that
        close these admitted graphs. The fixed validator never executes any of them.
    counterexample: >-
      Two implementations can both follow the named transaction steps while one validates only the
      listed foreign keys and accepts the four graphs above, and another performs the missing tuple
      equalities. The plan does not select one behavior even though its owner rows claim exact guard,
      request, lease and stored-first semantics.
    impact: >-
      The plan can persist a favorable receipt or arm assembled from unrelated valid rows and can
      replay zero stored-first accounting for a purported first apply. R2 B01/B02 are therefore not
      fully closed by the R3 exact persistence surface.
    required_correction:
      - Bind receipt, attempt, intent and first-apply guard as one exact tuple or freeze an equivalent total reducer predicate before insert.
      - Bind dispatch_arm request identity and canonical bytes to the selected delivery_attempt exactly.
      - Bind the claim lease fact to kind OUTBOX_CLAIM_LEASE and the exact intent logical identity.
      - Require first-apply committed Event and call-authorization counts to equal one, while exact replay adds zero.
      - Add the four coordinated SQLite cases as fixed negative regressions.

  - finding_id: PHASE5A-M0A-PLAN-R3-IR-B03
    severity: blocker
    title: The_claimed_one_value_VCP_manager_to_module_projection_conflicts_with_the_fixed_base_implementation
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-materialization-abi-corrections-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-external-materialization-profile-v0.1-r2.yaml
      - upstream/vcptoolbox/docs/PLUGIN_ECOSYSTEM.md
    evidence:
      - >-
        R3 states that only toolArgs crosses from the manager into index.js and that requestIp is not
        forwarded to the module.
      - >-
        At the exact fixed VCP base commit 555b3b538f6eb736e530c2912de678c5941f9985,
        Plugin.js SHA-256 be15f76324b73400fe70052e6f07a0254b2a9c26393009ad1f026793fb36f5a2
        invokes serviceModule.processToolCall(pluginSpecificArgs, directContext). directContext is
        constructed with requestIp, sourceNode and pluginName and later receives an abort signal.
      - >-
        JavaScript passes the second value even when the function declares one formal argument; it
        remains accessible through arguments[1]. A one-argument spelling does not make the R3
        no-forwarding claim true.
      - >-
        Plugin.js, the actual ABI owner, is absent from the six manifest-bound VCP inputs. The fixed
        documents show the outer helper receiving direct context but cannot prove the helper-to-module
        projection claimed by R3. Independent case A04 confirms the fixed-source contradiction.
    impact: >-
      WP0 can produce an index.js based on a false call-boundary model. It may accidentally consume
      request context as authority or fail a later ABI audit, and R2 B03 remains open despite the
      corrected formal processToolCall(args) spelling.
    required_correction:
      - Add fixed Plugin.js bytes at the VCP base commit to the hash-bound authority inputs.
      - State the actual two-value manager invocation and freeze directContext as ignored nonauthority input that is never forwarded to N-API or reducers.
      - Keep processToolCall(args) as the module's one formal business argument only if the contract explicitly handles the manager's extra argument.
      - Add a static or executable ABI probe proving that requestIp, sourceNode, signal and any auth context cannot affect the native request frame.

