finding_readjudication:
  - id: F1-IR-B01
    status: RESOLVED
    basis: >-
      R2 supplies the total reducer and R3 Section 2 completes CARRY_FORWARD
      with the full source tuple, immediate GoalSpec predecessor relation,
      exact latest reducer head, reducer version and fingerprints.
  - id: F1-IR-B02
    status: RESOLVED_NO_REGRESSION
    basis: >-
      R2 Sections 3.1-3.3 retain the synchronous Subgoal parent-alignment gates
      and closure bindings; R3 does not replace them.
  - id: F1-IR-B03
    status: RESOLVED
    basis: >-
      R2 defines the canonical envelope and complete normalization rules; R3
      Section 3 removes the remaining untyped semantic-fingerprint uses with
      two versioned typed projections and exact envelope equality.
  - id: F1-IR-M01
    status: RESOLVED_NO_REGRESSION
    basis: >-
      R2 Sections 5.1-5.3 retain the total disjoint membership-role partition,
      exact supplemental coverage and bidirectional route coverage.
  - id: F1-IR-M02
    status: RESOLVED_NO_REGRESSION
    basis: >-
      R2 Section 5.4 retains plan-wide task_id leaf and container reduction for
      both progress and exact route support.
  - id: F1-IR-M03
    status: RESOLVED_NO_REGRESSION
    basis: >-
      R2 Section 6 retains CLOSED immutability, explicit new spec and plan
      rebinding, non-current prior decisions and new closure basis requirements;
      R3 adds deterministic reopen projection equality without weakening them.
  - id: F1-IR-N01
    status: RESOLVED_NO_REGRESSION
    basis: >-
      R2 Section 1 retains proposal-only wording and Jenn-only exact hash-bound
      acceptance authority.
  - id: F1-R2-IR-B01
    status: RESOLVED
    basis: >-
      For each target tuple R3 computes exactly the immediately preceding
      GoalSpec in the same lineage and permits only an unchanged criterion
      revision or a positive consecutive one-revision advance. It rejects
      missing, retired-and-reintroduced, skipped, branched and older heads,
      binds the exact current reducer head immediately before the target Event,
      and requires the target tuple to have no prior head.
  - id: F1-R2-IR-B02
    status: RESOLVED
    basis: >-
      CriterionCarryForwardProjection and GoalSpecReopenProjection enumerate
      their included and excluded fields, bind distinct projection contract
      versions, use f1-canonical-json.v0.1 and FingerprintEnvelope, require exact
      digest equality, and fail closed on unknown or inconsistent replay input.

