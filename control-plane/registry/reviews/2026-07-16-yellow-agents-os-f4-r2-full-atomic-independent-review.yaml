findings:
  - id: F4-R2-FULL-ATOMIC-IR-B01
    severity: BLOCKER
    title: PRESTART Host identity has no canonical Host authentication rejected reason
    exact_section_evidence:
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_5.1_HostIdentityRevisionV0_1
        lines: 260-288
        evidence: lifecycle_state explicitly admits PRESTART.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_5.2_HostAuthenticationAssessmentV0_1
        lines: 290-319
        evidence: AUTHENTICATED requires an ACTIVE Host and every proven negative must be REJECTED with one of 13 closed reasons.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r2-amendment.draft.md
        section: Section_3.1_Closed_observation_classes_and_3.2_exact_precedence
        lines: 100-148
        evidence: rejected lifecycle candidates cover COMPROMISED, REVOKED, RETIRED and SUSPENDED but omit PRESTART; NOT_YET_VALID is limited to trusted time before validity start.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r2-amendment.draft.md
        section: Section_7_I20_R2
        lines: 351-364
        evidence: every proven negative must have a first present fixed rejected reason.
    concrete_counterexample:
      host_identity_lifecycle_state: PRESTART
      host_identity_validity_start_utc_ms: 1000
      host_identity_validity_end_utc_ms: null
      assessment_trusted_time_utc_ms: 1500
      assessment_valid_until_utc_ms: 5000
      profile_match: true
      challenge_match: true
      revocation_head_readable_and_not_revoked: true
      verifier_evidence_valid: true
      explanation: >-
        The tuple is canonical, available and inside both time windows, so it
        has no integrity, unavailable, expiry or not-yet-valid candidate. It
        cannot emit MATCH because R1 requires ACTIVE. PRESTART is therefore a
        proven negative with no member in the closed rejected reason order.
    impact: >-
      A conforming verifier cannot emit one schema-valid canonical assessment
      or fingerprint for this constructible Host state. Improvised mappings
      would produce divergent immutable bytes. The gap is fail closed and is
      not a Host authentication bypass, but it violates mandatory Host
      totality, uniqueness and I20-R2.
    minimum_correction:
      - Add one exact PRESTART predicate mapping to a closed rejected reason; either add a dedicated PRESTART/NOT_ACTIVE reason or explicitly and semantically redefine an existing reason.
      - Insert that reason into the fixed rejected precedence without weakening any existing negative.
      - Add a PRESTART vector with in-window time and a PRESTART-plus-unavailable mixed vector, plus negative expected-result/reason mutations.
      - Recount the Host enum and publish a new hash-bound R3 atomic review package.
    fail_open: false
    requires_R3: true

  - id: F4-R2-FULL-ATOMIC-IR-B02
    severity: BLOCKER
    title: HostWorkStartDisposition remains non-total and has unmapped negative rechecks
    exact_section_evidence:
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r2-amendment.draft.md
        section: Section_1_and_Section_2_replacement_scope
        lines: 40-52
        evidence: R2 preserves R1 handoff/replay rules and replaces result selection only in R1 Sections 5.2, 7.2 and 9.2, not Section 9.4.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_9.4_HostWorkStartDispositionFactV0_1_schema
        lines: 807-837
        evidence: secret_handles_current, permit_attestation_current and human_presence_current each admit REJECTED/INDETERMINATE, but the reason enum has no corresponding secret-handle, attestation or human-presence reason.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_9.4_result_reason_and_replay_prose
        lines: 839-867
        evidence: NOT_STARTED requires one proven negative and INDETERMINATE requires unavailable evidence, but no dominance rule, check-to-reason mapping or multi-negative precedence is defined before the fingerprint/replay rule.
    concrete_counterexamples:
      - name: unmapped_known_negative
        tuple:
          acceptance_present: true
          before_expiry: true
          owner_Host_authenticated: true
          all_fences_match: true
          execution_epoch_matches: true
          secret_handles_current: REJECTED
          permit_attestation_current: PASS
          human_presence_current: NOT_APPLICABLE
        contradiction: >-
          START_AUTHORITY_CURRENT is forbidden and NOT_STARTED is required,
          but none of EXPIRED, FENCED, HOST_UNAUTHENTICATED, EPOCH_STALE,
          ACCEPTANCE_MISSING or INTEGRITY_FAILURE truthfully maps a current,
          reproducibly revoked/out-of-scope secret handle.
      - name: mixed_negative_and_unavailable
        tuple:
          secret_handles_current: REJECTED
          permit_attestation_current: INDETERMINATE
          human_presence_current: NOT_APPLICABLE
        contradiction: >-
          R1 Section 9.4 simultaneously satisfies the prose condition for
          NOT_STARTED and the prose condition for INDETERMINATE; R2 does not
          replace this section or state which one dominates.
      - name: multiple_negative_reason_precedence
        tuple:
          expired: true
          fence_mismatch: true
          host_authentication_current: false
        contradiction: EXPIRED, FENCED and HOST_UNAUTHENTICATED are all truthful but no first-priority reason is specified.
    impact: >-
      The same final-recheck evidence and observation identity can yield no
      legal reason or multiple legal result/reason bytes before first commit.
      Because reason is fingerprinted, this creates canonical and replay
      ambiguity immediately before the F5 handoff. Every non-success path still
      fails closed, so no effect authority is granted by the defect.
    minimum_correction:
      - Extend the total negative-over-unavailable lattice to HostWorkStartDispositionFactV0_1.
      - Map every identity, expiry, fence, epoch, acceptance, secret-handle, attestation and human-presence predicate to an exact closed reason.
      - Define one rejected-reason precedence and one unavailable reason for every schema-valid normalized recheck tuple.
      - Add mixed negative/unavailable, all three unmapped recheck negatives and multi-negative precedence vectors with changed-result/reason rejection tests.
      - Re-run the M0 success witness unchanged only if its six subject hashes remain fixed, then perform a fresh full atomic R3 review.
    fail_open: false
    requires_R3: true

