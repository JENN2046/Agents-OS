finding_details:
- id: PHASE5B_PLAN_R4_IR_B01
  severity: blocker
  title: claimed_principal_revision exact binding is not strict JSON-type exact
  evidence:
  - Replacing integer 1 with JSON boolean true is accepted after all dependent fingerprints are recomputed.
  - Replacing integer 1 with JSON number 1.0 is also accepted.
  - The same two substitutions remain accepted when derived_sealed_binding and the consumed Command are changed together.
  - Python equality treats true == 1 and 1.0 == 1; R4 compares dictionaries without an exact type check, while sealed F3 requires
    a positive integer exactly equal to 1.
  impact: R4 does not prove all six sealed values exactly; a structurally invalid F3 Command can receive a favorable closure
    result.
  required_correction:
  - Require type(claimed_principal_revision) is int and value == 1 before binding comparison.
  - Reject boolean, float and all non-integer JSON forms in both derived binding and consumed Command.
  - Parse or independently verify the sealed require_positive_integer_exact rule instead of relying on coercive Python equality.
  - Add fully re-signed boolean and 1.0 regressions for inner-only and coordinated wrapper-plus-inner substitutions.
