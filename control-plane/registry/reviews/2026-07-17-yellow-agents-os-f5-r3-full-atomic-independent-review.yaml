finding_ids_with_exact_evidence_counterexample_and_required_correction:
  - finding_id: F5_R3_BLOCKER_001_CLOSED_SCHEMA_AND_CROSS_FIELD_VALIDATION_REMAINS_INCOMPLETE
    severity: blocker
    status: OPEN_REQUIRES_R4
    exact_evidence:
      - >-
        R3 Amendment Section 2 requires unknown root, section, row and
        canonical-object fields plus normative cross-field failures to reject
        before any fingerprint is trusted. validate_fixture validates section
        fingerprints for adversarial_cases but never validates that section's
        row inventory or semantics.
      - >-
        An in-memory fully re-signed mutation added unknown_row_field to
        adversarial_cases[0], recomputed adversarial_cases_fingerprint and the
        fixture root, and validate_fixture(run_mutations=false) returned
        PASS_NO_BLOCKER.
      - >-
        A second fully re-signed mutation changed the nonoccurring
        F5DeliveryReceiptDispositionV0_1R3 shape with dedup_relation=NEW,
        result=REJECTED and primary_reason=SOURCE_ATTESTATION_INVALID to
        reconciliation_opened=true. The validator returned PASS_NO_BLOCKER,
        despite R3 Section 6 assigning reconciliation opening only to
        CHANGED_BYTES_SAME_KEY.
      - >-
        A third fully re-signed mutation changed the nonoccurring
        F5DispatchArmDispositionV0_1R2 shape to replay_relation=EXACT_DUPLICATE
        while leaving result=REJECTED and both stored-first fields null. The
        validator returned PASS_NO_BLOCKER despite the effective exact-replay
        cross-field rules.
      - >-
        Independent profile comparison also found four effective fields whose
        profile declares non_negative_safe_integer while the R1 normative
        schema declares positive_safe_integer: start_authority_expires_at_utc_ms,
        lease_expires_at_utc_ms, previous_lease_expiry_utc_ms and
        new_lease_expiry_utc_ms. Fixed sample values happen to be positive, but
        the executable schema metadata is not exact.
    executable_counterexample: >-
      Import validate-f5-r3-seven-finding-closure.py in memory, deep-copy the
      fixed fixture, set adversarial_cases[0].unknown_row_field='x', call
      raw_resign_section(copy,'adversarial_cases') and raw_resign_root(copy),
      then call validate_fixture(copy,run_mutations=False); observed result is
      PASS_NO_BLOCKER.
    narrow_required_correction: >-
      In R4, give every proof section and row a closed field inventory and
      semantic validator before section/root hashing; bind profile field types
      exactly to the effective R3>R2>R1 schemas; and enforce complete
      disposition cross-field matrices for replay relation, result, primary
      reason, reason_codes, first accounting, Event, reconciliation,
      projection and Task flags. Add fully re-signed unknown-row and coherent
      cross-field mutation probes.
    R4_required: true

  - finding_id: F5_R3_MAJOR_001_PRECEDENCE_PROOF_ACCEPTS_DUPLICATED_RAW_ORDERING
    severity: major
    status: OPEN_REQUIRES_R4
    exact_evidence:
      - >-
        Fixed fixture bytes correctly contain 147 unordered cases and 294 raw
        trials, and independent reduction confirms each fixed ordering-2 raw
        list is the reverse of ordering-1. The validator, however, records only
        the labels {1,2}; it does not require the two raw_conditions sequences
        to be exact reversals.
      - >-
        For CLAIM_INTEGRITY_FAILURE__SYNTHETIC_INPUT, an in-memory fully
        re-signed mutation replaced ordering=2 raw_conditions with a copy of
        ordering=1, recomputed its derived answer, section fingerprint and root.
        validate_fixture(run_mutations=false) returned PASS_NO_BLOCKER.
      - >-
        This is the R2 order-coverage failure in a new form: a second row label
        can substitute for executing the second raw ordering.
    executable_counterexample: >-
      Deep-copy the fixed fixture; for one unordered_case_id copy the
      ordering=1 raw_conditions into the ordering=2 row, recompute derived with
      reduce_reasons, re-sign precedence_ordering_trials and root, then call
      validate_fixture(run_mutations=False); observed result is PASS_NO_BLOCKER.
    narrow_required_correction: >-
      In R4 require exactly two rows per unordered pair, require ordering=1 and
      ordering=2 raw reason sequences to be exact two-element reversals with
      the same true reason set, and add a fully re-signed duplicated-order
      mutation that must reject.
    R4_required: true

  - finding_id: F5_R3_BLOCKER_002_ARM_REPLAY_DOES_NOT_BIND_CANONICAL_BYTES_OR_STORED_FIRST_ACCOUNTING
    severity: blocker
    status: OPEN_REQUIRES_R4
    exact_evidence:
      - >-
        parse_request_record parses request_canonical_utf8_hex and compares the
        declared fingerprint to the digest of the parsed value, but never
        requires the supplied bytes to equal canonical_bytes(parsed). A fully
        re-signed exact-replay case containing whitespace-indented,
        noncanonical JSON bytes for both stored and submitted requests was
        accepted as PASS_NO_BLOCKER.
      - >-
        The proof request payload contains only bound invocation fingerprint,
        attempt ordinal and requested time. request_id is outside those bytes,
        and parse_request_record never recomputes the request ID formula from a
        complete canonical request, so request identity is not reproducible
        from the claimed canonical bytes.
      - >-
        derive_arm verifies stored committed Event/call counts equal 1/1 but
        does not require previous_event_count and
        previous_call_authorization_count to equal that stored first
        accounting. A fully re-signed EXACT_DUPLICATE case with stored 1/1 and
        previous 0/0 was accepted and returned total_event_count=0 and
        total_call_authorization_count=0, losing stored first accounting.
    executable_counterexample: >-
      Deep-copy ARM_STATE_DERIVATION_2, set both previous counts to 0, recompute
      derived with derive_arm, re-sign arm_state_derivation_cases and root, and
      call validate_fixture(run_mutations=False); observed result is
      PASS_NO_BLOCKER with stored committed counts 1/1 but returned totals 0/0.
    narrow_required_correction: >-
      In R4 require request_canonical_utf8_hex bytes to equal the canonical
      encoding of a closed complete arm-request payload, recompute request ID
      and fingerprint from that payload, and require exact replay totals and
      returned refs/fingerprints to equal stored committed first accounting.
      Add fully re-signed noncanonical-byte, formula-wrong request-ID and
      previous-count divergence probes.
    R4_required: true

