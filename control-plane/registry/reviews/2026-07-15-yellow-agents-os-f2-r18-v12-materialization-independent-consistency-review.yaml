findings:
  blocker: []
  major:
    - id: "F2-R18-V12-MCR-M01"
      title: "The sole complete Delegation reducer omits the target Delegation's own invalidated issuance and activation branches"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r15-amendment.draft.md"
          lines: "405-417,424-436"
          evidence: >-
            R15 requires Delegation issuance or activation CHALLENGED to make the
            Delegation INDETERMINATE and INVALIDATED to make it REVOKED
            prospectively, before ordinary ACTIVE success.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "477-507,541-564"
          evidence: >-
            DelegationAssessment is a directly affected assurance-bound schema;
            its reducer must apply the R15 mapping, preserve safer effects, and
            return ACTIVE only with complete CONFIRMED assurance.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "586-603"
          evidence: >-
            The named reducer maps INVALIDATED assurance only when it belongs to
            a root or ancestor. It has no branch for the target Delegation's own
            issuance assurance or transitive activation assurance becoming
            INVALIDATED; INVALIDATED is also absent from its generic
            missing/conflicting/challenged/indeterminate dependency branch.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "1229-1234,1537-1550,1737-1756"
          evidence: >-
            V12 calls Section 6.3 the sole complete Delegation reducer and prints
            the correct global R15 effect table elsewhere, but never composes the
            target's own invalidation cases into that claimed complete reducer.
      impact: >-
        A literal reduction can pass the first six Section 6.3 branches and
        reach ACTIVE even when the target Delegation's own issuance or activation
        action has been INVALIDATED. The scattered global table cannot make the
        sole claimed reducer total while its explicit branch set excludes the
        required prospective REVOKE result.
      required_correction: >-
        Add explicit target-own issuance and transitive activation assurance
        branches to DelegationEffectiveCurrentReducer: INVALIDATED maps to
        REVOKED prospectively; CHALLENGED or INDETERMINATE maps to INDETERMINATE
        while preserving already effective safer states; ACTIVE is possible only
        when all required direct and transitive assurance is CONFIRMED. Recheck
        the reducer against the exact R15-R17 composition and update its source
        index row if needed.

    - id: "F2-R18-V12-MCR-M02"
      title: "The claimed closed R16 domain registry omits ActorGeneralTransitionAuthorityBasisV0_1R16"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "167-200,298-304"
          evidence: >-
            R16 assigns the general Actor authority basis the domain
            agents-os.actor-general-transition-authority-basis.v0.1-r16 and
            expressly includes both CREATE and general Actor authority bases in
            the complete closed R16 domain additions.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "796-835"
          evidence: >-
            The table calls itself the closed domain registry, includes the Actor
            CREATE authority basis, but omits the general Actor authority basis;
            the next sentence rejects unregistered derived-record fingerprints as
            normative inputs.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "930-949,2266-2268"
          evidence: >-
            The general basis schema and its exact R16 domain are printed and
            indexed elsewhere in V12, creating an internal registry contradiction.
      impact: >-
        The closed-registry rule makes the post-CREATE Actor authority basis look
        unregistered and therefore unusable as a normative fingerprint input,
        while the schema and index require that exact domain. Implementers cannot
        follow both readings source-exactly.
      required_correction: >-
        Add ActorGeneralTransitionAuthorityBasisV0_1R16 and its exact R16 domain
        to the closed registry, then verify the registry against every domain R16
        declares in Sections 2 and 3 without adding a new domain.

    - id: "F2-R18-V12-MCR-M03"
      title: "The indexed complete-set reducer omits synthetic Binding activation-evidence transition actions from its synthetic branch"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r17-amendment.draft.md"
          lines: "179-215"
          evidence: >-
            R17 requires exact activation creation/action assurance plus every
            accepted activation-evidence transition through the watermark, with
            complete coverage and no missing binding.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r18-amendment.draft.md"
          lines: "289-310"
          evidence: >-
            R18 replaces the synthetic Binding activation set with transitive
            manifest-create and manifest-accept assurance plus every accepted
            activation-evidence transition through the watermark.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "1740-1756"
          evidence: >-
            The earlier direct-role table correctly says Binding activation also
            includes activation-evidence transition actions in synthetic mode.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "2038-2100,2324-2325"
          evidence: >-
            The sole indexed ActionAssuranceCompleteSetReducer limits evidence
            transition facts to ordinary activation and describes synthetic
            Binding activation only as transitive manifest create/accept
            assurance. It does not carry the R18-required accepted evidence
            transition facts into the synthetic branch.
      impact: >-
        V12 gives conflicting complete-set instructions. Following the sole named
        reducer can omit assurance bindings for synthetic activation-evidence
        transitions, defeating complete coverage and the challenged/invalidated
        safety-transition semantics that R16-R18 require.
      required_correction: >-
        State in ActionAssuranceCompleteSetReducer that synthetic Binding
        activation derives no separate BINDING_ACTIVATION action, consumes exact
        manifest-create and manifest-accept assurance transitively, and also
        includes every accepted binding-activation-evidence transition through
        the assessment watermark. Preserve the ordinary Binding and Delegation
        activation branches separately and source-exactly.

    - id: "F2-R18-V12-MCR-M04"
      title: "The synthetic manifest assessment source claim and schema-index row omit the controlling R17 type replacement"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "509-525"
          evidence: >-
            R16 defines SyntheticM0ManifestAssessment with the predecessor
            ActionAssuranceBindingV0_1R16 array.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r17-amendment.draft.md"
          lines: "28-30,98-120"
          evidence: >-
            R17 has exact precedence and replaces every assessment field typed as
            ActionAssuranceBindingV0_1R16 with ActionAssuranceBindingV0_1R17;
            no R16 binding is valid in an R17 assessment.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "2102-2106,2179-2189"
          evidence: >-
            Section 20's source claim names only R8 and R9-R14 even though the
            printed manifest assessment is the R16 schema with the R17 binding
            type.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v12.draft.md"
          lines: "2298-2303"
          evidence: >-
            The exhaustive schema-index row names R8 and R16 but omits R17, unlike
            the other R16 assessment rows whose binding fields are replaced by R17.
      impact: >-
        The printed field is correct, but the authoritative source map does not
        bind that field to the amendment that makes it effective and rejects the
        R16 predecessor. This violates R17's exact source-index requirement and
        leaves precedence ambiguous for the manifest assessment.
      required_correction: >-
        Add R16 Section 3.2 and R17 Section 2 to the Section 20 source claim as
        applicable, and add R17 Section 2 to the exact
        SyntheticM0ManifestAssessmentV0_1R16 schema-index row. Recheck every
        assurance-bound schema row for the same controlling type replacement.
