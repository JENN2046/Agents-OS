findings:
  - id: F4-R7-FULL-ATOMIC-IR-B01
    severity: blocker
    class:
      - canonical_identity_divergence
      - dual_writer_risk
      - M0_constructive_witness_failure
      - internal_contradiction
    title: R7 effective-object fingerprints do not use the still-effective R1 canonical fingerprint domain
    evidence:
      - >-
        R1 Section 3 requires every F4 canonical, assessment, decision, and fact
        fingerprint to use SHA256(JCS(["agents-os.f4-fingerprint.v0.1:" +
        exact_schema_name, every preceding field value])). R5-R7 never replace
        that general rule except for individually printed formulas such as the
        R6 authority-source entry and R6 disposition.
      - >-
        R7 validator stamped() instead hashes [interface-version-like domain,
        preceding values]. For example its TaskPermit uses
        "agents-os.task-permit.v0.1-r7", not the R1 prefix plus a schema name.
      - >-
        The fixture TaskPermit actual fingerprint is
        e1f6a122999e061cac2c67f1c6d3e1408b69f539ce48ea1521696671ec463bd5.
        Recalculation with inherited schema name TaskPermitV0_1 yields
        a2f73219209d7a2aafd56aa9522bdbf1f1a3a16c647900e6c9020a0f4eb27097;
        using TaskPermitV0_1R7 yields
        480c22a2d064ae003ade242ab23fc4a5f25f610fc07d7044fd0c8369d74c7aa7.
        Neither equals the fixture.
      - >-
        The same independent mismatch exists for currentness: actual
        450ec80af6a5d7d81336925ca6c6a065786090f3a51d39b85b1e86554b9ab08f,
        inherited-profile candidates
        18ce83949ed778e7b74a33f7b2bf8edd08cceb931fc9298827b0bed7e994a7f5
        and 7adbc4a02fba0e8b662a581aebdcc8c9784a4ddbc5e048cf5c3eb44e064dbf0d.
      - >-
        The R7 handoff actual fingerprint is
        2458570920f8c14ae476ef884efc409217679858a86f1154b7ef32435c01321b;
        inherited-profile candidates are
        f89c36fd8c90a906b7dc97654192059ce866bde7506d02e9007b8098f8b339e8
        and d1de7212e992e93a7fa59d0324334ed35891f5dc4c25173e2b541405f607c3a2.
    counterexample: >-
      One writer follows R1 Section 3 while another follows the R7 validator;
      identical semantic fields produce different canonical identities, so
      replay, set fingerprints, acceptance, and handoff binding diverge.
    required_correction:
      - freeze one explicit exact schema-name-to-domain table for every R7 effective object
      - make it an explicit R7 replacement if the R1 profile is intentionally changed
      - recompute every nested and outer effective fingerprint from that one profile
      - add independent negative vectors for each wrong domain or schema name

  - id: F4-R7-FULL-ATOMIC-IR-B02
    severity: blocker
    class:
      - identity_integrity
      - replay_and_crash_ambiguity
      - broken_semantic_DAG_edges
      - M0_constructive_witness_failure
    title: R7 changes the invocation identity but retains or invents non-derived acceptance, observation, and handoff identities and stale refs
    evidence:
      - >-
        R1 Sections 9.3, 9.4, and 13 keep their explicit identity formulas under
        R7. The R7 invocation fingerprint is
        67932e6d5b97dd64d663dae3ccd361b46c3a0c56f876974887b66bd3ebbcfcf1.
      - >-
        Recomputed acceptance_id is
        3d0b27203f6822dbfc90cf9de1afa8cbc9b9a26afee754c5a8b636f3e203e635,
        but the fixture retains the R1 value
        360314bc6183c19f51a094cc1a4a70db7124cf3011d2529939bcfff5e9e1cf49.
      - >-
        Recomputed observation_id from the R7 acceptance fingerprint and attempt
        1 is dfdd8a3397f67b0949d6ebd81d2416739a25520aad7076e5712adc15f761fc4a,
        but the fixture uses the non-derived string observation:m0:r7.
      - >-
        Recomputed handoff_id is
        a5fd331cf6f980be5cdefe910c98a4de9c28c4a3a6be434471ee212a2a5f4323,
        but the fixture retains R1 value
        c18210d18e36e3c672314bb8aa254d972bb17760cb5284afe56f64dc2b568c29.
      - >-
        The activation transition and handoff point at the stale R1 acceptance
        ref, the disposition points at acceptance:m0:r7, and the handoff's
        start_disposition_ref points at the stale R1 observation identity. These
        are not one exact acceptance/disposition chain.
    counterexample: >-
      Crash lookup by the contract-derived acceptance or handoff identity finds
      no fixture fact, while lookup by the retained R1 identity returns bytes
      bound to a different R7 invocation. Identical replay therefore has two
      incompatible identity surfaces.
    required_correction:
      - recompute acceptance_id observation_id and handoff_id after every upstream R7 identity change
      - derive all acceptance and disposition refs from those recomputed identities
      - machine-check every inner ref-to-identity and ref-to-fingerprint edge, not only outer node dependencies
      - add changed-upstream-identity mutations that require all downstream identities and refs to change

  - id: F4-R7-FULL-ATOMIC-IR-B03
    severity: blocker
    class:
      - host_authentication_bypass
      - identity_spoofing
      - M0_constructive_witness_failure
      - internal_contradiction
    title: The R7 fixture emits AUTHENTICATED/MATCH while the Host trust and authentication profiles differ
    evidence:
      - >-
        R1 Section 5.2 and R5 Section 3 require exact current authenticator
        profile matching. The R7 F4HostTrustRevision uses profile ref
        auth-profile:m0 and fingerprint
        e68d4e2749234bb92ac8941e9fa25b1f92f1f5c07018574a7e93c9e20b720647.
      - >-
        The R7 HostAuthenticationAssessment instead uses profile ref
        auth-profile:m0-a:synthetic and fingerprint
        8506ba41b693a82af5c27124b83c87c3ec9436fcb59afd5843ab62c4718236d2,
        yet emits AUTHENTICATED / MATCH.
      - >-
        R7 validator build() copies these two R1 profile fields rather than the
        R7 Host-trust fields, and validate() accepts the exact mismatch.
    counterexample: >-
      A response verified under profile B is accepted as authentication for a
      Host-trust revision bound to profile A. This is the exact PROFILE_MISMATCH
      path that the effective Host-authentication reducer must reject.
    required_correction:
      - bind HostAuthenticationAssessment profile ref and fingerprint exactly to F4HostTrustRevision
      - derive REJECTED_PROFILE_MISMATCH for any mismatch
      - add independent ref-only and fingerprint-only mismatch mutations

  - id: F4-R7-FULL-ATOMIC-IR-B04
    severity: blocker
    class:
      - authority_expansion
      - fail_open_input_validation
      - validator_contract_divergence
    title: The R7 authorization reducer accepts unknown modes and mutually impossible decision tuples
    evidence:
      - >-
        R7 Section 2 says invalid tuples reject, exact missing is mutually
        exclusive with every present-decision predicate, and only the three
        policy-derived modes are legal.
      - >-
        Direct independent execution of authorization_reduce with an unknown
        mode, no negatives, and unavailable=false returns
        REQUIREMENT / CURRENT / JENN_DECISION_CURRENT instead of rejecting.
      - >-
        authorization_reduce(EXACT,
        [JENN_DECISION_MISSING,JENN_DECISION_REVOKED],false) returns a canonical
        revoked requirement even though R7 declares missing and present-decision
        predicates mutually exclusive and every other tuple non-canonical.
      - >-
        The reducer also returns immediately for NO_SEPARATE or PROHIBITED and
        does not reject contradictory decision evidence. The eight vectors do
        not cover these invalid tuples; the seven-field presence matrix is
        metadata rather than seven materialized schema-valid rows.
    counterexample: >-
      A caller or faulty policy adapter supplies an unrecognized derived mode;
      the validator's reducer treats it as the exact-Jenn positive branch and
      can label the requirement CURRENT.
    required_correction:
      - reject every mode outside the exact closed enum before reduction
      - model decision presence separately from negative candidates
      - reject missing plus any present predicate and decision evidence on no-separate or prohibited modes
      - materialize and validate every seven-field presence row plus invalid cross-products

  - id: F4-R7-FULL-ATOMIC-IR-B05
    severity: blocker
    class:
      - nondeterministic_reducer
      - fail_open_currentness
      - revocation_bypass
      - cross_writer_divergence
    title: FinalHandoffAuthorityAssessment still has no total result/reason reducer
    evidence:
      - >-
        R5 Section 4 defines result CURRENT|REJECTED|INDETERMINATE and reasons
        ALL_AUTHORITY_CURRENT|AUTHORITY_STALE|AUTHORITY_UNAVAILABLE|INTEGRITY_FAILURE,
        but does not define normalized observations, negative-over-unavailable
        ordering, integrity precedence, or a unique reason algorithm.
      - >-
        R6 only inserts the assessment ref/fingerprint into disposition and
        handoff. R7 corrects the outer eligibility and authorization reducers
        and the disposition fingerprint, but never replaces the internal final
        authority assessment reducer.
      - >-
        The R7 fixture covers only the all-current row, so its validator cannot
        prove the missing negative and unavailable cross-products.
    counterexample: >-
      At one watermark the Task authority is reproducibly stale, PBL bytes have
      an integrity conflict, and Resident currentness is unavailable. One writer
      can emit REJECTED/AUTHORITY_STALE, another REJECTED/INTEGRITY_FAILURE, and
      a third INDETERMINATE/AUTHORITY_UNAVAILABLE without violating any printed
      R5-R7 precedence rule.
    required_correction:
      - freeze the complete final-handoff normalized observation set
      - define integrity then proven-negative then unavailable then all-current ordering
      - define exact reason mapping and precedence for simultaneous negatives
      - add full cross-product vectors and canonical fingerprint checks

  - id: F4-R7-FULL-ATOMIC-IR-B06
    severity: blocker
    class:
      - unavailable_branch_constructibility
      - fail_open_currentness
      - compromise_history_ambiguity
    title: F4 effect-trust eligibility unavailable branches have no canonical field-presence or watermark representation
    evidence:
      - >-
        R6 Section 3 requires non-null current F2 assessment and both F2/F4
        compromise-history head refs/fingerprints in every eligibility object.
        R7 Section 3 adds HISTORY_UNAVAILABLE and CURRENT_F2_INPUT_UNAVAILABLE
        results, but adds neither nullable observation bindings, a no-object
        resolution, nor an assessment watermark/event sequence.
      - >-
        The R7 vectors reduce booleans to result/reason only. They do not
        materialize a complete eligibility object for either unavailable branch.
    counterexample: >-
      If the current F2 compromise-history head is unreadable, the writer cannot
      populate the schema's required exact current head fingerprint. Reusing a
      last-known head is not defined and has no watermark; inventing a head is an
      integrity violation. Two writers can therefore emit different bytes or no
      object for the same unavailable observation.
    required_correction:
      - choose a no-object resolution for unavailable eligibility or define explicit nullable observation bindings
      - freeze a complete presence matrix for current and unavailable branches
      - bind one exact assessment watermark/event sequence
      - materialize all unavailable branches as complete objects in the witness

  - id: F4-R7-FULL-ATOMIC-IR-B07
    severity: blocker
    class:
      - host_identity_ambiguity
      - stale_trust_bypass
      - incomplete_effective_schema_replacement
      - internal_contradiction
    title: Downstream schemas retain an undefined Host identity revision after HostIdentityRevision was replaced by two distinct revisions
    evidence:
      - >-
        R5 Section 3 replaces R1 HostIdentityRevision with F4HostTrustRevision,
        which has both host_trust_revision and host_actor_identity_revision.
      - >-
        R7 explicitly replaces permit host_identity_ref/fingerprint with
        host_trust_ref/fingerprint and says the R1 Host-identity-only field set
        is removed, but the effective fixture retains
        target_host_identity_revision, accepted_host_identity_revision,
        observed_host_identity_revision, and owner_host_identity_revision.
      - >-
        No R5-R7 clause says whether those four values mean F2 Actor identity
        revision or F4 Host-trust revision. The witness assigns 1 to both and
        therefore hides the divergence.
    counterexample: >-
      F4 Host trust advances from revision 1 to 2 while the F2 EXECUTION_HOST
      Actor identity remains revision 1. A writer interpreting the residual
      field as Actor revision emits 1; a writer interpreting it as Host-trust
      revision emits 2. Both bind different currentness and fingerprints.
    required_correction:
      - replace all four residual fields with explicit host_trust_revision fields
      - add a separate host_actor_identity_revision only where it is independently required
      - define exact equality checks and fingerprint positions at request acceptance disposition and handoff
      - use an adversarial witness where Actor and Host-trust revisions differ

