findings:
  - finding_id: F2-R14-IR-M01
    severity: MAJOR
    title: The resolved materialization still contains the superseded ACTIVE-only rule
    affected_sections:
      - R14 Section 3
      - Materialization Section 3.3
    finding: >-
      R14 says every materialized summary replaces "ACTIVE Actor" with the
      exact SyntheticM0ActorEligibilityAssessment = ELIGIBLE rule and that no
      earlier ACTIVE-only sentence remains effective. The R14 materialization
      still states at lines 203-204 that Rust separately requires only the
      Actor's exact assessment to be ACTIVE at ACCEPT. The following R13/R14
      schema and predicates correctly require ELIGIBLE, so the resolved
      reading surface contains both the superseded and effective rules.
    impact: >-
      R14's authoritative amendment is sound, but the delivered materialization
      does not satisfy its own exact correction requirement. An implementer
      reading the first issuance paragraph can omit the synthetic bootstrap
      provenance and class checks that distinguish ELIGIBLE from merely ACTIVE.
    required_amendment: >-
      Regenerate the materialization with that sentence replaced by the exact
      Event-time ELIGIBLE requirement. No contract-semantic amendment beyond
      this faithful materialization correction is required.

