findings:
  - finding_id: F2-R5-IR-B01
    severity: BLOCKER
    title: context_revision gives contradictory outcomes for rounded fractions and negative zero
    subject_locations:
      - subject: R5
        section: "4.2 context_revision"
        lines: "149-170"
      - subject: R5
        section: "5 Cross-writer and boundary fixtures"
        lines: "192-218"
    finding: >-
      R5 simultaneously requires the mathematical value to be an integer, says every fraction
      and negative value is rejected, and makes acceptance exactly equivalent after JSON number
      parsing to ECMAScript Number.isSafeInteger(value) && value >= 0. These rules disagree on
      valid JSON number tokens that round during binary64 parsing and on negative zero. For
      example, ECMAScript parses 9007199254740990.5 to the safe integer 9007199254740990, so the
      stated exact predicate accepts it while the fraction rule rejects it. ECMAScript preserves
      JSON token -0 as negative zero; Number.isSafeInteger(-0) and -0 >= 0 are both true, while
      the negative-value wording can require rejection. RFC 8785 defines canonical serialization
      of an already parsed JSON data model; the phrase "RFC 8785 JSON number parsing" does not
      establish a separate exact-decimal admission algorithm that resolves this conflict.
    impact: >-
      Two implementations can disagree on whether a BindingScope is valid before
      binding_scope_fingerprint computation. That changes binding subject admission and every
      downstream binding activation evidence and assessment result. Even where accepted inputs
      later serialize to the same JCS integer, the acceptance boundary itself is not
      interoperable and startup recovery can reject data accepted by another writer.
    required_amendment: >-
      Define one precedence-complete admission rule for context_revision. State whether
      validation applies to the original JSON number token, an exact-decimal mathematical value,
      or only the parsed IEEE 754 binary64 value; explicitly decide -0; and make the prose,
      predicate, and fixtures agree. If decimal or exponent forms remain permitted, specify
      exact-decimal parsing before any binary64 rounding and require that exact value to be an
      in-range integer, or expressly state that rounded lexical forms are accepted. Add positive
      and negative fixtures for -0, 0, exact exponent forms, fractional values that binary64
      rounds to integers, inexact exponent forms, and both safe-integer boundaries.

prior_finding_disposition:
  - finding_id: F2-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Assignment provenance, self-issuance rejection, attenuation, grant CAS, and issuance
      action binding are closed. BindingScope admission still affects deterministic binding
      activation through F2-R5-IR-B01.
  - finding_id: F2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Typed evidence, stable IDs, acyclic graphs, digest encodings, and exact parent projections
      exist, but context_revision admission remains non-deterministic.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_EXPLICIT_F3_OWNERSHIP_REPLACEMENT
    rationale: >-
      R2 assigns Command payload canonicalization, atomic intake, replay, crash outcome, and
      domain handoff to F3 and keeps runtime intake closed until that separate contract exists.
  - finding_id: F2-IR-M01
    disposition: RESOLVED
    rationale: >-
      R2 closes identity transition and recovery provenance with complete affected-binding
      evidence, stewardship, atomic recovery, and fail-closed conditions.
  - finding_id: F2-R2-IR-B01
    disposition: RESOLVED
    rationale: >-
      R3 supplies a responsibility-free, activation-purpose-only acknowledgement backed by an
      already-active Principal binding and forbids the pending grant as responsibility.
  - finding_id: F2-R2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R3 removes subject/evidence fixed points and R4-R5 close all digest projections, but the
      BindingScope input domain remains ambiguous under F2-R5-IR-B01.
  - finding_id: F2-R2-IR-B03
    disposition: RESOLVED
    rationale: >-
      R3 forbids assignment self-issuance and closes Jenn-root, assignment-rooted, and child
      delegation provenance; R4 binds the complete committed action ref into the grant subject.
  - finding_id: F2-R3-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R4 supplies the missing domain-separated projections and R5 closes all five digest scalar
      representations, but exact BindingScope admission is still incomplete.
  - finding_id: F2-R3-IR-B02
    disposition: RESOLVED
    rationale: >-
      The canonical action-ref fingerprint covers every R2 field, is recomputed from immutable
      F3 COMMITTED bytes, and is bound into the final acyclic delegation subject.
  - finding_id: F2-R4-IR-B01
    disposition: RESOLVED
    rationale: >-
      CanonicalDigestScalarV0_1 fixes SHA-256, RFC 8785 JCS under the owning domain-tagged
      formula, the scalar contract version, 64-character lowercase-hex JSON string persistence,
      validation, and unchanged string insertion into every immediate parent formula.
  - finding_id: F2-R4-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      context_id is now exact and context_revision has a fixed nominal range and JSON type, but
      its parsed-value predicate conflicts with its fraction and negative-value rejection rules.

author_self_review_readjudication:
  - correction_id: F2-R5-SR-01
    disposition: CONFIRMED
    rationale: >-
      The digest scalar has an explicit version and exact persisted and inserted representation.
  - correction_id: F2-R5-SR-02
    disposition: NOT_CONFIRMED_BLOCKING
    rationale: >-
      Unicode 15.1 NFC and the nominal safe-integer range are fixed, but
      Number.isSafeInteger(value) after binary64 parsing is not equivalent to rejecting every
      source fraction or negative zero.
  - author_claim: PASS_NO_AUTHOR_BLOCKER
    disposition: REJECTED
    rationale: F2-R5-IR-B01 remains a deterministic cross-writer blocker.

