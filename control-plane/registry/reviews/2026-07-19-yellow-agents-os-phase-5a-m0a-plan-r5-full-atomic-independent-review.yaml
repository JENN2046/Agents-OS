findings:
  - id: B1_F5_authorization_subject_and_replay_identity_gap
    disposition: BLOCKER
    target_semantic_result: ACCEPTED_INVALID
    stale_hash_or_reference_result: not_applicable_fresh_in_memory_graph
    evidence: dispatch_arm omits authorization subject_ref and subject_revision; its canonical_fact foreign key covers only kind, logical_id, fact_revision, fact_ref, and fact_fingerprint. A fresh row with delivery attempt (attempt:expected,1) and authorization subject (attempt:DIFFERENT,7) committed with empty foreign_key_check.
    related_gap: F5_replay_identity_substitution is declared but not executed; the replay case performs one SELECT and no before/after zero-addition accounting.
  - id: B2_F3_witness_commit_content_and_tuple_gap
    disposition: BLOCKER
    target_semantic_result: ACCEPTED_INVALID
    stale_hash_or_reference_result: not_applicable_fresh_in_memory_graph
    evidence: READY accepted a current F3_WITNESS_COMMIT fact whose canonical bytes disagreed on reservation fingerprint, epoch fingerprint, incarnation, and ownership sequence, and whose fact fingerprint was not the digest of those bytes. The predicate reads neither canonical bytes nor reservation fingerprint and does not execute RECOVERING/READY lifecycle writes.
    favorable_valid_part: ownership Event composite bindings and historical incarnation uniqueness rejected the tested tuple substitutions.
  - id: B3_R5_wrapper_inherited_ABI_inconsistency
    disposition: BLOCKER
    target_semantic_result: CONTRACT_CONTRADICTION
    stale_hash_or_reference_result: not_applicable_exact_fixed_bytes
    evidence: the exact R5 source calls residentNative.process(nativeFrame), while inherited R1/R3 permits exactly execute_command, execute_query, claim_outbox, acknowledge_outbox, and reconcile and forbids a sixth method. It exports only processToolCall while inherited exact exports require initialize, processToolCall, shutdown; R5 does not explicitly replace those inherited clauses.
  - id: B4_boundary_flags_not_semantically_closed
    disposition: BLOCKER
    target_semantic_result: ACCEPTED_INVALID
    stale_hash_or_reference_result: current_bytes_would_fail_integrity_but_fully_resigned_variant_has_no_semantic_rejection
    evidence: setting R5 ABI runtime_usable, implementation_authorized, VCPToolBox_modified, JavaScript_implementation_created, and governance implementation_authorized to true produced an empty validator error list.
  - id: B5_same_revision_rewrite_not_relationally_rejected
    disposition: BLOCKER
    target_semantic_result: ACCEPTED_INVALID
    stale_hash_or_reference_result: not_applicable_in_memory_transaction
    evidence: one coordinated BEGIN IMMEDIATE transaction updated a revision-1 canonical_fact ref, subject, bytes and fingerprint plus its current pointer; COMMIT and foreign_key_check both succeeded despite the inherited immutable and same-revision rewrite-impossible contract.
  - id: B6_duplicate_key_totality_gap
    disposition: BLOCKER
    target_semantic_result: ACCEPTED_INVALID_WHEN_FULLY_RESIGNED
    stale_hash_or_reference_result: current_exact_subjects_have_zero_duplicates
    evidence: yaml.safe_load and json.loads use last-key-wins semantics. A duplicate schema_version witness parsed equal to the original object, and duplicate YAML implementation_authorized values resolved to the last value. No duplicate-rejecting loader is used.
