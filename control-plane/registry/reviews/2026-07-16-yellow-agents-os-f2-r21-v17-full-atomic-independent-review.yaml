    title: synthetic_derived_subject_action_assurance_is_unconstructible
    witness: >-
      R8 materializes synthetic Profile, Principal, and Binding CREATE results
      from one manifest ACCEPT Event and group intent through exact
      SyntheticManifestDerivedLifecycleRef values, expressly without a
      distinct per-subject action, intent, or Event. R16-R17 nevertheless
      require direct PROFILE_REVISION_CREATE, PRINCIPAL_REVISION_CREATE, and
      BINDING_ISSUANCE committed-action assurance for ACTIVE assessments.
      Omitting those roles yields INDETERMINATE; treating a derived ref as an
      action invents a forbidden action; and relabeling manifest ACCEPT gives
      one action multiple roles and violates the exclusive R17 mapping. R18's
      transitive manifest exception covers synthetic Binding activation only.
      The graph can reach ACTIVATED activation evidence, but Profile,
      Principal, and effective Binding cannot reach ACTIVE.
    independently_confirmed_by:
      - full_deterministic_constructive
      - focused_fresh_blocker_verification
    rejected_escape_routes:
      - derived_lifecycle_ref_as_direct_committed_action
      - manifest_ACCEPT_relabelled_with_three_direct_roles
      - preexisting_transitive_exception_for_subject_issuance
    remediation_boundary: >-
      authoritative narrow subject correction for synthetic Profile CREATE,
      Principal CREATE, and Binding issuance assurance only; exact transitive
      manifest assurance, no invented direct action, fail-closed complete set,
      and aligned CompromiseImpact projection

