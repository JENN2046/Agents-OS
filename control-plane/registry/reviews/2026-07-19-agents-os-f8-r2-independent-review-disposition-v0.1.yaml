findings:
  - id: F8-R2-B01
    disposition: ACCEPTED_BLOCKER
    basis: >-
      A01 and A02 reproduce against the real R2 reducer. Exact row and consumer
      fingerprints prove internal consistency but do not bind an assessment
      id and revision to immutable owner-issued evidence outside the
      caller-controlled proof graph.
    R3_required_closure: >-
      Consume an immutable owner-issued assessment revision commitment or
      equivalent owner Event binding. F8 must verify it but must not recreate
      the F1, F2, F3, policy or Jenn owner reducer.

  - id: F8-R2-B02
    disposition: ACCEPTED_BLOCKER
    basis: >-
      A03 reproduces against the real R2 validator with zero errors. The
      acknowledgement reducer accepts a self-consistent candidate tuple that
      is absent from canonical handoff_candidate_history.
    R3_required_closure: >-
      Resolve exact candidate id, revision and fingerprint from canonical
      immutable candidate history before evaluating the F3 outcome assessment.

  - id: F8-R2-B03
    disposition: REJECTED_AS_CONTRACT_MISREAD
    basis: >-
      Fixed R1 section 6 and R2 sections 3 and 5 explicitly define
      based_on_event_sequence greater than or equal to trusted_event_sequence.
      A higher owner observation watermark is therefore current evidence, not
      an invalid path. R3 must not silently change this to equality.
    clarification: >-
      R3 may rename or restate the field as minimum_trusted_event_sequence to
      remove ambiguity, provided the greater-than-or-equal semantic remains
      unchanged and no authority is expanded.

  - id: F8-R2-B04
    disposition: ACCEPTED_REVIEW_COMPLETENESS_BLOCKER_NOT_SUBJECT_DEFECT
    basis: >-
      The external reviewer could not access the exact binary ZIP, hash all 37
      inputs, read all mandatory inputs or execute the five fixed commands.
    next_review_requirement: >-
      The R3 review package must be delivered as an actual downloadable
      attachment and the next reviewer must complete ZIP safety, all input
      hashes/full reads and both workspace-free and archive-local commands.

R3_scope_recommendation:
  - immutable_owner_assessment_revision_commitment_consumption
  - exact_candidate_history_resolution_before_acknowledgement
  - minimum_watermark_semantic_wording_clarification_only_if_needed
  - downloadable_complete_archive_and_full_atomic_reproduction

R3_scope_forbidden:
