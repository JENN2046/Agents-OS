findings:
  - finding_id: F2-R17-FULL-IR-M01
    severity: MAJOR
    title: Materialization v5 changes action and authentication schemas instead of resolving the accepted subjects
    affected_sections:
      - Materialization Sections 13 and 14
      - R1 Sections 14.2 and 15
      - R8 Sections 2.1 and 2.3
      - R9 Section 3 and R15 Section 3 overlays
    finding: >-
      V5 does not print the exact effective schemas required by its own complete
      resolved-surface claim. AuthenticationAssertionV0_1Effective adds an
      assertion_revision and canonical_fingerprint, renames Actor and Principal
      identity fields, and assigns a standalone domain that R1, R2, and the R15
      closed derived-record registry do not define. AuthenticatedCommandContext
      removes command type, target resources, identity revisions, assertion,
      responsibility source, delegation chain, policy revisions, nonce, time,
      and intake fields from the R1 interface and adds a new canonical
      fingerprint. MutationIntentV0_1R15Effective omits the R8 intent revision,
      target-current refs and fingerprints, structured expected target head,
      issued/expires times, nonce, and effective_at_event_sequence, while adding
      target_id, target_revision, expected_previous_revision, and
      intended_effective_event_sequence that no R9 or R15 overlay defines.
      LifecycleActionRefV0_1R8 omits interface_version and
      mutation_replay_identity and adds actor_or_controller_context_ref, which
      is not in the exact R8 schema.
    impact: >-
      An implementer using the mandatory complete materialization would hash,
      validate, and bind different objects from the fixed R1-R17 subjects.
      These are mutation, authentication, and command-attribution boundaries,
      so the divergence is not editorial and v5 cannot be used as the claimed
      deterministic implementation reading surface.
    required_amendment: >-
      Regenerate the materialization without changing the subjects: print the
      exact R8 MutationIntent and LifecycleActionRef objects plus only the
      explicit R9/R15 enum additions, and print the exact R1/R2 authentication
      interfaces without inventing fields or F2 fingerprint authority. Any
      genuinely intended schema change must be a new acceptance subject rather
      than derived materialization prose.

  - finding_id: F2-R17-FULL-IR-M02
    severity: MAJOR
    title: The exhaustive schema index is source-inaccurate and proves only internal row equality, not a complete effective surface
    affected_sections:
      - R17 Section 3
      - Materialization Sections 3, 12 through 14, 20, and 21
      - R3 Section 2, R4 Sections 3 and 4, R8 Sections 2 and 6, and R15 Section 2
    finding: >-
      Mechanical comparison confirms that the 47 schema rows equal the 47
      top-level schema blocks printed in v5 and the eight reducer rows equal the
      eight named reducer headings. That internal equality is not source
      completeness. The index assigns Profile and Principal revision domains
      ending in r7 although R8 explicitly replaces both with r8; assigns the
      nonexistent agents-os.delegation-grant-revision.v0.1-r4 instead of R4's
      agents-os.delegation-grant-subject.v0.1-r4; assigns MutationIntent an r8
      domain although R8 fixes agents-os.mutation-intent.v0.1; assigns the
      synthetic manifest activation revision an r8 domain although R8 fixes
      agents-os.synthetic-m0-manifest-activation-revision.v0.1; and invents
      standalone domains for the R9 activation mutation body and R1
      AuthenticationAssertion. V5 also references but does not print effective
      schemas such as BindingScopeV0_1, DelegationActivationAcknowledgementRef,
      and AuthenticatedActorActionRef, despite R17 requiring every effective
      schema exactly once.
    impact: >-
      The index can pass a self-contained name-set check while giving wrong
      fingerprint bytes and omitting required verification interfaces. This
      leaves the core of R16 finding M02 unresolved even though duplicate names,
      stale aliases, and row-set mismatches were removed.
    required_amendment: >-
      Build the next materialization inventory from the fixed subject schema
      definitions before rendering it. For every effective object, copy the
      exact field set, exact accepted domain or NOT_STANDALONE status, override
      source, and reducer once; include every referenced normative F2 schema or
      explicitly classify an external interface without inventing an F2
      fingerprint. Then mechanically compare both the rendered/index sets and
      each rendered field/domain projection against its source subjects.

prior_findings_disposition:
  F2-R16-FULL-IR-M01:
    result: RESOLVED
    basis: >-
      R17 defines 43 unique canonical ActionAssuranceRole values and 43 unique
      mapping rows. The enum and mapping sets are identical. The exact effective
      tuple inventory is Actor 7, Profile 5, Principal 6, Binding 4, Binding
      activation 4, Assignment 4, Delegation 5, Delegation activation 5, and
      synthetic manifest 3. Each admitted direct assurance action has exactly
      one mapping; zero or multiple matches reject. Complete sets are derived
      from closed revision, transition, evidence, and activation indexes, and
      repeated roles sort deterministically by exact action ref and fingerprint.
  F2-R16-FULL-IR-M02:
    result: PARTIALLY_RESOLVED_BLOCKED_BY_F2-R17-FULL-IR-M01_AND_M02
    basis: >-
      V5 removes duplicate top-level schema names, prints exactly one complete
      CompromiseImpactFactV0_1R9Effective, uses
      TransitionAuthorityBasisV0_1R9, removes ActionAssuranceBindingV0_1R16,
      and makes its printed schema/reducer names mechanically equal its index
      rows. It still changes effective schema bodies, omits normative schemas,
      and records incorrect or invented domain tags, so it is not the exact
      complete object-to-source/domain surface required by R16 M02 and R17.

