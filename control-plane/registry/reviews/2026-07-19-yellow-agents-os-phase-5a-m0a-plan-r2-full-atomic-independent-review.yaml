finding_details:
  - finding_id: PHASE5A-M0A-PLAN-R2-IR-B01
    severity: blocker
    title: The_63_item_closed_obligation_inventory_contains_false_or_incomplete_persistence_ownership
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-closed-contract-obligation-inventory-v0.1-r2.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-exact-persistence-profile-v0.1-r2.yaml
      - control-plane/registry/drafts/2026-07-16-agents-os-f3-resident-singleton-napi-identity-continuity-v0.1-r2-amendment.draft.md
      - control-plane/registry/drafts/2026-07-17-agents-os-f5-outbox-delivery-recovery-v0.1-r4-amendment.draft.md
    evidence:
      - >-
        Frozen F3 R2 lines 409-412 requires one admitted-command transaction to commit context,
        envelope, intake, replay, canonical domain facts, Current State, Event and any admitted
        ledger-only intent. The R2 obligation at lines 1035-1047 assigns only
        inbox_command+command_envelope+replay_index+event.
      - >-
        The exact persistence profile lines 300-309 makes command_intake,
        canonical_fact_advance and outbox_enqueue three separate BEGIN IMMEDIATE transaction owners.
        No single owner implements the atomic obligation claimed by the inventory.
      - >-
        Frozen F5 R4 lines 441-455 and 474-483 requires stored first call-authorization ref,
        fingerprint and committed count. The dispatch_arm row at R2 persistence lines 177-189
        contains none of those three fields, while the obligation claims exact ownership.
    counterexample: >-
      A conforming implementation can commit Inbox/replay/Event under command_intake and crash
      before the separately owned canonical_fact/current-pointer or outbox transactions. It satisfies
      the declared transaction-owner lists while violating the frozen F3 atomic result. Likewise an
      implementation of the declared dispatch_arm columns cannot return the frozen stored first
      call-authorization identity.
    impact: >-
      The 63 rows are not a closed executable mapping from the 110 canonical subjects. B01 is not
      closed even though all owner fields are nonempty and all subject hashes match.
    required_correction:
      - Make each obligation owner semantically complete, not merely nonempty.
      - Bind admitted F3 intake, canonical facts, Current State, Event and ledger-only intent to one transaction owner.
      - Bind every F5 stored-first output to exact persisted fields and replay ownership.

  - finding_id: PHASE5A-M0A-PLAN-R2-IR-B02
    severity: blocker
    title: The_18_table_exact_persistence_and_crash_contract_is_internally_incompatible_with_frozen_F3_F5_F6_semantics
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-exact-persistence-profile-v0.1-r2.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-validation-fault-injection-profile-v0.1.yaml
      - control-plane/registry/drafts/2026-07-16-agents-os-f3-resident-singleton-napi-identity-continuity-v0.1-r1.draft.md
      - control-plane/registry/drafts/2026-07-17-agents-os-f5-outbox-delivery-recovery-v0.1-r6-amendment.draft.md
      - control-plane/registry/drafts/2026-07-18-agents-os-f6-validation-requirement-current-decision-v0.1-r6-amendment.draft.md
    evidence:
      - >-
        Frozen F3 lifecycle is COLD->RECOVERING->READY->DRAINING->STOPPED with INDETERMINATE.
        R2 resident_incarnation.state permits STARTING, READY, STOPPED, COMPROMISED instead and the
        table is declared immutable, so neither the frozen enum nor its transitions are representable.
      - >-
        Frozen F5 first-apply is decided at dispatch arm before the physical call and receipt.
        R2 first_apply_guard requires a non-null winning_receipt_id and is written only by
        receipt_apply, after a receipt exists.
      - >-
        canonical_fact permits two fact_ref values for one fact_kind/logical_id/revision and has no
        predecessor FK, continuity or same-identity constraint. current_fact_pointer binds only
        ref/revision, not kind/logical_id/fingerprint. These relations do not enforce frozen F6
        unique contiguous lineage and exact current-head identity.
      - >-
        Immutable R1 fault profile lines 83-90 requires after_pointer_CAS_before_Event, while the
        immediate Event foreign keys and R2 crash profile lines 323-331 require Event before pointer
        CAS. The atomic R1+R2 subjects specify incompatible write orders.
    counterexample: >-
      The declared exact relations admit a current VALIDATION_SET pointer that references a
      VALIDATION_REQUIREMENT fact, a completion row for one Task that references another Task's fact,
      and a first-apply guard that pairs one intent with another attempt/receipt. Conversely, the
      required first-apply guard cannot be inserted at the frozen pre-call arm boundary because its
      receipt does not yet exist.
    impact: >-
      Two materially different implementations can satisfy the table names and transaction labels,
      while the frozen lifecycle, lineage, first-apply and crash semantics cannot all be satisfied.
      This directly prevents an exact implementation-plan freeze.
    required_correction:
      - Align the exact F3 lifecycle storage and transition ownership with the frozen lifecycle.
      - Persist first-apply at the arm boundary without a future receipt dependency.
      - Close fact predecessor, same-revision uniqueness, kind/logical identity, pointer fingerprint and Task bindings.
      - Freeze one write order shared by the immutable R1 crash profile and R2 transaction model.

  - finding_id: PHASE5A-M0A-PLAN-R2-IR-B03
    severity: blocker
    title: External_materialization_still_has_two_non_equivalent_digest_and_entrypoint_interpretations
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-external-materialization-profile-v0.1-r2.yaml
      - upstream/vcptoolbox/docs/PLUGIN_ECOSYSTEM.md
    evidence:
      - >-
        content_tree_hash lines 90-103 explicitly excludes package-manifest.json. The receipt at
        lines 180-193 requires installed_tree_sha256 to equal content_tree_sha256, but defines no
        installed-tree inventory, exclusion set, leaf encoding, file-mode scope or treatment of the
        package manifest.
      - >-
        The profile freezes the plugin export as processToolCall(toolName, toolArgs, requestIp).
        The fixed VCP module examples export processToolCall(args); the three-argument signature in
        the VCP document belongs to the outer Plugin manager method, not the plugin module example.
    counterexample: >-
      One materializer hashes the installed projection with the same package-manifest exclusion as
      the source content tree; another hashes every installed regular file including the package
      manifest. The profile gives no installed-tree algorithm to choose between them. Separately, an
      index.js following the frozen three-argument module signature and one following the fixed VCP
      one-argument module contract have different argument semantics while each can be defended from
      one section of the current text.
    impact: >-
      WP0 still cannot produce one uniquely reproducible receipt and one uniquely compatible direct
      entrypoint from the frozen plan. B03 is therefore not fully closed.
    required_correction:
      - Define installed_tree_sha256 with the exact same or explicitly different inventory and leaf algorithm.
      - Distinguish the Plugin manager call signature from the plugin module export signature and freeze the VCP-compatible module ABI.

