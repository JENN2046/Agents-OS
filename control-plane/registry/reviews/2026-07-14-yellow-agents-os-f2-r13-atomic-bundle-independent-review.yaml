findings:
  - finding_id: F2-R13-IR-B01
    severity: BLOCKER
    title: Negative production and Jenn-credential exclusions have no closed evidence universe
    affected_sections:
      - R13 Sections 2-4
      - Materialization Sections 3.3 and 4.4
    finding: >-
      R13 closes the positive eligibility path: the exact Actor revision is
      ACTIVE at ACCEPT, its contiguous lineage reaches revision 1 CREATE, that
      CREATE uses a verified Jenn governance authority with SYNTHETIC_TEST and
      IDENTITY_BOOTSTRAP, and the immutable actor_class is allowlisted. The
      same ELIGIBLE predicate additionally requires that no production Actor
      Binding or active Jenn credential is referenced. The contract does not
      define the exact reference locations or index universe covered by those
      negative checks. The assessment schema binds Actor lineage and root
      authority evidence, but has no Binding/credential inventory or coverage
      reference, and the text does not say whether the check covers only
      assignment_binding_ref, every Binding for actor_id, manifest credential
      handles, creation specs, or another closed set.
    impact: >-
      Two conforming reducers can agree on all positive fields yet disagree on
      ELIGIBLE because one scans only the Actor revision while another scans
      all Actor Bindings or manifest credential handles. A missing index entry
      can also be treated as absence instead of incomplete evidence. The core
      prohibition against using a production or Jenn identity in the
      synthetic M0 path therefore remains non-deterministic.
    required_amendment: >-
      Define the exact negative-check universe and its completeness proof at
      the ACCEPT watermark. Either bind a closed sorted inventory plus
      coverage fingerprint into the eligibility assessment, or narrow the
      Actor predicate to exact immutable Actor-lineage fields and place the
      existing manifest credential/Binding exclusions in a separately named
      complete manifest validation predicate. Missing or incomplete coverage
      must reduce to INDETERMINATE, never ELIGIBLE.

  - finding_id: F2-R13-IR-m01
    severity: MINOR
    title: Materialization retains one superseded ACTIVE-only sentence
    affected_sections:
      - Materialization Section 3.3
    finding: >-
      The paragraph immediately before the R13 eligibility schema still says
      Rust separately requires only the Actor's exact ACTIVE assessment at
      ACCEPT. R13 replaces that wording with the stronger ELIGIBLE assessment,
      and the following schema, table, and atomic graph state the stronger rule.
    impact: >-
      The later exact surfaces control, but this stale sentence weakens the
      resolved reading surface and can mislead a reader extracting the prose
      without the following table.
    required_amendment: >-
      Replace the ACTIVE-only sentence with the exact R13 ELIGIBLE requirement.

