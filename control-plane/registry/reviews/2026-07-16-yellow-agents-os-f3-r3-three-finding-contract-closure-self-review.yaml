      binds gap R+1..H and a new one-use lineage, and preserves crash-total
      reservation/commit semantics.
  - finding_id: F3-R2-FULL-ATOMIC-IR-M03
    status: RESOLVED_IN_R3_PENDING_INDEPENDENT_CONFIRMATION
    R3_sections: [4.1, 4.2, 4.3, 5.1, 5.2, 5.3, 5.4]
    evidence: >-
      The issuance registry instance now supplies every R1
      CommandTypeDefinition field with recomputable schema/reducer digests and
