findings_resolved_in_subject:
  - finding_id: F2-SR-01
    severity: BLOCKER
    finding: HOST_PRINCIPAL conflated stable Actor class with ephemeral Principal class
    resolution: renamed stable Actor class to EXECUTION_HOST and retained HOST_PROCESS as the Principal class
  - finding_id: F2-SR-02
    severity: BLOCKER
    finding: earlier F2 design duplicated permission through action allowlists, risk ceilings, and ALLOW_DENY assessment
    resolution: removed those structures and retained one prohibited-first boundary only
  - finding_id: F2-SR-03
    severity: MAJOR
    finding: responsibility assignment and delegation used inconsistent scope shapes
    resolution: both now bind the same ResponsibilityScope contract
  - finding_id: F2-SR-04
    severity: MAJOR
    finding: accepted role and responsibility mismatch could be misread as hidden permission sources or denials
    resolution: role charter is only an assignment basis and mismatch is an accountability-routing issue, not a permission denial
  - finding_id: F2-SR-05
    severity: MAJOR
    finding: accepted upstream authority terminology lacked an explicit mapping to the new separation of concerns
    resolution: F1 decision ownership is classified as a domain invariant and historical bytes require future overlays rather than silent rewrite

