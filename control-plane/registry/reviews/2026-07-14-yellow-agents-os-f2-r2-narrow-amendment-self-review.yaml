  - finding_id: F2-IR-B01
    disposition: RESOLVED_IN_R2
    evidence_sections:
      - R2_Section_3
      - R2_Section_4
    rationale: >-
      Assignment issuance now has a closed source set, exact authenticated issuer action,
      source currentness, immutable predecessor/CAS lineage, and exact kind/scope/time/depth
      attenuation. Every delegation edge checks immediate-source redelegation and narrowing.
  - finding_id: F2-IR-B02
    disposition: RESOLVED_IN_R2
    evidence_sections:
      - R2_Section_5
      - R2_Section_6
      - R2_Section_9
    rationale: >-
      Binding and delegation now carry typed activation evidence with exact target fingerprints,
      Principal control proof, authenticated acknowledgement, time, replay identity, revision,
      revocation, supersession, fingerprint, reducer, recovery, and negative-test semantics.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_OWNERSHIP_REPLACEMENT
    evidence_sections:
      - R2_Section_2
      - R2_Section_8
    rationale: >-
      Incomplete F2-owned Command schemas are explicitly replaced. F2 owns only an immutable
      attribution interface; F3 owns payload schema, canonical bytes, nonce/replay CAS, intake
      states, crash recovery, and atomic domain handoff. Runtime remains closed until F3 exists.
  - finding_id: F2-IR-M01
    disposition: RESOLVED_IN_R2
    evidence_sections:
      - R2_Section_7
    rationale: >-
      Identity transitions now bind a closed steward relation and authenticated action, while
      compromise recovery binds the complete affected-binding set and one atomic activation rule.

