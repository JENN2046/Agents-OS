  blockers:
    - id: B1
      title: Fully resigned source/Host/extension commitment substitutions are accepted
      evidence: >
        The validator only format-checks baseline commit/hash fields and the seven Host
        rows; it does not bind them to the sealed constants or an immutable Phase 5C
        contract digest. Independently rebuilt profile+fixture+package attacks returned
        QUARANTINED_HOST_SMOKE_PREFLIGHT_READY with zero errors.
      affected_validator_lines: 90-171, 415-433
    - id: B2
      title: The implementation-plan subject is not semantically bound to the favorable validator outcome
      evidence: >
        The validator loads only PROFILE_PATH and the witness. Two fully resigned
        packages whose plan text claimed current Host/plugin/runtime execution or
        processToolCall/native execution still returned
        QUARANTINED_HOST_SMOKE_PREFLIGHT_READY with zero errors.
      affected_validator_lines: 18-21, 436-445
    - id: B3
      title: Duplicate YAML and noncanonical profile identity are accepted
      evidence: >
        yaml.safe_load accepts a duplicate profile key, and schema_version/profile_id/status
        lack exact value checks. The independently re-signed duplicate-YAML and
        noncanonical-identity packages both returned the favorable result.
      affected_validator_lines: 88-117, 328

scope_limits:
