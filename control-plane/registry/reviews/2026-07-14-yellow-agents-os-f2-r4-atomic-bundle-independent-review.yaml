findings:
  - finding_id: F2-R4-IR-B01
    severity: BLOCKER
    title: SHA-derived replay identities and stable evidence IDs have no exact inserted JCS representation
    subject_locations:
      - subject: R3
        section: "2 Non-circular delegation activation acknowledgement"
        lines: "61-177"
      - subject: R3
        section: "3-4 Acyclic activation fingerprint graphs"
        lines: "179-328"
      - subject: R4
        section: "2 Canonicalization primitives"
        lines: "56-93"
      - subject: R4
        section: "4.3, 5, and 6 acknowledgement, evidence, and assessment fingerprints"
        lines: "212-425"
    finding: >-
      R4 defines an envelope and nested-value rule for named R4 fingerprint results and says
      that a nested *_fingerprint contributes its lowercase digest string. It does not define
      the stored type or insertion rule for SHA-derived values named replay_identity or
      evidence_id. The acknowledgement fingerprint inserts the R3 acknowledgement
      replay_identity; both evidence fingerprints insert R4 replay identities; and the evidence
      formulas insert stable evidence_id values derived by R3. Those source formulas say
      SHA-256(JCS(...)) but do not say whether the resulting value is raw bytes, lowercase hex,
      a FingerprintEnvelope, or another scalar encoding. The R4 rule is expressly limited to
      *_fingerprint insertion and therefore does not close these positions. Independent writers
      can hash the same semantic inputs yet insert different JCS values into the acknowledgement
      or evidence formula.
    impact: >-
      Binding and delegation evidence can still receive different canonical fingerprints and
      replay keys across writers or during startup recovery. This is the same determinism
      surface identified by F2-R3-IR-B01, so the activation graph is acyclic but not yet
      byte-identical and acceptance-ready.
    required_amendment: >-
      Define one exact domain-separated digest-value type for every SHA-derived replay identity
      and stable evidence ID, including algorithm, canonicalization version, lowercase-hex
      encoding, and whether the persisted field is an envelope or scalar. State the exact value
      inserted into JCS whenever replay_identity or evidence_id appears in another formula.
      Apply that rule to the R3 acknowledgement replay identity, both R3 evidence IDs, and both
      R4 evidence replay identities. Add cross-writer fixtures that distinguish raw bytes,
      uppercase hex, lowercase hex, and envelope-object encodings.

  - finding_id: F2-R4-IR-B02
    severity: BLOCKER
    title: BindingScopeV0_1 leaves context_id and context_revision representation under-typed
    subject_locations:
      - subject: R4
        section: "2 Canonicalization primitives"
        lines: "56-93"
      - subject: R4
        section: "3 Closed BindingScope v0.1"
        lines: "95-140"
    finding: >-
      BindingScopeV0_1 closes context_kind, ordering, duplicates, wildcards, unknown fields, and
      the set fingerprint, but context_id has no declared type or non-empty constraint. The
      scalar-reference rule does not apply because context_id is not a *_ref field. The scope
      fingerprint and UTF-8 sort prose presume a string while the YAML shape itself permits an
      untyped value. In addition, context_revision is declared only as a nonnegative integer,
      while R4's primitive rule requires every integer to be within a contract-declared range;
      no upper bound or fixed integer domain is declared. Implementations using bounded integer
      types can therefore disagree on acceptance, and an empty or non-string context_id has no
      single normative outcome.
    impact: >-
      Two conforming-looking writers can accept different BindingScope values or fail to share
      canonical fixture coverage, which changes binding_subject_fingerprint and every downstream
      binding activation fingerprint. This leaves F2-R3-IR-B01 unresolved at its first input.
    required_amendment: >-
      Declare context_id as one normalized, non-empty UTF-8 scalar string with an exact validity
      rule, and declare context_revision in a fixed interoperable integer domain such as unsigned
      64-bit JSON integer. State rejection for wrong type, empty normalized value, overflow, and
      negative values. Add positive boundary fixtures and negative wrong-type, empty, overflow,
      and normalization-collision fixtures. Keep BindingScope representation-only and do not add
      action, capability, or permission semantics.

prior_finding_disposition:
  - finding_id: F2-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Assignment provenance, self-issuance rejection, attenuation, grant CAS, and issuance
      provenance semantics are closed by R2-R4. Binding activation canonicalization remains
      blocked by F2-R4-IR-B01 and F2-R4-IR-B02.
  - finding_id: F2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Typed activation evidence and acyclic subject-to-evidence-to-assessment graphs exist, but
      the remaining digest representation and BindingScope type gaps prevent deterministic
      verification.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_EXPLICIT_F3_OWNERSHIP_REPLACEMENT
    rationale: >-
      R2 moves Command payload schemas, canonicalization, atomic intake, replay, crash state, and
      domain handoff to the separate F3 contract and keeps runtime intake closed until F3 exists.
  - finding_id: F2-IR-M01
    disposition: RESOLVED
    rationale: >-
      R2 defines the closed stewardship relation, authenticated action reference, complete
      affected-binding set, exact recovery evidence, and atomic recovery condition.
  - finding_id: F2-R2-IR-B01
    disposition: RESOLVED
    rationale: >-
      R3 defines a responsibility-free, activation-purpose-only acknowledgement through an
      already-active Principal binding and rejects use of the pending grant as responsibility.
  - finding_id: F2-R2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R3 removes the subject/evidence fixed point and R4 supplies domain-separated projections,
      but F2-R4-IR-B01 and F2-R4-IR-B02 leave two inputs without an exact interoperable value.
  - finding_id: F2-R2-IR-B03
    disposition: RESOLVED
    rationale: >-
      R3 forbids assignment self-issuance without exception and defines exact Jenn-root,
      assignment-rooted, and parent-delegation issuance provenance. R4 now binds the complete
      AuthenticatedActorActionRef fingerprint into the grant subject.
  - finding_id: F2-R3-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      R4 closes domain separation, field projections, nested structured refs, assessment
      fingerprints, and removal of acknowledging_action_ref. SHA-derived replay/evidence-ID
      insertion and BindingScope scalar typing remain incomplete as specified in the new blockers.
  - finding_id: F2-R3-IR-B02
    disposition: RESOLVED
    rationale: >-
      canonical_action_ref_fingerprint covers every R2-declared AuthenticatedActorActionRef
      field, excludes only itself, is recomputed from immutable F3 COMMITTED bytes, and is bound
      into the final grant subject after the pre-action intent without a reverse dependency.

author_self_review_readjudication:
  - correction_id: F2-R4-SR-01
    disposition: REJECTED_AS_INCOMPLETE
    rationale: >-
      The author correctly supplied formulas, but the claim of complete canonical closure misses
      the replay/evidence-ID inserted-value ambiguity and BindingScope field types.
  - correction_id: F2-R4-SR-02
    disposition: CONFIRMED
    rationale: >-
      The full action-ref fingerprint is field-complete, recomputed rather than trusted, and
      bound into the final grant subject without restoring the action/subject cycle.
  - correction_id: F2-R4-SR-03
    disposition: CONFIRMED_WITH_BLOCKING_INPUT_GAPS
    rationale: >-
      Evidence and assessment formulas cover their source-schema fields and exact structured-ref
      fingerprints, but two inserted input types remain non-canonical under the blockers above.

