finding_details:
  - finding_id: PHASE5A-M0A-PLAN-IR-B01
    severity: blocker
    title: F1_through_F6_exact_contract_traceability_cannot_be_verified_from_the_fixed_review_unit
    affected_subject:
      path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-contract-traceability-matrix-v0.1.yaml
      sections:
        - lines_15_130_units
        - lines_151_155_completion_definition
    evidence:
      - The six accepted or frozen decisions enumerate 110 F1-through-F6 acceptance subjects in total.
      - The archive contains zero of those 110 canonical subject byte streams; decisions and selected manifests contain paths and hashes, not the normative clauses needed for traceability review.
      - Only the F2 and F3 manifests are included. The F1, F4, F5 and F6 canonical manifests are absent from the declared authority inputs.
      - The F5 freeze decision exposes 12 frozen semantic boundary classes, while the matrix provides four aggregate M0 behavior labels and no one-to-one clause disposition.
      - The F6 freeze decision exposes 11 frozen semantic boundary classes, while the matrix provides three aggregate M0 behavior labels and no one-to-one clause disposition.
      - The F4 freeze decision does not summarize its 29-subject effective semantic boundary, so its three matrix behavior labels cannot be checked against the fixed contract from this package.
    counterexample: >-
      An implementation can satisfy every row currently present in the matrix
      while omitting F5 dispatch-arm/first-apply semantics or F6 requirement
      lineage/contextual-assessment immutability. The package supplies no
      clause-level inventory that would classify the omission as M0A_INCOMPLETE.
    impact: >-
      The manifest's required question that every F1-through-F6 contract has
      code, SQL, behavior and test ownership cannot be answered from the fixed
      bytes. Freezing this matrix would therefore freeze an unverified subset,
      not the exact engineering scope.
    required_correction:
      - Bind the canonical F1-through-F6 manifests and all M0-applicable normative subject bytes into R2.
      - Create a complete clause or closed semantic-inventory mapping with IMPLEMENT_IN_M0A or EXCLUDED_FROM_M0A dispositions.
      - For every implemented item bind exact module, persistent row or explicit no-persistence result, reducer owner, positive test, negative test, replay test and crash test where applicable.

  - finding_id: PHASE5A-M0A-PLAN-IR-B02
    severity: blocker
    title: The_fixed_SQLite_inventory_does_not_close_the_canonical_fact_assessment_snapshot_and_delivery_model
    affected_subjects:
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-build-profile-v0.1.yaml
        sections:
          - lines_110_143_sqlite
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-implementation-plan-v0.1.md
        sections:
          - lines_118_141_persistence_and_recovery
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-contract-traceability-matrix-v0.1.yaml
        sections:
          - lines_91_130_F5_F6
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-validation-fault-injection-profile-v0.1.yaml
        sections:
          - lines_80_102_crash_matrix
    evidence:
      - The build profile freezes a closed-looking list of 15 tables but includes no goal, task, run, validation or generic immutable canonical-fact table.
      - The plan states that assessment and snapshot rows are immutable, but neither appears in the table inventory or immutable_row_classes.
      - No target relation or row-class contract is defined for current_fact_pointer.
      - F5 freezes delivery attempt identity, dispatch-arm replay, stored-first accounting and first-apply eligibility, but the table inventory and crash matrix expose only outbox_intent, outbox_claim and delivery_receipt and have no dispatch-arm persistence boundary.
      - F6 freezes Requirement and Validation Set lineage, attempt context, waiver currentness, carry-forward roots, contextual assessments and same-revision history, but the exact inventory gives them no persistent row ownership or explicit event-only encoding.
    counterexample: >-
      Two implementations both satisfy the listed table names: one stores all
      omitted immutable objects as opaque Event payloads and points current_fact_pointer
      to Event; another adds hidden assessment, snapshot, attempt and dispatch-arm
      tables. They have materially different recovery, foreign-key and immutability
      behavior, yet the frozen plan cannot distinguish them. If the table list is
      exhaustive, several named plan rows are unrepresentable; if it is not
      exhaustive, the exact schema scope is not frozen.
    impact: >-
      WP3, WP5 and WP6 cannot begin from one reviewable persistence contract,
      and the requested exact engineering range is either internally incomplete
      or open to unreviewed schema expansion.
    required_correction:
      - Define whether the table inventory is exhaustive.
      - Bind every M0A canonical row class to an exact table or to a defined generic immutable-fact encoding.
      - Freeze primary identities, predecessor/current-head bindings, immutable versus mutable columns, current-pointer target and same-transaction CAS ownership.
      - Add explicit dispatch-arm, first-apply and F6 attempt/context/waiver/carry-forward persistence and crash-window mappings, whether as dedicated or generic rows.

  - finding_id: PHASE5A-M0A-PLAN-IR-B03
    severity: blocker
    title: External_source_materialization_and_blocked_plugin_overlay_are_not_yet_exactly_hash_bound
    affected_subjects:
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-build-profile-v0.1.yaml
        sections:
          - lines_9_39_source_and_installation
      - path: control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-implementation-plan-v0.1.md
        sections:
          - lines_39_71_source_and_runtime_ownership
          - line_80_WP0
    evidence:
      - The plan requires source_commit, package_manifest_sha256 and content_tree_sha256 but names no binding file or schema.
      - No canonical tree-hash algorithm fixes path normalization, file ordering, executable bits, symlink policy, empty directories or exclusion semantics.
      - The exact plugin-manifest.json.block payload is absent. VCPToolBox's fixed plugin contract requires at least name, pluginType, entryPoint and communication; only pluginType and protocol are fixed here.
      - The JavaScript direct hybridservice entrypoint and lifecycle exports are not identified, so the blocked overlay cannot be reproduced or compatibility-checked from the plan.
      - The zero-core-diff rule does not define the exact clean-worktree comparison that distinguishes the one allowed install overlay from any other untracked or modified path.
    counterexample: >-
      Two different copied trees can each carry three self-declared hashes and
      a blocked manifest while using different entrypoints, file modes, symlink
      targets or tree canonicalization. Both satisfy the current prose, but only
      one may match the reviewed source or VCPToolBox direct-plugin contract.
    impact: >-
      The central external-source and upstream-trackability boundary is a policy
      intention but not yet a reproducible engineering artifact. WP0 therefore
      cannot be frozen as an exact materialization boundary.
    required_correction:
      - Freeze the external package file inventory and deterministic package-manifest schema.
      - Freeze content-tree hashing and path, mode, symlink and exclusion rules.
      - Include the exact blocked VCPToolBox manifest payload and direct JavaScript entrypoint/lifecycle contract.
      - Define the clean linked-worktree core-diff command and its single allowed install-overlay path.

