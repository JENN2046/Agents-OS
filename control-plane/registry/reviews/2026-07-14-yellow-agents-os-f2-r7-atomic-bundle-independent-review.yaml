findings:
  - finding_id: F2-R7-IR-B01
    severity: BLOCKER
    title: Lifecycle and governed transition actions are not bound to the exact requested mutation
    affected_sections:
      - R7 Section 3.1
      - R7 Sections 4.2-4.3
      - R7 Sections 5.2 and 6.1-6.2
      - R7 Sections 8.1-8.2
      - R7 Section 9.2
    finding: >-
      LifecycleActionRef proves an action identity and, for an Actor route, the
      acting Actor, but R7 never requires the committed Command payload or a
      separate acyclic intent fingerprint to bind the exact target, transition,
      expected head, authority basis, effective Event, and other mutation
      fields. GovernedStateTransitionFact explicitly says only that the action
      must prove the exact Actor. The same otherwise-valid committed action can
      therefore be reused as provenance for a different transition fact or
      lifecycle revision without violating the written predicate.
    impact: >-
      Authentication attribution is not consent to the exact mutation. Actor,
      Profile, Principal, Binding, Assignment, Delegation, activation-evidence,
      and compromise-impact state changes are not deterministically authorized
      by the action bytes they cite.
    required_amendment: >-
      Define one acyclic transition-intent fingerprint containing every
      mutation field that must be chosen before action commit, require the F3
      Command envelope to name it, bind the resulting subject/fact to the
      complete AuthenticatedActorActionRef, and define replay uniqueness. Give
      governance/provisioning decision routes an equivalent exact-content
      binding rule.

  - finding_id: F2-R7-IR-B02
    severity: BLOCKER
    title: Target-specific transition authority still contains non-canonical roles and predicates
    affected_sections:
      - R7 Section 8.2
    finding: >-
      The matrix relies on undefined or non-reducible terms including
      evidence_steward, target_Binding_lifecycle_authority, and Nobao_for_a_subordinate_chain_in_accepted_scope.
      It does not type the authority_basis_ref by target_kind and transition or
      state the exact current responsibility/identity/controller assessment
      that proves each phrase. accepted_incident_action is likewise described
      narratively rather than as one closed basis union.
    impact: >-
      Two conforming writers can disagree over who may suspend, resume, revoke,
      or renounce the same target. This leaves the R6 revocation blocker open
      despite the new fact envelope.
    required_amendment: >-
      Replace every narrative authority phrase with a typed target-specific
      AuthorityBasis union, exact required refs/fingerprints/current
      assessments, required or forbidden requested_by_actor_ref rules, and one
      total predicate per target_kind plus transition.

  - finding_id: F2-R7-IR-B03
    severity: BLOCKER
    title: Delegation effective reducer does not define descendant cascade outcomes
    affected_sections:
      - R7 Section 8.3
      - R7 Section 12.2
    finding: >-
      Section 8.3 promises that closing a parent makes descendants safely
      non-active, but the Section 12.2 total-order list maps only a target
      REVOKE or RENOUNCE. It does not map an exact parent or ancestor that is
      REVOKED, RENOUNCED, EXPIRED, or otherwise closed, nor an inactive root
      Assignment/source responsibility. Those inputs are neither missing nor
      necessarily superseded, so no listed branch determines the child's
      output.
    impact: >-
      delegation_effective_current_projection is not a total deterministic
      reducer and implementations can return REVOKED, EXPIRED, SUPERSEDED, or
      INDETERMINATE for the same immutable facts.
    required_amendment: >-
      Add an exhaustive source/ancestor-state matrix and precedence, including
      the exact prospective Event boundary for parent REVOKE, RENOUNCE,
      SUSPEND, RESUME, expiry, supersession, challenge, and invalidation.

  - finding_id: F2-R7-IR-B04
    severity: BLOCKER
    title: Historical action current assurance lacks a complete multi-impact reducer
    affected_sections:
      - R7 Sections 9.1-9.2
    finding: >-
      HistoricalActionValidityAssessment carries a caller-visible list of
      compromise impact refs, but R7 does not define how the reducer proves
      that the list contains every current impact head targeting the action at
      based_on_event_sequence. It also lacks an aggregation rule when separate
      incidents/impact streams simultaneously CONFIRM, CHALLENGE, INVALIDATE,
      or clear their own challenge for the same action.
    impact: >-
      Omitting a current impact stream can incorrectly produce CONFIRMED, while
      different traversal orders can produce different assurance. Assignment
      and Delegation currentness both consume this value, so historical/current
      separation is not yet operationally closed.
    required_amendment: >-
      Define a complete ledger-derived impact-input set with a coverage
      watermark/fingerprint and a total aggregation precedence. CLEAR_CHALLENGE
      must affect only its exact stream; any current INVALIDATED input should
      have an explicit terminal aggregate effect and all omitted/conflicting
      coverage must fail closed.

  - finding_id: F2-R7-IR-B05
    severity: BLOCKER
    title: Synthetic M0 lifecycle controller provisioning is not a closed canonical graph
    affected_sections:
      - R7 Sections 5.1-5.3
      - R7 Section 6.5
    finding: >-
      SYNTHETIC_FIXTURE_CONTROLLER must exist inside one accepted manifest and
      Profile assessment must verify its exact current fingerprint. However the
      manifest has no synthetic-controller creation-spec collection and R7
      defines no canonical controller subject or deterministic controller
      fingerprint. creation_authority_ref is also untyped. The prose does not
      state exactly how a Profile/Principal's manifest-derived lifecycle refs
      are inserted into the non-referential creation spec; Principal has both a
      provisioning_source_ref and transition_action_ref.
    impact: >-
      A synthetic Profile cannot deterministically prove controller currentness
      or be reproduced from the manifest without implementation invention. The
      requested authoritative M0 fixture provisioning path remains incomplete.
    required_amendment: >-
      Add a canonical synthetic-controller spec/object and manifest ordering,
      type creation_authority_ref, and define the exact acyclic derivation of
      every Profile, Principal, and Binding lifecycle/issuance ref from manifest
      plus acceptance decision; alternatively eliminate the separate synthetic
      controller identity and use one fully specified manifest-owned verifier.

  - finding_id: F2-R7-IR-B06
    severity: BLOCKER
    title: The complete ActorIdentityRevision fingerprint still references a nonexistent owning domain tag
    affected_sections:
      - R7 Sections 2.1 and 4.2
      - R1 Section 18
      - R4 Section 2
    finding: >-
      R7 says the complete effective Actor revision keeps the owning R1-R4
      Actor identity domain tag, but R1 provides only a generic
      FingerprintEnvelope and narrative inclusion rule, and R4 does not define
      an ActorIdentityRevision domain tag or complete formula. R7 adds lifecycle
      fields before Event sequence without naming an exact tag and complete
      effective schema projection. The text also does not explicitly enumerate
      which overlapping R2 stewardship fields remain or are removed.
    impact: >-
      Rust and JavaScript writers cannot independently reproduce the same Actor
      revision bytes/fingerprint, so Actor lifecycle head CAS and every
      dependent Principal/Binding assessment lack a fixed identity input.
    required_amendment: >-
      Define the exact ActorIdentityRevision v0.1-r7 domain tag and complete
      schema-known object, explicitly resolve all R2/R7 overlapping lifecycle
      fields, and add cross-writer fixtures for every transition.

  - finding_id: F2-R7-IR-M01
    severity: MAJOR
    title: The derived materialization overstates closure and does not fully expose effective schema precedence
    affected_sections:
      - Materialization Sections 2, 4, 6, 10, 11, and 15
    finding: >-
      The materialization is hash-bound and correctly non-authoritative, but it
      summarizes rather than expands several effective schemas. It says the
      Actor contains R2/R7 lifecycle provenance without resolving their
      overlapping fields, states that the synthetic manifest avoids a cycle
      despite the undefined controller path, and presents transition and
      historical assurance as closed despite the missing predicates above.
    impact: >-
      It is useful as a topic map but not yet the implementation-safe resolved
      reading surface required by R7 Section 13.3 and the prior M03 finding.
    required_amendment: >-
      Regenerate the materialization after blocker closure with the exact
      effective schemas, reducer tables, source section/hash annotations, and
      explicit removal of superseded fields and claims.

