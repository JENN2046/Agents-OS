  activation_revalidation: >-
    The assessment binds only the already-current SUSPEND head, underlying
    evidence, subject, fresh proof or historical acknowledgement assurance, and
    current dependencies. The later RESUME body consumes the assessment; the
    assessment consumes neither that RESUME action nor the effective activation
    result it helps derive.
  Worker_stewardship: >-
    The scope assessment reads immutable Worker/source bytes and a target-state-
    excluded responsibility projection. It forbids the target Worker assessment,
    the operational Worker-binding assessment, and any Domain Agent lineage
    containing or deriving from the target Worker. The later Actor transition
    consumes stewardship evidence and evaluates target state separately.
  Delegation_reason: >-
    Reason fields enter the pre-action R19 issuance intent, then the committed
    action and the R4 final subject; acknowledgement and activation remain later
    dependencies. No backward subject or activation reference is introduced.
  authority: >-
    R19 adds no transition, assurance role, authority kind, permission,
    responsibility writer, F3 payload, runtime path, or Prohibited Boundary
    exception. V14 remains a derived-only reading surface.

