findings:
- id: F8-R3-B01
  severity: blocker
  title: R3 validator contradicts the normative all-or-none nullable AssessmentConsumerV0_1R3 contract
  status: OPEN
  exact_evidence:
  - path: subjects/F8-R3-amendment.md
    lines: 83-113
    fact: AssessmentConsumerV0_1R3 permits all six fields null or all six non-null; missing evidence must fail closed.
  - path: validator/validate-f8-r3-witness.py
    lines: 622-631
    fact: validate_consumer unconditionally requires stable refs, positive integers, and hashes for every field and has no
      all-null branch.
  - path: fixture/F8-R2-synthetic-witness.json
    lines: 279-315
    fact: The valid H01 CANDIDATE_FORMED baseline contains an optional jenn_exact_decision consumer with all three R2 fields
      null.
  - probe: A49
    fact: A fully re-signed all-six-null formation consumer derives INDETERMINATE but is rejected by six primitive validation
      errors.
  - probe: A52
    fact: A fully re-signed all-six-null acknowledgement consumer derives ACKNOWLEDGED_INDETERMINATE but is rejected by six
      primitive validation errors.
  counterexample:
    consumer:
      assessment_id: null
      expected_assessment_revision: null
      expected_assessment_fingerprint: null
      owner_commitment_ref: null
      expected_owner_commitment_revision: null
      expected_owner_commitment_fingerprint: null
    normative_expected_behavior: schema-valid missing evidence followed by fail-closed INDETERMINATE projection
    actual_validator_behavior: 'schema rejection: stable_ref, positive integer and SHA-256 required for all six fields'
  impact:
  - R3 explicitly replaces the R2 consumer schema globally, not only for F7/F3 fixture rows.
  - The ordinary R2 no-exact-Jenn-decision candidate path depends on a nullable optional consumer.
  - The eight fixed commands miss the contradiction because R2 and R3 validators operate separate fixtures instead of an integrated
    upgraded H01 path.
  - The current R3 subject bytes therefore do not preserve the inherited minimum-interface possibility contract.
  correction_required:
  - Update validate_consumer to accept exactly all-null or all-non-null tuples and reject every mixed tuple.
  - Resolve an all-null tuple directly to missing/unavailable evidence and a stable fail-closed result before any owner-store
    lookup.
  - Add positive all-null formation and acknowledgement witnesses.
  - Add mixed-null negative regressions.
  - Add an integrated R2 H01 upgraded-to-R3 regression that retains CANDIDATE_FORMED with the optional Jenn-decision consumer
    all-null.
  - Rebuild and hash-bind new subject, fixture, validator, manifest and review ZIP bytes for R4.
