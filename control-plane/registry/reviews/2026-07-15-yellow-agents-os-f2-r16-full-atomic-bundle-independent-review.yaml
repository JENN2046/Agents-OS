findings:
  - finding_id: F2-R16-FULL-IR-M01
    severity: MAJOR
    title: ActionAssuranceBinding action roles lack a closed canonical vocabulary
    affected_sections:
      - R16 Sections 3.1 through 3.4
      - Materialization Sections 15, 18, and 19
    finding: >-
      R16 requires unknown action roles to reject and every directly affected
      assessment to carry a complete exact role set, but
      ActionAssuranceBindingV0_1R16 leaves action_role unconstrained. The schema
      catalogue describes roles only as phrases such as current revision and all
      effective lifecycle actions; it does not define canonical role strings or
      an exact action-kind-to-role mapping for those transition actions. The
      closed vocabulary therefore cannot be implemented, completeness cannot be
      compared byte-for-byte, and independent writers can assign different role
      labels to the same exact action while producing different canonical
      assessment fingerprints.
    impact: >-
      The transitive historical assessment and impact-input-set edge is present,
      but the containing assessment's required action set is not itself fully
      canonical. Unknown-role rejection and deterministic cross-writer
      assessment identity remain under-specified across every R16 replacement
      assessment.
    required_amendment: >-
      Publish a closed ActionAssuranceRole enum and a total exclusive mapping
      from every effective F2 action class and transition kind to one canonical
      role value, including repeated transition actions, then state the exact
      complete-set derivation and retain sorting by role and action ref.

  - finding_id: F2-R16-FULL-IR-M02
    severity: MAJOR
    title: Materialization v4 remains internally inconsistent and alias-dependent
    affected_sections:
      - R16 Section 4
      - Materialization Sections 4.1, 5.1, 14, 19, and 21
    finding: >-
      V4 prints two different schemas under the same
      CompromiseImpactFactV0_1R9Effective name: Section 5.1 omits
      compromised_subject_action_set_ref and its fingerprint, while Section 19
      includes them. Section 19 also types GovernedStateTransitionFact authority
      as superseded TransitionAuthorityBasisV0_1R8 even though R9 replaces that
      basis with TransitionAuthorityBasisV0_1R9 and v4 prints only the R9 schema.
      Section 14 first refers readers back to the R8 transition envelope rather
      than printing the effective schema at that point. The Section 21 index is
      not an object-to-source/domain map for every printed schema and reducer;
      it enumerates only the R16 replacement records and relies on broad section
      prose for the remainder.
    impact: >-
      The required complete derived reading surface gives conflicting known
      objects and an undefined stale authority alias for a governed mutation.
      Implementers cannot determine one effective fingerprint object or exact
      authority schema from v4, so it is unreliable as the mandatory complete
      resolved surface.
    required_amendment: >-
      Regenerate a v5 that prints each effective schema exactly once, uses the
      R9 authority basis in GovernedStateTransitionFact, removes the conflicting
      CompromiseImpact projection, and provides an exact domain and source entry
      for every schema and reducer without superseded or undefined aliases.

prior_findings_disposition:
  F2-R15-FULL-IR-B01:
    result: RESOLVED
    basis: >-
      The CREATE target spec excludes authority, assessment, body, intent,
      action, replay, final Actor fingerprint, Event, and other later objects;
      its exact head-absence watermark equals the CREATE assessment, authority,
      and intent-currentness watermark. Current-head CAS rejects an intervening
      create. CREATE-only and post-create assessments are mutually forbidden,
      Jenn bootstrap and service/host provisioning routes remain separate, and
      no second relation ledger is introduced.
  F2-R15-FULL-IR-M01:
    result: PARTIALLY_RESOLVED_BLOCKED_BY_F2-R16-FULL-IR-M01
    basis: >-
      Every directly affected R16 schema now contains one transitive binding to
      a fingerprinted historical assessment whose exact impact input set and
      equal watermark are bound. Commit-time validity, full authenticated
      identity fields, null non-Actor action fields, deterministic array order,
      unknown-field rejection, total impact effects, no auto-restore, and no
      invalid enabling reactivation remain effective. The canonical role
      vocabulary and exact total mapping are still absent.
  F2-R15-FULL-IR-M02:
    result: NOT_RESOLVED_F2-R16-FULL-IR-M02
    basis: >-
      V4 substantially expands the printed schema catalogue and includes
      RESPONSIBILITY_ASSIGNMENT_REVISION in both mutation lists, but duplicate
      conflicting schemas, a superseded undefined authority alias, and an
      incomplete exact object/source/domain index keep the surface unreliable.

