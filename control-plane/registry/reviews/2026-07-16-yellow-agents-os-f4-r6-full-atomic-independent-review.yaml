      - no_canonical_merge_or_reconstruction_algorithm_turns_the_R1_outer_node_hash_and_the_delta_into_one_complete_effective_object
      - replaced_R1_Host_Jenn_grant_permit_disposition_and_handoff_objects_are_therefore_not_proven_absent_from_the_effective_output
      - contrary_to_R6_section_6_not_every_overlay_node_fingerprint_binds_the_base_R1_fixture_file_and_canonical_digests
    impact: the_witness_cannot_prove_full_effective_constructibility_or_that_all_R5_R6_replacements_are_materialized_without_resurrecting_replaced_R1_objects
    required_correction:
      - materialize_each_complete_effective_schema_with_all_fields_in_normative_order_and_no_replaced_R1_fields
