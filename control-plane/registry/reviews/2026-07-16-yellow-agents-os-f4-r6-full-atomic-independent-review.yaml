findings:
  - id: F4-R6-FULL-ATOMIC-IR-B01
    severity: BLOCKER
    title: effect_authorization_matrix_is_not_a_unique_total_reducer
    evidence:
      - R6_section_2_assigns_distinct_rejected_reasons_to_scope_mismatch_expiry_and_revocation_but_does_not_define_precedence_when_more_than_one_is_true
      - a_present_Jenn_decision_can_be_scope_mismatched_expired_and_revoked_at_the_same_watermark
      - the_scope_mismatch_row_says_decision_identity_fields_non_null_and_time_revocation_as_observed_instead_of_freezing_the_nullability_of_each_Jenn_field
      - the_later_no_object_rule_does_not_resolve_concurrent_proven_negative_reason_selection_after_all_evidence_is_reproducible
    impact: two_conforming_writers_can_emit_different_currentness_reason_and_canonical_fingerprint_for_the_same_exact_mode_and_evidence
    required_correction:
      - freeze_one_negative_over_unavailable_lattice_and_one_exact_rejected_reason_precedence_or_make_the_negative_predicates_normatively_mutually_exclusive
      - enumerate_the_exact_null_or_non_null_requirement_for_every_Jenn_field_in_every_legal_row
      - add_concurrent_scope_mismatch_expired_revoked_vectors_and_reject_every_noncanonical_pair

  - id: F4-R6-FULL-ATOMIC-IR-B02
    severity: BLOCKER
    title: F4_effect_trust_eligibility_result_and_reason_are_not_unique
    evidence:
      - R6_correctly_preserves_frozen_F2_RECOVER_and_defines_a_separate_F4_eligibility_assessment
      - the_schema_has_F2_COMPROMISE_HISTORY_PRESENT_F4_COMPROMISE_HISTORY_PRESENT_unavailable_and_integrity_reasons_but_defines_no_complete_result_mapping_or_reason_precedence
      - F2_and_F4_compromise_history_can_both_be_present
      - a_proven_compromise_history_can_coexist_with_an_unavailable_current_input_or_with_an_integrity_conflict
    impact: the_same_reproducible_history_tuple_can_receive_different_reason_or_even_INELIGIBLE_versus_INDETERMINATE_results_and_therefore_different_assessment_fingerprints
    required_correction:
      - preserve_the_F2_actor_status_exactly_as_F2_derives_it
      - define_a_total_F4_only_lattice_with_exact_check_to_reason_mapping_and_fixed_precedence
      - state_whether_proven_history_and_integrity_dominate_unavailability_and_add_all_concurrent_cases

  - id: F4-R6-FULL-ATOMIC-IR-B03
    severity: BLOCKER
    title: R6_disposition_witness_omits_interface_version_from_the_declared_fingerprint_formula
    evidence:
      - the_R6_schema_has_28_fields_before_fact_fingerprint_including_interface_version_as_the_first_field
      - R6_section_4_defines_the_digest_as_the_domain_separator_plus_every_preceding_field_value_in_printed_order
      - the_R6_fixture_ordered_field_values_contains_only_27_values_and_starts_with_observation_id
      - the_R6_validator_disp_values_repeats_the_same_omission_and_therefore_PASS_only_proves_fixture_validator_agreement
    impact: the_constructive_disposition_fingerprint_does_not_materialize_the_normative_R6_formula_and_the_handoff_binds_that_nonconforming_fingerprint
    required_correction:
      - include_the_literal_interface_version_as_the_first_preceding_field_value_after_the_domain_separator
      - recompute_disposition_handoff_node_and_fixture_fingerprints
      - add_an_independent_field_count_and_exact_order_assertion

  - id: F4-R6-FULL-ATOMIC-IR-B04
    severity: BLOCKER
    title: full_effective_M0_overlay_is_a_delta_summary_not_a_full_effective_materialization
    evidence:
      - TaskPermitV0_1R6Effective_contains_a_base_R1_outer_node_fingerprint_and_a_small_subset_of_replacement_fields_not_the_complete_effective_TaskPermit_field_list
