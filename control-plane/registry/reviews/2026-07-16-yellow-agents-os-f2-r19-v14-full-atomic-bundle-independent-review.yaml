        lines: "2737-2753"
        fact: "V14 retains anonymous Profile/Principal creation-spec arrays."
    finding: >-
      Independent writers cannot reproduce the manifest body or its complete
      synthetic subject set without inventing the missing spec contracts.
    required_fix: >-
      A new narrow acceptance-subject amendment must freeze both schemas,
      domain tags, field order, exclusions, fingerprints, sorting, and fixtures;
      a derived materialization may not invent them.

