findings:
  - finding_id: "F2-R19-V14-TCIR-M01"
    severity: "MAJOR"
    title: "The exhaustive source index remains non-section-exact and omits controlling R19 downstream attribution"
    affected_surfaces:
      - "R17 exact source-map contract"
      - "R19 NOT_YET_ACTIVE downstream schema and reducer materialization"
      - "v14 source-field equivalence claim"
    evidence:
      - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r17-amendment.draft.md"
        lines: "228-247"
        fact: >-
          Every index row must name the authoritative source subject and section;
          broad source-only prose and unresolved aliases fail validation.
      - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r19-v14.draft.md"
        lines: "2852-2941"
        fact: >-
          Rows still use non-section-exact forms including R7, R11-R14,
          R3/R4/R7, R9-R14 overlays, and R2-R4 activation. The effective Binding,
          Assignment, and Delegation assessment rows and their current reducers
          do not cite R19 even though their printed enums/branches consume the
          R19 NOT_YET_ACTIVE overlay.
      - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r19-v14.draft.md"
        lines: "1741-1744"
        fact: >-
          The owning activation-evidence section source header stops at R18 even
          though Section 12.1 prints the R19 revalidation schema and reducer.
      - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r19-v14.draft.md"
        lines: "2283-2306,2343-2347,2927-2929"
        fact: >-
          NOT_YET_ACTIVE is materially present in downstream schemas and reducers,
          but the corresponding index source rows lack R19 Section 2.
    finding: >-
      V14 achieves structural row-set equality but does not achieve the source-
      exact equality required by R17 and R19. A reader cannot reconstruct every
      effective row from the index without interpreting revision ranges or
      discovering an unlisted R19 overlay.
    impact: >-
      The derived surface overstates source-map closure and can cause an
      implementer or future reviewer to miss a controlling R19 branch. This does
      not create runtime authority, but it prevents v14 from serving as the
      complete source-exact implementation reading surface required for the next
      full atomic-bundle review.
    suggested_fix: >-
      Replace every revision-only, range, slash, and generic overlay source entry
      in both schema and reducer indexes with the exact controlling subject and
      section list. Add R19 Section 2 to every downstream assessment/reducer row
      that materializes NOT_YET_ACTIVE, add R19 Section 3 to the Section 12 source
      header, and rerun both row-set equality and row-by-row source-predicate/
      formula validation.

