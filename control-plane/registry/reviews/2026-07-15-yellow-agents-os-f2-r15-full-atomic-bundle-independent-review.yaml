findings:
  - finding_id: F2-R15-FULL-IR-B01
    severity: BLOCKER
    title: Steward-derived Actor CREATE is circular after the relation-to-assessment replacement
    affected_sections:
      - R8 Sections 2.4, 7.1, and 7.2
      - R15 Sections 4 and 5.3
      - Materialization Sections 2, 3.4, 4.1, and 9
    finding: >-
      R15 replaces the Actor transition authority basis stewardship relation
      ref/fingerprint with an IdentityStewardshipAssessment ref/fingerprint.
      That assessment requires target_actor_identity_ref,
      target_actor_identity_fingerprint, target_actor_identity_assessment_ref,
      one watermark, and an exact current target Actor revision. The Actor CREATE
      path still permits and, for Resident Coordinator, Domain Agent, and
      Temporary Worker steward routes, requires IDENTITY_STEWARD_ACTION. R8's
      body-to-intent-to-action-to-final-subject order requires the authority
      basis to be fixed before the new Actor revision is committed. Therefore a
      stewardship assessment for the target CREATE cannot exist without the
      target current Actor revision, while that revision cannot be committed
      without the assessment. No pre-create target specification or explicit
      CREATE exception breaks the cycle.
    impact: >-
      Ordinary steward-authorized Actor creation is not constructible under the
      effective contract. The derived relation closes the second-ledger defect
      for existing targets but opens a precommit circularity at a core identity
      lifecycle path.
    required_amendment: >-
      Define a closed acyclic CREATE-time stewardship assessment over an exact
      precommit Actor body/spec and intended target identity, or explicitly
      restrict Actor CREATE to a non-circular Jenn/provisioning basis. Preserve
      the existing current-target assessment for post-create transitions.

  - finding_id: F2-R15-FULL-IR-M01
    severity: MAJOR
    title: CompromiseImpact reducer inputs are required but not represented by every affected assessment schema
    affected_sections:
      - R15 Sections 2.1-2.4, 3.4, and 5.3
      - Materialization Sections 5, 6, 8, 9, 10, 11, 12, and 15
    finding: >-
      R15 requires every affected assessment to bind both the exact
      HistoricalActionValidityAssessment ref/fingerprint and the exact
      HistoricalImpactInputSet ref/fingerprint at a coverage watermark equal to
      the effective assessment watermark. The replacement Actor identity schema
      has none of those fields. Assignment and Delegation assessments name
      historical validity refs but do not directly carry the required
      historical assessment fingerprint, impact-input-set ref/fingerprint, or
      coverage watermark. Profile, Principal, Binding, activation, and manifest
      assessment schemas are not amended with the required direct bindings
      either. The common known-object fingerprint rule rejects unknown fields,
      so the missing bindings cannot be added informally to canonical objects.
    impact: >-
      The total CHALLENGED/INVALIDATED effect table does not produce a fully
      canonical, watermark-bound affected assessment across all advertised
      target classes. Implementations can either omit required reducer inputs or
      introduce non-schema fields and divergent fingerprints.
    required_amendment: >-
      Publish complete replacement schemas for every affected assessment with
      exact direct assurance/input-set fields and equal-watermark rules, or
      revise Section 5.3 to a single explicit transitive binding through a
      fingerprinted HistoricalActionValidityAssessment and make that rule exact
      for each reducer.

  - finding_id: F2-R15-FULL-IR-M02
    severity: MAJOR
    title: Materialization v3 is not the complete effective reading surface required by R15
    affected_sections:
      - R15 Section 6
      - Materialization Sections 2 through 16
    finding: >-
      R15 requires v3 to print the complete effective schema, domain/fingerprint
      rule, authority predicate, currentness reducer, and source subject for each
      listed F2 surface. V3 names but does not print complete schemas for
      AuthenticatorProfileAssessmentR7,
      CredentialHandleStatusAssessmentRefV0_1, PrincipalAssessmentR7,
      ActorPrincipalBindingAssessmentR7, HistoricalImpactInputSetV0_1,
      SyntheticM0ManifestAssessmentV0_1, SyntheticM0ControllerSpecV0_1,
      SyntheticM0PrincipalProvisioningManifest, GovernedStateTransitionFact,
      or the R15-effective Actor transition authority basis. Several appear only
      as prose or a domain-table row, and several do not appear by name at all.
      In addition, Section 2's advertised effective mutation-kind list omits
      RESPONSIBILITY_ASSIGNMENT_REVISION even though Section 14 correctly
      includes it.
    impact: >-
      The derived-only surface cannot serve as the exact complete implementation
      reading surface mandated by R15, and its two mutation-kind presentations
      conflict. This does not change subject authority, but it blocks the
      required complete review surface.
    required_amendment: >-
      Regenerate a v4 derived materialization from the corrected atomic subjects,
      printing every required complete schema, fingerprint/domain rule,
      authority predicate, reducer, and source map exactly once without
      contradictory summary lists.

