findings:
  - finding_id: F2-R2-IR-B01
    severity: BLOCKER
    title: Delegation activation depends on the responsibility it is meant to activate
    subject_locations:
      - subject: R2
        section: "2 Common external action-attribution interface"
        lines: "78-92"
      - subject: R2
        section: "6 Delegation activation evidence"
        lines: "339-368"
      - subject: R1
        section: "12 Delegation current-state reducer"
        lines: "713-742"
    finding: >-
      DelegationActivationEvidence requires an acknowledging_action_ref backed by an F3
      COMMITTED intake. AuthenticatedActorActionRef always carries responsibility_source_ref,
      and F3 must bind current responsibility or delegation before emitting it. The grant is
      not ACTIVE until that same acknowledgement exists. A delegate with no independent active
      assignment or delegation therefore cannot produce the acknowledgement needed to activate
      its first delegation. The contract does not define a non-circular activation-purpose
      intake path, so activation is not total for the stated Jenn-to-Nobao-to-Agent-to-Worker
      path.
    impact: >-
      Implementations must either reject a valid first delegation forever or silently treat the
      not-yet-active grant as current responsibility. The latter is self-activation and can make
      responsibility attribution self-proving.
    required_amendment: >-
      Define one explicit non-circular acknowledgement contract. It may be a narrowly typed
      authenticated Principal-control action that binds the exact grant fingerprint without
      claiming the pending delegation as responsibility, or an F3 activation-intake state with
      exact identity, active binding, prohibited-boundary, replay, and atomic transition rules.
      It must reject PENDING, REJECTED, OUTCOME_INDETERMINATE, stale grants, and any use of the
      pending grant as its own responsibility source. Add a first-responsibility delegation test.

  - finding_id: F2-R2-IR-B02
    severity: BLOCKER
    title: Binding activation fingerprint dependency and evidence identity are not acyclic and exact
    subject_locations:
      - subject: R2
        section: "5 Binding activation evidence"
        lines: "244-250, 269-324"
      - subject: R2
        section: "9 Fingerprint and recovery additions"
        lines: "510-520"
    finding: >-
      The target binding is supplemented with activation_evidence_ref, while its activation
      evidence targets target_binding_fingerprint. Section 9 additionally says F2 fingerprints
      cover the binding activation evidence head and target fingerprint. It does not define a
      base binding fingerprint that excludes the evidence head, nor an ordering rule separating
      immutable target bytes from post-activation assessment bytes. The stable evidence_id is
      only described as derived per target binding without an exact derivation. This leaves a
      circular or implementation-dependent canonical fingerprint graph.
    impact: >-
      Independent writers cannot deterministically compute the target binding fingerprint and
      evidence fingerprint in one order, reproduce evidence IDs, or prove startup currentness.
      A verifier may accept evidence against different target bytes than the writer intended.
    required_amendment: >-
      Define an exact acyclic graph: for example, a binding_subject_fingerprint over immutable
      binding fields that excludes activation_evidence_ref/head; activation evidence targets
      that subject fingerprint; a separate current binding assessment fingerprint then includes
      the exact activation evidence revision and fingerprint. Specify the evidence_id derivation,
      domain separation, canonical field list, revision behavior, and negative fixed-point/stale-
      head tests.

  - finding_id: F2-R2-IR-B03
    severity: BLOCKER
    title: Assignment self-issuance and Jenn-root delegation issuance are not canonically closed
    subject_locations:
      - subject: R2
        section: "3 Responsibility assignment provenance and lineage"
        lines: "98-157"
      - subject: R2
        section: "4 Delegation attenuation corrections"
        lines: "200-240"
      - subject: R1
        section: "11.1 DelegationGrantRevision"
        lines: "585-612"
      - subject: R2
        section: "10 Required negative tests"
        lines: "540-546"
    finding: >-
      R2 lists self-issued assignment rejection as a required test but never states the
      corresponding invariant actor_id != issued_by_actor_id or an exact bootstrap exception.
      Separately, the Jenn-root first delegation requires an exact authenticated Jenn action in
      prose, but neither the R1 DelegationGrantRevision nor an R2 schema addition stores the
      issuance action ref or its currentness basis. The root path therefore cannot be
      reconstructed from the declared canonical grant fields.
    impact: >-
      A conforming implementation can disagree on self-issued assignments, and a forged or stale
      Jenn-root first-edge grant can appear structurally identical to a properly issued grant.
      Because current responsibility scopes ordinary autonomy, this is a blocking provenance gap.
    required_amendment: >-
      Add the exact self-issuance prohibition and any narrowly defined Jenn bootstrap exception
      to the normative issuance reducer. Supplement DelegationGrantRevision with the authenticated
      issuance_action_ref, issuer identity/binding revision, root-direction ref/fingerprint, and
      issuer-currentness Event sequence; include them in the grant fingerprint and reducer. Add
      forged, stale, missing-action, wrong-actor, and self-issued assignment negative tests.

prior_finding_disposition:
  - finding_id: F2-IR-B01
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Assignment source, parent CAS, exact kind/scope/time/depth attenuation, and per-edge
      may_redelegate rules are materially improved. F2-R2-IR-B03 leaves the self-issued
      assignment invariant and Jenn-root first-delegation authenticated action outside the
      canonical reducer.
  - finding_id: F2-IR-B02
    disposition: PARTIALLY_RESOLVED_BLOCKING
    rationale: >-
      Typed evidence, Principal control assessment, target binding, replay, revision, revocation,
      supersession, and currentness fields now exist. F2-R2-IR-B01 and F2-R2-IR-B02 show that the
      activation dependency graph and fingerprint graph are not closed.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_EXPLICIT_OWNERSHIP_REPLACEMENT
    rationale: >-
      R2 Sections 2 and 8 precisely replace the incomplete R1 Command-owned clauses, assign
      payload schema/canonicalization/nonce/replay/CAS/intake/crash state to F3, retain only an
      immutable cross-contract attribution ref in F2, and prohibit runtime intake until F3 closes.
      This is a scoped ownership replacement under the R2 start decision, not unconditional
      runtime acceptance of the missing protocol.
  - finding_id: F2-IR-M01
    disposition: RESOLVED
    rationale: >-
      The closed stewardship relation, authenticated steward action, exact compromised and
      recovering revisions, complete current affected-binding set, exact dispositions, no-omitted-
      binding check, and one Rust transaction close the original auditability and self-recovery gap.

self_review_corrections_readjudication:
  - correction_id: F2-R2-SR-01
    disposition: NOT_CONFIRMED_BLOCKING
    rationale: >-
      Jenn root first-edge semantics exist in prose, but the grant schema has no authenticated
      issuance action field; F2-R2-IR-B03 applies.
  - correction_id: F2-R2-SR-02
    disposition: CONFIRMED_WITH_REMAINING_BLOCKER
    rationale: >-
      PrincipalControlProofAssessmentRef is typed and VERIFIED-only. It does not resolve the
      activation and fingerprint dependency defects in F2-R2-IR-B01/B02.
  - correction_id: F2-R2-SR-03
    disposition: CONFIRMED
    rationale: >-
      complete_affected_binding_refs and binding_dispositions have exact ordering, uniqueness,
      and set-equality rules.
  - correction_id: F2-R2-SR-04
    disposition: CONFIRMED
    rationale: >-
      AuthenticatedCommandContext and the incomplete Command protocol are explicitly replaced by
      the F3-owned boundary. AuthenticatedActorActionRef rejects non-COMMITTED states and cannot be
      caller-created, subject to resolving F2-R2-IR-B01's activation bootstrap cycle.

