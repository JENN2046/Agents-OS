mandatory_count_basis:
  identity_spoofing: >-
    Permit authority binds exact F1 Task, F2 Actor/Principal/responsibility,
    F3 Resident/Command, and Host identity/authentication fingerprints; model,
    prompt, process, IPC, UI, session, hostname, and network location cannot
    substitute.
  authority_expansion: >-
    Capability, resource, effect, payload, human-presence, secret-handle, Jenn
    authorization, epoch, time, and fence scopes are immutable intersections;
    downstream facts cannot amend them.
  host_authentication_bypass: >-
    An exact ACTIVE owner Host, current challenge-bound authentication epoch,
    revocation head, profile, time, and final host recheck are required. Both
    REJECTED and INDETERMINATE remain non-admitting despite B01.
  revocation_or_compromise_bypass: >-
    Host compromise is terminal, advances the Host fence, invalidates prior
    authentication, and requires a new identity lineage; incomplete affected-
    set propagation closes the containing admission domain.
  fail_open_currentness: >-
    B01 is a deterministic classification ambiguity, not a fail-open path:
    both candidate results are non-VALID and non-ADMITTED.
  dual_writer: >-
    Advisory JavaScript decisions confer no authority; only the frozen F3
    singleton Resident Rust writer may commit issuance, acceptance, and the
    atomic disposition/handoff facts.
  circular_proof: >-
    F4 consumes an independently accepted owner-contract Command definition;
    the synthetic definition is fixture-only, and no subject or definition
    depends on its own digest or review result.
  crash_or_replay_ambiguity: >-
    Issuance, acceptance, observation, and handoff identities are unique;
    lost replies require lookup and fingerprint comparison, and unknown
    external outcomes do not authorize blind retry.
  downstream_boundary_leak: >-
    The contract exports only an immutable accepted handoff and reserves
    dispatch, delivery, reconciliation, retry, and outcomes to F5 without
    authorizing implementation or execution.
  M0_impossibility: >-
    The offline fixture materializes a 14-node acyclic witness with one
    acceptance, one handoff, positive synthetic NOT_EXECUTED evidence, and no
    real resource, provider, secret, runtime, service, or effect.
  internal_contradiction: >-
    Sections 5.2, 7.2, 9.2, I19, and I20 assign mutually exclusive results to
    constructible mixed negative/unavailable evidence and do not define a
    unique reason selection rule.

findings:
  - id: F4-R1-FULL-ATOMIC-IR-B01
    severity: BLOCKER
    title: Mixed negative and unavailable evidence has no unique canonical result or reason
    exact_sections:
      - Section_5.2_HostAuthenticationAssessmentV0_1_lines_314_319
      - Section_7.2_TaskPermitCurrentnessAssessmentV0_1_lines_622_627
      - Section_9.2_HostLocalAdmissionDecisionV0_1_lines_749_753
      - Section_17.3_I19_I20_lines_1327_1328
    evidence: >-
      A constructible TaskPermitCurrentnessAssessment can contain, for example,
      task_binding_current=REJECTED and policy_current=INDETERMINATE at the same
      watermark. Section 7.2 then requires REJECTED because a proven negative
      exists and also requires INDETERMINATE because an input is unavailable.
      I19 and I20 repeat those mutually exclusive unconditional requirements.
      In addition, I19 labels known stale currentness INDETERMINATE while I20
      labels the same proven stale negative REJECTED; Section 9.2 repeats that
      direct single-fault conflict by assigning stale evidence to
      INDETERMINATE despite the closed STALE_FENCE and STALE_EPOCH rejection
      reasons and adversarial decision 23. The same mixed-state ambiguity also
      exists for Host authentication and local admission. Even after choosing
      a result, the contract supplies no exact
      precedence for selecting one reason when multiple checks fail, and the
      currentness reason enum has no explicit reason for several checks such as
      capability, resource, secret-handle, attestation, or human-presence
      rejection. Because result and reason enter the canonical fingerprint,
      conforming evaluators can produce different immutable bytes from the same
      evidence.
    security_effect: >-
      Both currently possible classifications fail closed, so this is not an
      admission bypass. It is nevertheless a blocking determinism and internal
      consistency defect in an authority-bearing canonical contract.
    minimum_R2_correction:
      - >-
        Replace the three conflicting prose rules with one total result lattice:
        any applicable REJECTED check dominates every concurrent INDETERMINATE
        check; otherwise any INDETERMINATE check yields INDETERMINATE; only all
        applicable PASS or NOT_APPLICABLE values yield the success result.
      - >-
        Add an exact ordered check-to-reason mapping for Host authentication,
        permit currentness, and local admission so every accepted field tuple
        has exactly one result and one reason; add missing closed reason values
        or explicitly map every check to an existing reason.
      - >-
        Replace I19 and I20 so I19 applies only when no proven negative exists
        and I20 explicitly states that proven negative dominates concurrent
        unavailable evidence.
      - >-
        Add mixed-state adversarial fixtures covering REJECTED plus
        INDETERMINATE and multiple simultaneous REJECTED checks. The existing
        successful M0-A witness may remain unchanged if its hashes still bind
        the exact reviewed bytes.
    requires_R2: true

