finding_details:
  - finding_id: PHASE5A-M0A-PLAN-R4-IR-B01
    severity: blocker
    title: F3_Event_witness_and_incarnation_transaction_bindings_remain_non_executable
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-persistence-transaction-corrections-v0.1-r4.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-semantic-owner-corrections-v0.1-r4.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-plan-v0.1-r4-amendment.draft.md
      - control-plane/registry/drafts/2026-07-16-agents-os-f3-resident-singleton-napi-identity-continuity-v0.1-r3-amendment.draft.md
    evidence:
      - >-
        R4 added exact epoch predecessor and incarnation foreign keys, and the
        independent negative cases confirm gap, fork, same revision, wrong
        immediate incarnation and missing Event rejection.
      - >-
        The epoch and incarnation rows nevertheless reference Event only by
        event_sequence. R4 freezes no exact Event kind, aggregate, ID,
        fingerprint or canonical-byte equality for the named ownership Event.
        Coordinated variants X01 and X02 commit an unrelated Event while all
        incarnation, epoch, RECOVERING fact and current pointer rows are present.
      - >-
        The READY transaction uses the label
        recheck_exact_witness_COMMIT_epoch_incarnation_and_Event, but freezes no
        persisted witness observation relation or exact lookup/equality
        predicate. X03 commits READY after RECOVERING without any witness COMMIT
        object represented or referenced by the 18-table graph.
      - >-
        The DDL excludes only reuse of the immediately previous incarnation.
        X04 commits epoch 3 with the old epoch-1 incarnation after epoch 2 used
        another incarnation. The step name insert_new_resident_incarnation is
        not accompanied by an exact uniqueness/precondition definition that
        makes this coordinated variant total.
    counterexample: >-
      Two implementations can follow the ordered step labels while differing
      on what qualifies as the ownership Event, how a witness COMMIT is
      reobserved, and whether any historical incarnation may be reused. One can
      accept X01-X04 and another can reject them; the fixed plan does not select
      one executable behavior.
    impact: >-
      The claimed all-or-zero F3 transaction and READY witness barrier cannot be
      reproduced from the exact persistence and transaction profile. A
      favorable lifecycle projection can be assembled from individually valid
      but semantically substituted rows.
    required_correction:
      - Freeze the exact ownership Event identity and equality bindings used by incarnation, epoch, lifecycle fact and pointer.
      - Freeze an executable witness-COMMIT observation relation and equality predicate for READY.
      - Reject reuse of every historical incarnation, not only the immediate predecessor, or freeze an equivalent total transaction precondition.
      - Add X01-X04 as fixed coordinated negative regressions.

  - finding_id: PHASE5A-M0A-PLAN-R4-IR-B02
    severity: blocker
    title: F5_stored_first_Event_and_call_authorization_provenance_is_not_exact
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-persistence-transaction-corrections-v0.1-r4.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-semantic-owner-corrections-v0.1-r4.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-plan-v0.1-r4-amendment.draft.md
    evidence:
      - >-
        R4 correctly requires committed_event_count=1 and
        committed_call_authorization_count=1, and the independent cases reject
        both zero and multiple counts.
      - >-
        dispatch_arm.first_event_ref/fingerprint may name any valid Event and is
        not required to equal armed_event_sequence or an exact first-arm Event
        tuple. X05 commits an unrelated Event as the stored first Event.
      - >-
        first_call_authorization_ref/revision/fingerprint references a unique
        canonical_fact tuple but stores and constrains neither fact_kind nor
        logical_id. X06 commits an UNRELATED_FACT for another logical identity
        as the stored first call authorization.
      - >-
        The transaction profile states exact replay additions are zero but has
        only ordered-step labels; no fixed coordinated regression checks that
        replay returns the exact stored Event/call identities while adding zero.
    counterexample: >-
      A first apply can store counts of one while the stored reference tuples
      identify unrelated valid rows. Exact replay can then faithfully return
      those substituted tuples and still satisfy the count checks.
    impact: >-
      R4 closes numeric accounting but not the identity/provenance part of the
      declared arm tuple. The stored-first result remains favorable while not
      identifying the Event and call authorization created for that apply.
    required_correction:
      - Bind first_event_ref/fingerprint to the exact arm Event and armed_event_sequence.
      - Bind call authorization to its exact kind and logical identity as well as ref/revision/fingerprint.
      - Add coordinated first-apply and exact-replay cases that prove stored identities and zero additions together.

  - finding_id: PHASE5A-M0A-PLAN-R4-IR-B03
    severity: blocker
    title: The_future_index_js_AST_and_dataflow_proof_is_policy_only_and_not_executable
    affected_subjects:
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-materialization-abi-corrections-v0.1-r4.yaml
      - control-plane/registry/drafts/2026-07-19-agents-os-phase-5a-m0a-plan-v0.1-r4-amendment.draft.md
      - control-plane/registry/validate-phase5a-m0a-plan-r4-closure.py
    confirmed_closed_portion:
      fixed_Plugin_js_hash_bound: true
      actual_manager_call: serviceModule.processToolCall(pluginSpecificArgs, directContext)
      actual_manager_positional_value_count: 2
      blocked_manifest_requiresAdmin_effective_value: false
    evidence:
      - >-
        R4 correctly declares text search insufficient and unknown or
        unprovable as BLOCK. It also lists forbidden sources and sinks.
      - >-
        The static probe is only named future_index_js_AST_and_dataflow_validator.
        No parser/version, exact args whitelist fields, lexical binding and
        alias rules, destructuring/computed-property rules, interprocedural
        call/closure rules, exact sink matchers or proof algorithm is fixed.
      - >-
        The negative cases are labels without fixed JavaScript source fixtures
        and expected validator outputs. No validator command consumes a future
        index.js; the fixed R4 validator only checks policy strings and the
        fixed Plugin.js text.
      - >-
        Consequently no reproducible result proves that arguments[1], aliases,
        requestIp, sourceNode, signal, decryptedAuthCode or another context path
        cannot reach N-API arguments, reducers, fingerprints, logs, receipts,
        errors or returned output.
    counterexample: >-
      Multiple future validators can satisfy the owner label while disagreeing
      on aliases, closures, object spreads, computed properties and helper
      calls. A shallow validator and a sounder validator therefore produce
      different results for the same index.js while both conform to the fixed
      R4 text.
    impact: >-
      The real two-value manager invocation is now accurately modeled and hash
      bound, but the nonauthority directContext separation cannot be verified
      at implementation review from this plan. The package's own
      unknown_or_unprovable rule therefore requires BLOCK.
    required_correction:
      - Freeze an executable AST/dataflow validator contract and command.
      - Freeze the exact args whitelist and all source-to-sink propagation rules.
      - Bind positive and negative JavaScript fixtures covering aliases, closures, spreads, computed properties and helper calls.
      - Require the validator to consume exact future index.js bytes and fail closed on unsupported syntax or unknown flow.

