findings:
  blocker: 5
  major: 0
  minor: 0
  items:
    - id: F4-R5-FULL-ATOMIC-IR-B01
      severity: BLOCKER
      title: Effect authorization replacement is not a canonical total function end to end
      evidence:
        - R5 says policy/PBL/basis unavailability is INDETERMINATE, but mode has only NO_SEPARATE_JENN_AUTHORIZATION_REQUIRED, EXACT_CURRENT_JENN_AUTHORIZATION_REQUIRED, and PROHIBITED_NON_ISSUABLE.
        - When the policy-derived mode itself cannot be reproduced, the contract defines neither a no-object transport result nor one canonical mode/currentness/nullability tuple.
        - PROHIBITED_NON_ISSUABLE does not freeze its sole legal currentness_result, so the same prohibited evidence can be fingerprinted with more than one schema-valid currentness value.
        - R1 F4AcceptedEffectHandoffV0_1 still requires Jenn_authorization_binding_fingerprint; R5 replaces the permit binding but does not explicitly replace this downstream handoff field with effect_authorization_requirement_fingerprint.
      impact: Cross-writer fingerprint divergence or an unconstructible handoff is possible even though every path is intended to fail closed.
      required_R6_correction:
        - define one canonical no-object outcome or one closed representation for policy/PBL/basis-unavailable mode derivation
        - freeze the exact mode/currentness/Jenn-nullability tuple for every evidence class, including PROHIBITED_NON_ISSUABLE
        - replace every downstream old Jenn binding field and expiry/currentness reference, including the accepted handoff field

    - id: F4-R5-FULL-ATOMIC-IR-B02
      severity: BLOCKER
      title: F4 wording contradicts frozen F2 Actor compromise recovery semantics
      evidence:
        - Frozen F2 R7/R8 defines COMPROMISED -> RECOVER -> ACTIVE, and later R15-R19 preserves and assures RECOVER.
        - R5 says F2 compromise is terminal for that Actor lineage and requires a new F2 EXECUTION_HOST Actor identity.
        - R5 does not limit that statement to an F4-specific effect-trust eligibility rule, while R1 otherwise forbids reinterpretation of frozen F2 bytes.
      impact: One recovered EXECUTION_HOST Actor can be ACTIVE under frozen F2 and simultaneously terminal under F4, so Host currentness is not uniquely decidable.
      required_R6_correction:
        - preserve frozen F2 RECOVER semantics explicitly
        - if same-lineage recovery must remain ineligible for F4, define that as a separate F4 Host-trust eligibility predicate based on compromise history, without relabeling the F2 Actor lifecycle

    - id: F4-R5-FULL-ATOMIC-IR-B03
      severity: BLOCKER
      title: FinalHandoffAuthorityAssessment has no exact integration position in the disposition fact
      evidence:
        - R5 says it adds FinalHandoffAuthorityAssessmentV0_1R5 as an input to HostWorkStartDispositionFactV0_1 but does not state the containing field name, whether the value or a ref/fingerprint pair is stored, or its exact field position.
        - R1 fingerprinting is field-order-sensitive, and R3/R4 explicitly preserved the prior disposition field order.
      impact: Two conforming writers can recheck the same authority yet serialize different disposition bytes and fingerprints; the handoff cannot prove one uniquely bound final assessment.
      required_R6_correction:
        - publish the complete effective HostWorkStartDispositionFact schema with the exact new field name, representation, order, and fingerprint coverage
        - bind the accepted handoff explicitly or transitively to that exact assessment fingerprint

    - id: F4-R5-FULL-ATOMIC-IR-B04
      severity: BLOCKER
      title: New grant source-set fingerprints have no canonical derivation
      evidence:
        - CapabilityGrantV0_1R5 adds source_authority_set_fingerprint and ResourceGrantV0_1R5 adds source_scope_set_fingerprint.
        - R5 provides no domain separator or JCS input formula for either set fingerprint.
        - R1 Section 3's general formula applies only to canonical_fingerprint, assessment_fingerprint, decision_fingerprint, and fact_fingerprint; its three named set formulas do not cover the two R5 fields.
      impact: Capability/resource authority source closure can diverge across writers and the derived subset/containment proof is not hash-bound to one canonical source-set digest.
      required_R6_correction:
        - define exact domain-separated SHA-256/JCS formulas for both R5 set fingerprints
        - freeze required source-role coverage and duplicate/order rules used by those formulas

    - id: F4-R5-FULL-ATOMIC-IR-B05
      severity: BLOCKER
      title: The full M0-A witness no longer materializes the effective R5 schemas
      evidence:
        - The immutable R1 witness constructs HostIdentityRevisionV0_1, JennAuthorizationBindingV0_1, CapabilityGrantV0_1, and ResourceGrantV0_1.
        - R5 replaces all four with R5 schemas and also adds final handoff authority evidence.
        - The R5 focused validator tests 28 reduced vectors but does not construct the complete effective R5 permit, Host trust, disposition, and handoff DAG.
      impact: All validators PASS, but the effective R5 atomic bundle lacks the machine-checkable complete constructive M0-A witness still required by the unreplaced R1 gate.
      required_R6_correction:
        - add a zero-effect full effective R5 M0-A fixture and deterministic validator covering every replaced schema and the final handoff binding
        - retain the existing five validators as immutable historical and focused evidence only

