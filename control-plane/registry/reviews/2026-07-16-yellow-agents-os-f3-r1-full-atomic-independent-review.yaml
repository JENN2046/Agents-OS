findings:
  - id: F3-R1-FULL-ATOMIC-IR-M01
    severity: MAJOR
    title: REJECTED Command replay semantics regress the accepted Resident Architecture
    section: F3 R1 Sections 2, 13.1, and 13.4; accepted Resident Operating Architecture Section 14
    evidence: >-
      R1 ranks the accepted architecture above itself. R1 Section 13.4 says a
      no-entry submission either commits one entry or rolls back with no entry,
      and Section 13.1 says a failed gate rolls back the whole mutation. The
      accepted architecture Section 14 instead requires a rejected Command
      result to be persisted and requires a new command_id after conditions
      change.
    counterexample: >-
      Command X is rejected because a current responsibility gate is inactive.
      R1 stores no replay entry. The gate later becomes active and the caller
      resubmits byte-identical X; R1 can COMMIT X, whereas the higher-precedence
      architecture requires replay of the first rejection and a new command_id.
    impact: >-
      One command identity can change disposition after a gate change, and the
      fixed intake contract no longer provides the accepted deterministic
      rejection replay boundary.
    required_correction: >-
      In R2, define an immutable REJECTED intake/replay entry that creates no
      envelope, action ref, Event, or domain mutation; identical replay returns
      the first low-disclosure rejection; a changed fingerprint conflicts; and
      retry after a condition change requires a new command_id. Reconcile this
      with the exact source/global command-id specialization explicitly.

  - id: F3-R1-FULL-ATOMIC-IR-M02
    severity: MAJOR
    title: Ordinary Command admission names a non-existent frozen F2 authentication result
    section: F3 R1 Section 12, especially the ordinary Command gate; frozen F2 R15 Section 2.4
    evidence: >-
      R1 requires authentication assessment VERIFIED. Frozen F2
      AuthenticationAssessmentV0_1R15 has the closed result enum AUTHENTICATED,
      REJECTED, or INDETERMINATE. VERIFIED belongs to a different principal-
      control proof interface and is not a valid AuthenticationAssessment value.
    counterexample: >-
      A fully valid F2 assessment returns AUTHENTICATED and fails the literal R1
      gate. Returning VERIFIED to satisfy R1 is an unknown frozen F2 enum value
      and must reject.
    impact: >-
      No ordinary Command can simultaneously satisfy the literal R1 gate and the
      frozen F2 interface, so the F2-to-F3 admission seam is not constructible.
    required_correction: >-
      Replace the ordinary authentication gate value with exact
      AuthenticationAssessmentV0_1R15.assessment = AUTHENTICATED and audit every
      F3 reference so VERIFIED remains limited to its frozen proof-assessment
      interface.

  - id: F3-R1-FULL-ATOMIC-IR-M03
    severity: MAJOR
    title: Resident identity-continuity reducer is not total over the frozen Actor assessment enum
    section: F3 R1 Section 15; frozen F2 R19 Section 2.1
    evidence: >-
      Frozen F2 exposes NOT_YET_ACTIVE, ACTIVE, SUSPENDED, COMPROMISED, RETIRED,
      EXPIRED, SUPERSEDED, and INDETERMINATE. R1 Section 15 explicitly handles
      only COMPROMISED, RETIRED, and INDETERMINATE in its Actor-status branch,
      then uses an undefined all-exact-facts-current predicate for CONTINUOUS.
      It supplies no explicit result for a SUPERSEDED referenced Actor revision
      and does not define how the Jenn-decision exception changes each branch.
    counterexample: >-
      The Resident CONTINUE chain and epoch are valid, but the exact referenced
      coordinator Actor revision assesses SUPERSEDED. It is not one of the
      listed INDETERMINATE statuses, while the all-current condition cannot hold;
      no result or reason code is defined.
    impact: >-
      Two conforming reducers can choose different continuity/readiness results
      for a frozen F2 state, so the required total fail-closed reducer is absent.
    required_correction: >-
      Give R2 a precedence-ordered result for every frozen F2 Actor assessment
      value, define whether and how an exact Jenn continuity decision affects
      each value, define the complete reason-code set, and add an explicit final
      fail-closed fallback.

  - id: F3-R1-FULL-ATOMIC-IR-M04
    severity: MAJOR
    title: Monotonic authority-epoch rollback rejection has no constructible currentness anchor
    section: F3 R1 Sections 7.2, 16.1-16.2, and 19; accepted Resident Architecture Sections 16 and 23
    evidence: >-
      R1 requires rollback to produce INDETERMINATE and tests epoch rollback,
      while the accepted architecture supports backup/restore validation. The
      only persistent epoch evidence R1 defines is inside the same canonical
      ledger being restored; the OS lock is process-lifetime and carries no
      durable high-watermark. No accepted restore generation, external monotonic
      anchor, or Jenn restore decision is bound into startup.
    counterexample: >-
      After epoch N+1 commits, restore a valid backup ending at N. A new process
      acquires the now-free lock, verifies the internally consistent older graph,
      and commits N+1 for a different incarnation. Every R1 local check passes,
      although the authority lineage rolled back and reused an epoch number.
    impact: >-
      The fixed bytes cannot meet their own stale/rolled-back-epoch adversarial
      check or guarantee monotonic writer generations across a coherent restore.
    required_correction: >-
      Define an exact restore/anti-rollback authority protocol for R2: bind
      startup to a durable monotonic witness or an explicit accepted Jenn restore
      decision and new generation, specify atomicity and recovery with the one
      writer, and fail closed on a stale witness. This finding does not require
      protection against arbitrary same-OS-user tampering; an authorized older
      backup restore is sufficient to reproduce it.

  - id: F3-R1-FULL-ATOMIC-IR-M05
    severity: MAJOR
    title: The canonical intake and replay record referenced by the envelope has no normative schema
    section: F3 R1 Sections 13.1-13.4 and invariants F3-I06-F3-I09
    evidence: >-
      CommandEnvelopeV0_1 fingerprints F3_intake_state_ref, and the prose says it
      points to an immutable COMMITTED intake record containing the command,
      envelope, fingerprint, epoch, and Event sequence. R1 defines no versioned
      intake-record schema, fingerprint domain, ref construction, result binding,
      or replay-entry schema, despite requiring unknown-field rejection and
      recovery verification of the complete graph.
    counterexample: >-
      One implementation content-addresses the intake record, creating a cycle
      because the record contains the envelope fingerprint and the envelope
      contains the intake ref. Another assigns an opaque ref before both records
      and is acyclic. The fixed contract cannot choose between them or prove
      byte-identical recovery.
    impact: >-
      The envelope/replay graph is not one constructible canonical schema, and
      recovery cannot deterministically distinguish a complete entry from a
      partial or implementation-specific one.
    required_correction: >-
      Define closed versioned intake and replay-entry schemas, their exact
      fingerprints and independent ref rules, disposition/result bindings,
      command/envelope/Event/action relationships, and recovery validation.
      Include the corrected persisted-REJECTED semantics from M01 without
      creating an envelope or action ref for a rejection.

  - id: F3-R1-FULL-ATOMIC-IR-M06
    severity: MAJOR
    title: The stated synthetic M0 activation witness has no constructible pending-Delegation genesis
    section: F3 R1 Sections 10, 14, and 20; frozen F2 R8 Section 6 and R22 Sections 1-2
    evidence: >-
      R1 Section 20 starts from the accepted F2 synthetic M0 manifest only,
      lists one closed DELEGATION_ACTIVATION_ACK definition, and then requires a
      synthetic pending Delegation to activate. Frozen F2 R8's manifest can
      materialize only Profile, Principal, and Binding specs, and R22's narrow
      exception applies only to those three roots. Frozen Delegation issuance
      requires an immutable committed action ref, while R1 supplies neither a
      closed issuance Command in the witness nor a fixed pre-existing pending-
      Delegation graph.
    counterexample: >-
      Instantiate exactly the frozen F2 synthetic manifest and the R1 objects
      listed before the ACK. There is no pending Delegation target. Fabricating
      one has no F2 issuance action; importing one adds an undeclared input and
      violates the manifest-only witness premise.
    impact: >-
      The mandatory M0 proof cannot reach its activation, replay, crash/restart,
      and dual-start steps from the stated accepted synthetic surface.
    required_correction: >-
      Make R2 constructive by enumerating the complete synthetic genesis. Either
      define and execute an exact admitted ledger-only Delegation issuance
      Command with the necessary distinct Actors, root responsibility, assertion,
      action ref, and pending grant before ACK, or bind an independently accepted
      exact pending-Delegation fixture and its full frozen F2 proof graph. No real
      credential, host, provider, service, private Memory, or runtime may enter.

review_boundaries_and_non_findings:
  - >-
    Selection of the concrete OS-enforced lock primitive is an implementation
    profile permitted by Section 7.1 and is not a finding so long as ownership,
    crash, fork, and dual-start fixtures satisfy the fixed semantics.
  - >-
    The accepted architecture expressly says N-API is not a sandbox against
    fully controlled same-process or same-OS-user code. This review does not
    convert that excluded threat model into an F3 blocker.
  - >-
    F4 TaskPermit/host/fence, F5 delivery/retry/reconciliation, and F6 Validation
    current-decision detail are correctly deferred; their absence is not a
    finding and their authority was not imported.
  - >-
    No implementation or runtime tests were required or executed. Findings are
    semantic contract defects demonstrable from the fixed bytes, not unverified
    implementation concerns.

