unique_blockers:
  - id: F2-R20-FULL-B01
    classes:
      - M0_IMPOSSIBILITY
      - INTERNAL_CONTRADICTION
    title: synthetic_M0_Actor_eligibility_intersection_is_empty
    witness: >-
      R13-R14 require an eligible Actor class from Resident, Domain Agent,
      Temporary Worker, or System Service whose revision-1 CREATE basis is
      JENN_GOVERNANCE_DECISION_BASIS. R2/R16 admit those classes only through
      IDENTITY_STEWARD_ACTION or ACCEPTED_PROVISIONING_ACTION. Jenn alone uses
      the governance basis and is excluded. Exhaustive intersection is 0 of 6
      Actor classes, so manifest ACCEPT cannot obtain ELIGIBLE.
    independently_confirmed_by:
      - full_semantic
      - full_deterministic_constructive
    remediation_boundary: narrow_subject_correction_required
  - id: F2-R20-FULL-B02
    classes:
      - M0_IMPOSSIBILITY
      - INTERNAL_CONTRADICTION
    title: synthetic_Binding_activation_replay_derivation_is_undefined
    witness: >-
      R8/R15 replace synthetic Binding activation stewardship_source with a
      SyntheticManifestDerivedLifecycleRef that has no kind or source_ref.
      The still-owning R4/R5 replay formula requires exactly those nonexistent
      fields. A legal synthetic activation evidence replay identity cannot be
      computed, so the Binding cannot reach ACTIVATED.
    independently_confirmed_by:
      - full_materialization_equivalence
    remediation_boundary: narrow_subject_correction_required
  - id: F2-R20-FULL-B03
    classes:
      - REVOCATION_COMPROMISE_BYPASS
      - INTERNAL_CONTRADICTION
    title: compromise_target_type_excludes_assurance_actions
    witness: >-
      R15/R17/R18 admit authenticated issuance, Binding activation, and
      Delegation activation assurance actions through their owning immutable
      action refs. R20 restricts every complete target element to
      LifecycleActionRefV0_1R8. The excluded actions cannot enter CHALLENGE or
      INVALIDATE target sets, creating a compromise-response bypass.
    independently_confirmed_by:
      - full_materialization_equivalence
    remediation_boundary: narrow_subject_correction_required

