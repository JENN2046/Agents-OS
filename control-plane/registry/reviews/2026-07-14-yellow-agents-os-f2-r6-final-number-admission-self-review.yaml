author_corrections_before_hash_fixing:
  - correction_id: F2-R6-SR-01
    issue: >-
      The first draft described NaN and infinities as invalid JSON numbers,
      which could reintroduce ambiguity for a syntactically valid token such as
      1e309 that parses to a non-finite ECMAScript Number.
    correction: >-
      The fixed subject instead states that non-finite parsed results are
      outside the RFC 8785 input domain and explicitly rejects 1e309 when its
      parsed result is non-finite.
    outcome: CLOSED_BEFORE_SUBJECT_HASH_FIXED

blocker_readjudication:
  - finding_id: F2-R5-IR-B01
    result: RESOLVED_IN_R6
    basis: >-
      R6 selects one normative admission domain: the already-parsed ECMAScript
      Number binary64 value. It makes the three-clause predicate complete,
      rejects negative zero explicitly, accepts or rejects rounded lexical
      fractions solely by their parsed result, fixes JCS insertion to that
      parsed value, and enumerates both safe-integer boundaries and exponent,
      fraction, negative-zero, wrong-type, and non-finite fixtures.

