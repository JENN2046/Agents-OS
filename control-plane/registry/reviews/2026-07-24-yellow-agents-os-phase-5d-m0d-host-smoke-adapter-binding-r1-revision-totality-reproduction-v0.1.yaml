  severity: blocker
  title: legal same-revision synthetic owner contracts are structurally over-rejected
  contract_rule: >-
    Every section carries a positive revision and belongs to the same contract revision.
  profile_rule: all_sections_require_strict_ref_positive_revision_lowercase_sha256
