findings:
  - id: F4-R3-FULL-ATOMIC-IR-B01
    severity: BLOCKER
    title: ACCEPTANCE_MISSING cannot produce the canonical HostWorkStartDisposition fact identity required by R3
    section:
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_9_4_HostWorkStartDispositionFact_schema_and_observation_identity
        lines: 807-867
        evidence: >-
          The fact requires acceptance_ref and acceptance_fingerprint, and
          observation_id is SHA-256 over acceptance_fingerprint plus the
          observation attempt. NOT_STARTED is described as a committed fact.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r1.draft.md
        section: Section_14_F4NapiSurface_observeStartAuthority
        lines: 1120-1123
        evidence: >-
          observeStartAuthority accepts only a HostWorkAcceptanceFact ref and
          returns a HostWorkStartDispositionFact; it defines neither an
          expected-acceptance fingerprint source nor an outer fail-closed
          no-fact decision for a missing acceptance.
      - path: control-plane/registry/drafts/2026-07-16-agents-os-f4-taskpermit-host-authentication-effect-admission-v0.1-r3-amendment.draft.md
        section: Sections_3_2_3_3_and_3_5
        lines: 128-211
        evidence: >-
          R3 classifies exact acceptance missing as a proven negative, requires
          NOT_STARTED / ACCEPTANCE_MISSING for every schema-valid normalized
          tuple, and asserts one canonical fact fingerprint and replay under
          the unchanged R1 identity formula.
      - path: control-plane/registry/examples/2026-07-16-agents-os-f4-r3-prestart-start-disposition-totality-vectors-v0.1.json
        section: acceptance_missing_plus_host_negative_vector
        line: 35
        evidence: >-
          The vector proves only the abstract pair; it does not construct the
          required fact, observation_id, acceptance binding, or replay key.
    counterexample:
      observe_input: acceptance:missing:001
      canonical_acceptance_row_exists: false
      acceptance_current: REJECTED
      host_identity_current: REJECTED
      abstract_R3_reducer_output: [NOT_STARTED, ACCEPTANCE_MISSING]
      required_output_schema: HostWorkStartDispositionFactV0_1
      required_identity_formula: SHA256_JCS_domain_acceptance_fingerprint_observation_attempt
      canonical_acceptance_fingerprint_available: false
      caller_may_supply_authoritative_fingerprint: false
      alternative_no_fact_fail_closed_decision_defined: false
      contradiction: >-
        The reducer requires a committed canonical negative fact, but the only
        canonical input from which its observation identity is derived is the
        acceptance fingerprint that is absent. Choosing an arbitrary caller
        fingerprint creates multiple possible first-fact identities; emitting
        no fact violates the declared total output and N-API surface.
    impact: >-
      The required acceptance-missing negative path is not constructible as one
      canonical immutable fact. Independent implementations can either invent
      different acceptance fingerprints and observation IDs or return an
      undocumented no-fact rejection. This is fail-closed with respect to
      effect authority, but it breaks full totality, first-fact/replay
      uniqueness, the required acceptance-missing adversarial check, and the
      no-internal-contradiction review gate.
    minimum_correction:
      - >-
        Choose one closed model: either define a canonical expected-acceptance
        identity/fingerprint that exists before acceptance and is the sole
        binding used for missing-acceptance observations, or declare missing
        acceptance a fail-closed request error that emits no
        HostWorkStartDispositionFact.
      - >-
        If the no-fact model is chosen, add a versioned outer decision schema,
        update observeStartAuthority output, remove ACCEPTANCE_MISSING from the
        fact reducer, and specify replay/idempotency for that rejection.
      - >-
        If the expected-identity model is chosen, bind it from an existing
        immutable invocation/admission fact without caller choice, update the
        observation-id formula and handoff-absence key consistently, and prove
        changed-byte conflict behavior.
      - >-
        Replace the abstract acceptance-missing vector with a constructive
        full-fact or explicit no-fact fixture and add changed-identity,
        changed-reason, and identical-replay negative tests.
      - Perform a new full atomic hash-bound R4 independent review.
    fail_open: false
    requires_R4: true

