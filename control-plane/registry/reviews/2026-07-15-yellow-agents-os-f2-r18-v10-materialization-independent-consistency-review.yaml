  major:
    - id: "F2-R18-V10-MCR-M01"
      title: "The derived source map is not confined to the fixed hash-bound R1-R18 authority set"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-14-agents-os-actor-identity-delegation-v0.1.draft.md"
          lines: "54-68,931-951"
          evidence: >-
            R1 already supplies the fixed-subject authority and single
            Prohibited Boundary semantics needed by the materialized section.
        - path: "control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r8-amendment.draft.md"
          lines: "784-820"
          evidence: >-
            R8 Section 6.4 is the authoritative source of the synthetic Binding
            stewardship-source replacement.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "12,21-24,47-48"
          evidence: >-
            V10 declares fixed R1-R18 subjects to be its only authority.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "1563-1571"
          evidence: >-
            Section 17 nevertheless lists root AGENTS.md and an unbound
            accepted-direction artifact as normative sources. Neither is in the
            fixed review allowlist; root AGENTS.md is operating instruction only.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "1220-1221,2236"
          evidence: >-
            The section-level source declaration correctly includes R8 Section
            6.4, but the exhaustive BindingActivationEvidence row omits it while
            indexing the synthetic replacement shape as source-exact.
      impact: >-
        The materialization cannot simultaneously be a hash-bound R1-R18-only
        reading surface and claim mutable or unlisted authority. The incomplete
        evidence-row provenance also hides the exact amendment that makes the
        synthetic union valid. This violates the required exact source map even
        though the printed synthetic evidence shape itself is correct.
      required_correction: >-
        Remove every non-R1-R18 normative source claim from Section 17, cite the
        exact supporting R1 sections instead, and add R8 Section 6.4 to the
        BindingActivationEvidence authoritative-source index cell. Recompute
        the materialization hash and submit it to a fresh consistency review.

    - id: "F2-R18-V10-MCR-M02"
      title: "Two sole indexed reducers do not compose the complete R15/R16 assurance effects"
      source_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r15-amendment.draft.md"
          lines: "405-417,424-436"
          evidence: >-
            Binding issuance/activation CHALLENGED must make the Binding
            INDETERMINATE; INVALIDATED must make it REVOKED prospectively.
            Synthetic manifest create/accept INVALIDATED must make the manifest
            REVOKED prospectively and derived subjects non-active.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md"
          lines: "541-564"
          evidence: >-
            Every directly affected reducer must verify coverage, apply the R15
            action-class mapping, preserve safer effects, then apply ordinary
            rules, and return an enabling state only for CONFIRMED assurance.
      materialization_locations:
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "508-537,2270"
          evidence: >-
            The sole indexed Binding reducer has no issuance/activation
            CHALLENGED or INVALIDATED branches and no explicit composition with
            the R16 order.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "1519-1537,1740-1761"
          evidence: >-
            A detached high-level effects table states the desired outcomes,
            while the common prelude is expressly scoped to five later reducers
            and does not make the Binding reducer self-complete. Its printed
            steps also do not state the R15 INVALIDATED-to-REVOKED mapping.
        - path: "control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v10.draft.md"
          lines: "2164-2179,2281"
          evidence: >-
            The sole indexed synthetic-manifest reducer maps non-confirmed
            enabling assurance to INDETERMINATE and reaches REVOKED only from an
            explicit later REVOKE revision; it omits the source-required
            create/accept INVALIDATED-to-REVOKED branch.
      impact: >-
        Row-count completeness does not provide reducer semantic completeness.
        An implementation following either sole indexed definition cannot
        deterministically produce the source-required safer REVOKED result for
        invalidated Binding issuance/activation or invalidated manifest
        create/accept assurance. A generic table elsewhere does not establish
        unambiguous reducer composition.
      required_correction: >-
        Inline the complete R15 action-class branches and R16 reduction order in
        both sole indexed reducers, or define one explicit common prelude that
        unambiguously composes with every directly affected reducer and update
        every reducer index row to that composition. Preserve safer transition
        effects and require CONFIRMED assurance for enabling success.
  minor: []

