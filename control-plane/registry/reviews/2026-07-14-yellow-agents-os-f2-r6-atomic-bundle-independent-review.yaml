prior_finding_disposition:
  - finding_id: F2-IR-B01
    disposition: RESOLVED
    rationale: >-
      R2-R4 close assignment provenance, attenuation, grant CAS, self-issuance rejection,
      authenticated issuance-action binding, and activation evidence. R5-R6 now also close the
      last BindingScope admission ambiguity that previously kept activation nondeterministic.
  - finding_id: F2-IR-B02
    disposition: RESOLVED
    rationale: >-
      R2-R5 define typed evidence, stable IDs, acyclic graphs, complete projections, digest
      scalar encodings, revision CAS, and recovery order. R6 supplies the last deterministic
      scope input admission and canonical insertion rule.
  - finding_id: F2-IR-B03
    disposition: RESOLVED_BY_EXPLICIT_F3_OWNERSHIP_REPLACEMENT
    rationale: >-
      R2 assigns Command payload schemas, canonicalization, atomic intake, replay, crash outcome,
      and domain handoff to F3. F2 neither starts F3 nor admits runtime intake without it.
  - finding_id: F2-IR-M01
    disposition: RESOLVED
    rationale: >-
      R2 closes identity-transition and recovery provenance, the affected-binding set, atomic
      recovery, and fail-closed conditions without creating a second writer.
  - finding_id: F2-R2-IR-B01
    disposition: RESOLVED
    rationale: >-
      R3 defines a responsibility-free activation acknowledgement backed by an already-active
      Principal binding and forbids treating the pending grant as responsibility.
  - finding_id: F2-R2-IR-B02
    disposition: RESOLVED
    rationale: >-
      R3 removes subject/evidence fixed points, R4 defines domain-separated projections, R5
      fixes every inserted digest scalar, and R6 closes the final BindingScope numeric domain.
  - finding_id: F2-R2-IR-B03
    disposition: RESOLVED
    rationale: >-
      R3 forbids assignment self-issuance and fixes Jenn-root, assignment-rooted, and child
      delegation provenance. R4 binds the complete immutable F3 action ref into the grant.
  - finding_id: F2-R3-IR-B01
    disposition: RESOLVED
    rationale: >-
      R4 supplies complete domain-separated field projections; R5 fixes all replay/evidence-ID
      scalar representations and context scalar types; R6 fixes the final parsed-number boundary.
  - finding_id: F2-R3-IR-B02
    disposition: RESOLVED
    rationale: >-
      The action-ref fingerprint covers every R2 field, is recomputed from immutable F3 COMMITTED
      bytes, and is bound into the final acyclic delegation subject.
  - finding_id: F2-R4-IR-B01
    disposition: RESOLVED
    rationale: >-
      CanonicalDigestScalarV0_1 fixes SHA-256, the owning domain-tagged JCS formula, lowercase-hex
      string persistence, validation, and exact parent insertion for all five affected fields.
  - finding_id: F2-R4-IR-B02
    disposition: RESOLVED
    rationale: >-
      R5 closes context_id and the nominal context_revision range and type. R6 makes the exact
      parsed-number predicate, negative-zero result, rounding behavior, and insertion unambiguous.
  - finding_id: F2-R5-IR-B01
    disposition: RESOLVED
    rationale: >-
      R6 is precedence-complete: parsed binary64 controls; -0 is rejected explicitly; rounded
      fractions, exponents, non-finite results, safe-integer boundaries, JCS insertion, duplicate
      detection, recovery, and cross-writer fixtures all follow that one rule.

author_self_review_readjudication:
  - correction_id: F2-R6-SR-01
    disposition: CONFIRMED
    rationale: >-
      The parsed binary64 data-model domain is explicit and source-token exact-decimal semantics
      are expressly excluded.
  - correction_id: F2-R6-SR-02
    disposition: CONFIRMED
    rationale: >-
      The exact predicate separately rejects negative zero and gives one outcome for rounded
      fractions, exponent forms, non-finite results, and both safe-integer boundaries.
  - correction_id: F2-R6-SR-03
    disposition: CONFIRMED
    rationale: >-
      JCS insertion, numeric ordering, normalized duplicate detection, recovery, and mandatory
      two-writer fixtures all consume the admitted parsed value.
