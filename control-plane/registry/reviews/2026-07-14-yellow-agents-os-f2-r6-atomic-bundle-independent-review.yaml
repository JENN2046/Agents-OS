R6_blocker_readjudication:
  finding_id: F2-R5-IR-B01
  disposition: RESOLVED
  rationale: >-
    R6 chooses one normative domain: the already-parsed ECMAScript Number / IEEE 754 binary64
    value. Its complete predicate is Number.isSafeInteger(value) && value >= 0 &&
    !Object.is(value, -0). Original decimal spelling has no competing admission authority.
    Rounded fractional tokens are expressly judged by their parsed result, negative zero is
    expressly rejected, exponent forms are judged by their parsed result, non-finite values are
    rejected, and the inclusive upper bound is 2^53 - 1. The admitted parsed value is the value
    serialized into the owning R4 JCS tuple and used for sorting and duplicate comparison.
    Recovery repeats admission before fingerprint verification and never repairs alternate data.
    The prose, predicate, examples, and mandatory cross-writer fixtures therefore agree.

number_admission_reverification:
  normative_domain: parsed_ECMAScript_Number_IEEE_754_binary64
  original_JSON_number_token_normative_after_parse: false
  exact_admission_predicate: >-
    Number.isSafeInteger(value) && value >= 0 && !Object.is(value, -0)
  positive_zero:
    admitted: true
    JCS_serialization: "0"
  negative_zero:
    admitted: false
    explicit_Object_is_test: true
  decimal_or_exponent_lexical_form_rejected_by_form_alone: false
  rounded_fraction_rule: parsed_binary64_result_controls
