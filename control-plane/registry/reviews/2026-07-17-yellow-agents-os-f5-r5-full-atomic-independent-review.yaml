findings:
  - finding_id: F5_R5_BLOCKER_001_FIRST_APPLY_ELIGIBILITY_REDUCTION_REGRESSION
    severity: blocker
    title: R5 accepts NOT_ELIGIBLE as an armed first apply with one Event and one call authorization
    lineage:
      regresses_fixed_R4_behavior: true
      new_independent_reproducible_counterexample: true
      prior_finding_substitution: false
    exact_evidence:
      normative_R4_clause: >-
        R4 Section 10 permits NO_EXISTING_ARM constructive first apply only with
        ELIGIBLE_PROOF_PRECONDITION and models exactly one Event and one call authorization.
      preserved_R4_builder_guard: control-plane/registry/build-f5-r4-three-finding-proof-closure.py:354
      preserved_R4_validator_guard: control-plane/registry/validate-f5-r4-three-finding-proof-closure.py:447
      regressed_R5_builder_mapping: control-plane/registry/build-f5-r5-bound-replay-evidence-closure.py:406
      regressed_R5_validator_mapping: control-plane/registry/validate-f5-r5-bound-replay-evidence-closure.py:589
      observation: >-
        R5 validates first_apply_eligibility only as an enum, then maps every
        NO_EXISTING_ARM input to APPLIED / ARMED_FIRST_APPLY with deltas 1 and 1.
        The R4 fail-closed NOT_ELIGIBLE branch is absent in both R5 builder and validator.
    counterexample:
