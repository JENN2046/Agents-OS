finding_details:
  - finding_id: F6-R3-IR-B01
    severity: blocker
    title: Task identity is not closed across the validation context
    cases: [F6-R3-IR-C01, F6-R3-IR-C02]
    observation: >-
      Completion or all revisions of one Requirement can be rebound to another
      Task, with dependent set, attempt, decision, Command, Event and outer
      bindings updated, while the validator still derives SATISFIED or ELIGIBLE.
    required_correction:
      - bind_Task_Requirement_Validation_Set_attempt_and_completion_to_one_exact_Task_identity
      - bind_that_identity_to_the_current_F1_TASK_CURRENT_STATE_assessment

  - finding_id: F6-R3-IR-B02
    severity: blocker
    title: Consumer assessment revisions are not compared with resolved assessment revisions
    cases: [F6-R3-IR-C04, F6-R3-IR-C05]
    observation: >-
      F1, F3, F5, provenance, waiver, evidence and completion consumer revision
      fields can diverge from the assessment_revision of the resolved assessment,
      including a nonexistent revision, without rejection.
    required_correction:
      - require_every_consumer_assessment_revision_to_equal_the_resolved_assessment_revision

  - finding_id: F6-R3-IR-B03
    severity: blocker
    title: Waiver expiry is not derived from TrustedTime
    cases: [F6-R3-IR-C06]
    observation: >-
      A TrustedTime sequence later than expires_at_sequence can coexist with
      WAIVED and ELIGIBLE results and is accepted.
    required_correction:
      - derive_waiver_currentness_from_exact_TrustedTime_sequence
      - reject_expired_or_not_yet_valid_waiver_results

  - finding_id: F6-R3-IR-B04
    severity: blocker
    title: Evidence validation subject is not bound to the consuming Requirement
    cases: [F6-R3-IR-C03]
    observation: >-
      An evidence object can name a different Requirement as validation_subject
      while its original attempt remains accepted as PASSED.
    required_correction:
      - bind_evidence_validation_subject_to_exact_Requirement_revision_and_attempt_context

  - finding_id: F6-R3-IR-B05
    severity: blocker
    title: Carry-forward Event order does not bind the carry revision after its source
    cases: [F6-R3-IR-C07]
    observation: >-
      A carry-forward revision Event can precede its original source Event and
      remain accepted.
    required_correction:
      - require_attempt_predecessor_Event_strict_order
      - require_carry_source_Event_strictly_before_carry_revision_Event

