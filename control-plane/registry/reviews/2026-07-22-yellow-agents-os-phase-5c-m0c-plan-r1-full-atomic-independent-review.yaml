finding_details:
  - id: PHASE5C_M0C_PLAN_R1_IR_B01
    severity: blocker
    title: The_archive_and_output_contract_is_not_exact_enough_for_atomic_freeze
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-offline-plugin-packaging-implementation-plan-v0.1-r1.md
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-offline-plugin-packaging-build-profile-v0.1-r1.yaml
    exact_locations:
      - implementation_plan_lines_72_95
      - implementation_plan_lines_99_107
      - build_profile_lines_55_67
      - build_profile_lines_77_86
      - review_manifest_lines_58_70
    evidence: >-
      The subjects require deterministic order, deterministic metadata, an
      archive checksum and two byte-identical clean builds, but do not freeze
      the archive format, compression method and parameters, normalized mtime,
      uid, gid or file modes, archive root and member mapping, checksum
      algorithm and canonical preimage, or the success and failure output
      delivery and cleanup state machine. The caller output path is forbidden,
      the builder is confined to a newly owned temporary root, and cleanup is
      required, but the subjects do not state which final bytes survive or how
      they are returned without violating those rules.
    impact: >-
      Two materially different builders can satisfy the written profile while
      producing different archive bytes and cleanup outcomes. The atomic unit
      therefore does not yet define one deterministic buildable result.
    closure_required:
      - freeze_one_archive_format_and_all_deterministic_encoding_parameters
      - freeze_the_exact_archive_root_member_inventory_and_generated_member_locations
      - freeze_the_checksum_algorithm_scope_and_canonical_preimage
      - freeze_success_failure_output_delivery_cleanup_and_residue_rules

  - id: PHASE5C_M0C_PLAN_R1_IR_B02
    severity: blocker
    title: The_validator_signs_claimed_labels_instead_of_deriving_required_structural_facts
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-offline-plugin-packaging-implementation-plan-v0.1-r1.md
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-offline-plugin-packaging-build-profile-v0.1-r1.yaml
    author_evidence:
      - control-plane/registry/build-phase-5c-m0c-plan-r1-witness.py
      - control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r1-synthetic-witness-v0.1.json
      - control-plane/registry/validate-phase-5c-m0c-plan-r1-witness.py
    exact_locations:
      - implementation_plan_lines_113_123
      - validator_lines_15_17
      - validator_lines_43_56
      - validator_lines_59_94
      - review_manifest_lines_69_80
    evidence: >-
      The witness case schema contains only claimed booleans and counts for
      source sealing, inventory exactness, host-contract exactness, temporary
      staging and public method count. The validator derives the result from
      those claims and signs them, but it has no structural fields from which
      to derive the sealed commit, path, blob and SHA identities, actual package
      members and path kinds, eager native loading, archive bytes or filesystem
      residue outside the owned temporary root. Fourteen independent
      fully-resigned attacks against representable fields were rejected, but
      six attack classes required by the manifest cannot be represented or
      evaluated by the fixed evidence contract.
    impact: >-
      A favorable witness can assert the required booleans while the underlying
      package, host commitments, entrypoint behavior, archive or cleanup state
      is invalid. The required rule that results be derived rather than trusted
      from claimed labels is not met.
    closure_required:
      - replace_claim_only_booleans_with_exact_structural_evidence
      - bind_sealed_host_identities_inventory_paths_entrypoint_events_archive_and_cleanup_state
      - derive_each_favorable_condition_from_those_bytes_and_records
      - add_fully_propagated_attacks_for_every_manifest_required_attack_class

