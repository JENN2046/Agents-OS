findings:
- finding_id: F8-R4-B01
  severity: blocker
  title: H01 compatibility accepts arbitrary owner-commitment tuple while retaining CANDIDATE_FORMED
  status: OPEN_REPRODUCED
  normative_basis:
  - R4 amendment section 4 requires each non-null R2 assessment tuple to receive its exact owner-commitment tuple.
  - R3 requires exact resolution of owner commitment ref, revision and fingerprint from the upstream owner source before reading
    the assessment result.
  reproduction:
    attack_id: R4-A63
    dependency_propagation: compatibility row, section fingerprints and root fingerprint all recomputed
    mutation: replace f7_intent_currentness owner commitment ref/revision/fingerprint with attacker-chosen profile-valid values
    validator_errors: []
    validator_accepted: true
    retained_claimed_result: CANDIDATE_FORMED
    favorable_invalid_path: true
  root_cause:
  - R4 validate_fixture checks only ALL_NON_NULL shape for upgraded consumers.
  - It down-projects and verifies only the first three R2 assessment fields.
  - It never derives or resolves the last three owner-commitment fields against an R3 owner source.
  - claimed_result CANDIDATE_FORMED is asserted rather than derived through the combined R3+R4 path.
  impact: The required inherited H01 compatibility proof is caller-self-consistent rather than owner-source-bound. An invalid
    upgraded consumer can be presented as preserving the favorable candidate result.
  correction_required:
  - Bind every upgraded non-null H01 consumer to an exact immutable owner commitment source or an independently fixed commitment
    anchor.
  - Run the upgraded H01 through the combined R2/R3 reducer with R4 nullability semantics rather than accepting claimed_result
    as a fixture assertion.
  - Add full-resigning substitutions for commitment ref, revision and fingerprint and require target-semantic rejection.
- finding_id: F8-R4-B02
  severity: blocker
  title: R4 changes inherited stable_ref semantics instead of replacing only nullability
  status: OPEN_REPRODUCED
  normative_basis:
  - R2 defines stable_ref as a strict JSON string that is nonempty and NFC.
  - R4 scope replaces only nullability validation and all-null resolution; stable_ref remains inherited.
  - The no-finding rule forbids both favorable invalid paths and legal-input over-rejection.
  reproduction:
    R4-A64:
      mutation: non-NFC owner_commitment_ref with full outer re-signing
      validator_accepted: true
      contract_valid: false
    R4-A65:
      mutation: nonempty NFC owner_commitment_ref containing an internal space with full outer re-signing
      validator_accepted: false
      contract_valid: true
  root_cause: R4 stable_ref checks nonempty and no whitespace, but omits NFC normalization. This both accepts a contract-invalid
    ref and rejects a contract-valid ref.
  impact: Canonical identity comparison and legal consumer acceptance drift from the inherited contract. This is a direct
    legal-input over-rejection plus invalid-input acceptance in the schema gate.
  correction_required:
  - 'Reuse the exact inherited stable_ref predicate: type(value) is str, nonempty, and NFC-normalized.'
  - Do not introduce a new whitespace prohibition unless the normative contract is separately amended and reviewed.
  - Add positive NFC-with-space and negative non-NFC regressions.
