finding_details:
- id: PHASE5B_PLAN_R3_IR_B01
  severity: blocker
  title: F3 identity and authentication values are not bound to sealed command_intake.rs
  evidence:
  - Six fully resigned rewrites of claimed_actor_id, claimed_principal_id, claimed_principal_revision, claimed_principal_binding_ref,
    principal_binding_fingerprint and synthetic_credential_id returned no semantic errors.
  - Sealed source requires exact synthetic Actor, Principal, binding, revision, binding fingerprint and credential values;
    R3 checks only field inventory and a subset of values.
  impact: A structurally complete but identity-spoofed synthetic F3 submission can satisfy the R3 proof.
- id: PHASE5B_PLAN_R3_IR_B02
  severity: blocker
  title: Candidate primary-key, ref and history identity uniqueness are not validated
  evidence:
  - A fully resigned graph containing two revision-1 rows with candidate_id intent and candidate_ref candidate:SYNTHETIC_TEST:intent:1
    but different fingerprints returned no semantic errors.
  - The validator stores candidates by ref with overwrite semantics and never checks primary-key or ref uniqueness.
  impact: The accepted graph is not insertable under its declared primary key and canonical history is ambiguous.
- id: PHASE5B_PLAN_R3_IR_B03
  severity: blocker
  title: Composite foreign-key inventory completeness and uniqueness are not bound
  evidence:
  - Removing all three FKs, removing the home_candidate_head FK, or replacing it with a duplicate of the first FK each returned
    no semantic errors after root re-signing.
  - The validator loops only over supplied FKs and never compares the list to the normative three-entry profile.
  impact: The proof can omit required referential-integrity edges while retaining a favorable result.
