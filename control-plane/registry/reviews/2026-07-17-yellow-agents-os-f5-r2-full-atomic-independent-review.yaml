finding_ids_with_exact_evidence_counterexample_and_required_correction:
  - finding_id: F5_R2_BLOCKER_001_VALIDATOR_ACCEPTS_FULLY_RESIGNED_SCHEMA_INVALID_VALUES
    severity: blocker
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        R2 amendment Section 2 lines 47-50 freezes NFC strings and safe integers
        only. Validator canonical_bytes at lines 20-21 performs json.dumps with
        sorted keys but performs neither NFC normalization/rejection nor a
        recursive safe-integer/type validation.
      - >-
        validate_instances at validator lines 217-235 checks only field-set
        equality, interface literals, fingerprints and a few selected fields;
        it does not validate the declared scalar types, closed enums or
        relational constraints for the 16 effective schemas. validate_root at
        lines 321-324 hashes whatever root fields are present without enforcing
        a closed root inventory.
      - >-
        An independent in-memory probe changed canonical objects, recomputed
        their object fingerprints, re-signed the canonical_instances section
        and root, and did not write files. Four probes returned PASS_NO_BLOCKER:
        created_at_utc_ms=1000.5; receipt_kind=UNRECOGNIZED_KIND;
        owner_host_id="e\u0301"; and an unknown root field.
    counterexample: >-
      A fully re-signed fixture containing a JSON float in a field declared
      non_negative_safe_integer is accepted as PASS_NO_BLOCKER. The same is
      true for an undeclared receipt-kind enum and a non-NFC stable reference.
      Therefore a validator PASS does not prove the canonical JCS/schema
      surface that R2 says it independently implements.
    required_correction: >-
      In R3, add a closed recursive value validator before hashing: reject
      floats, out-of-range integers, non-NFC strings, unknown root/object fields
      and unknown enum literals; validate every declared field type and every
      normative cross-field relation. Add fully re-signed negative probes for
      each class and require them to fail for semantic reasons, then rerun a
      fresh atomic review.

  - finding_id: F5_R2_BLOCKER_002_RECEIPT_COMPATIBILITY_FALSELY_ESCALATES_TO_APPLIED
    severity: blocker
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        R2 amendment lines 346-359 defines only receipt-kind/status
        compatibility and explicitly requires authenticated existing-effect
        evidence for EFFECT_QUERY_RESULT. Lines 363-393 require dedup,
        attestation, identity, epoch, fence, attempt and transition currentness
        before APPLIED_CURRENT.
      - >-
        Builder receipt_matrix lines 266-267 and validator expected_receipts
        lines 285-290 instead map every allowed kind/status pair directly to
        expected=APPLIED. No attestation, identity, epoch, fence, attempt,
        transition or existing-effect query input is present in these rows.
      - >-
        The fixed canonical receipt disposition is APPLIED_CURRENT with
        current_projection_advanced=true, while its proof is not derived from a
        complete currentness-reducer input.
    counterexample: >-
      EFFECT_QUERY_RESULT + NOT_EXECUTED is emitted as APPLIED solely because it
      is an allowed matrix cell. The same row contains no authenticated source,
      existing effect_id query, current epoch/fence/attempt or current
      transition proof. This converts compatibility into authority to advance
      a projection and bypasses the normative reducer prerequisites.
    required_correction: >-
      In R3, make the 25-cell matrix emit only COMPATIBLE or
      RECEIPT_KIND_STATUS_MISMATCH. Add a separate executable receipt reducer
      whose raw inputs cover dedup, source attestation, attempt/effect identity,
      epoch, fences, attempt currentness and transition legality; derive exact
      result, primary/reason codes, event/reconciliation/history/current-
      projection booleans for positive, stale, invalid and indeterminate cases.

  - finding_id: F5_R2_BLOCKER_003_ARM_REPLAY_RELATION_REMAINS_DECLARATIVE_NOT_STATE_DERIVED
    severity: blocker
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        Builder arm_replay_cases lines 256-263 accepts one of four preclassified
        relation labels and attaches a fixed expected output. Validator
        expected_replay lines 276-282 independently repeats the same label-to-
        output table.
      - >-
        No replay proof row contains an existing arm-store lookup result,
        existing request ID/fingerprint/bytes, submitted request
        ID/fingerprint/bytes, stored first accounting or observed first/second
        Event and call counts. The validator therefore cannot derive the
        relation it claims to validate.
      - >-
        The fixed canonical instance demonstrates only a first-apply
        disposition; it supplies no second transaction whose relation is
        computed against the stored first arm.
    counterexample: >-
      Relabel a genuinely changed request as EXACT_DUPLICATE before it reaches
      the table. The executable proof has no raw existing-versus-submitted
      identity/fingerprint/bytes from which to detect that false label. It will
      return REPLAYED with zero call based on the caller-provided relation
      literal, so the original R1 arm-replay blocker is not executablely closed.
    required_correction: >-
      In R3, encode canonical stored-arm state plus submitted request bytes and
      independently derive NO_EXISTING_ARM, EXACT_DUPLICATE,
      CHANGED_BYTES_SAME_IDENTITY or LOOKUP_INDETERMINATE. Prove first apply
      commits one Event and one call authorization, exact replay returns stored
      accounting with zero additional Event/call, changed bytes conflict with
      zero call, and unavailable lookup is indeterminate with zero call.

  - finding_id: F5_R2_MAJOR_001_PAIRWISE_PRECEDENCE_PROOF_DOES_NOT_EXECUTE_BOTH_RAW_ORDERINGS
    severity: major
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        R2 amendment lines 112-115 requires both orderings of raw input
        construction for every unordered failure pair to produce the same
        primary reason and sorted reason_codes.
      - >-
        Builder pairwise_cases lines 248-253 emits exactly one row per unordered
        pair with active_reasons=[right,left] and a prefilled expected result.
        Validator expected_pairwise lines 263-273 constructs the same one-order
        row and compares equality; neither side runs a claim, lease or arm
        reducer over raw failure booleans.
      - >-
        The 147 count is the unordered-pair count 66 claim + 15 lease + 66 arm.
        It is not the required 294 raw-order executions and contains no result
        derived independently from the row's expected fields.
    counterexample: >-
      An implementation can be correct for [later_reason, earlier_reason] and
      order-dependent for [earlier_reason, later_reason]. Every fixed row still
      passes because the second ordering is absent and expected_primary_reason
      is copied from the same precedence constants used to build the row.
    required_correction: >-
      In R3, define independent claim, lease and arm reducers over raw boolean
      conditions. For each of the 147 unordered pairs execute both input
      permutations, derive all true sorted-unique reason_codes and the unique
      normative primary reason, and report 294 successful ordering trials while
      retaining 147 unordered-case identities.

  - finding_id: F5_R2_MAJOR_002_CANONICAL_INSTANCE_SET_VIOLATES_EFFECTIVE_SEMANTICS
    severity: major
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        R1 lines 290-296 requires claim_epoch to equal previous plus one. The
        fixed canonical claim has claim_epoch=1 and
        expected_previous_claim_epoch=1 while declaring CLAIMED_NEW.
      - >-
        R2 amendment lines 107-110 rejects renewal unless renewed_at is strictly
        less than new_lease_expiry. The fixed canonical lease declares RENEWED
        with renewed_at_utc_ms=1000 and new_lease_expiry_utc_ms=1000.
      - >-
        R1 lines 149-152 says a synthetic intent is never claimable. The fixed
        cross-bound canonical objects nevertheless bind a synthetic,
        authority_eligible=false intent to CLAIMED and ARMED_FIRST_APPLY
        dispositions, including event_created=true and
        physical_call_authorized=true, while the fixture assertion reports
        armed_dispatch_count=0.
      - >-
        These values originate in builder sample_value/OVERRIDES lines 150-180;
        validator validate_instances lines 217-235 accepts them because it
        checks fingerprints and selected labels, not effective semantics.
    counterexample: >-
      The fixed R2 fixture itself is a hash-valid but semantically invalid
      counterexample: the prior epoch is not prior, the renewed lease expires at
      the renewal instant, and a nonclaimable synthetic intent is shown as
      claimed and first-armed. All object fingerprints still recompute and the
      validator reports PASS_NO_BLOCKER.
    required_correction: >-
      In R3, replace sample-value objects with semantically valid, explicitly
      scoped scenarios. Enforce previous+1 epochs and strict lease-time bounds.
      A synthetic nonauthority chain must reduce to NOT_EXECUTABLE and create no
      arm fact/call authorization; if positive schema shapes are needed, label
      them non-occurring shape examples and do not count them as canonical
      semantic instances or zero-occurrence evidence.

  - finding_id: F5_R2_MAJOR_003_TRANSITION_PROOF_COUNT_IS_INTERNALLY_CONTRADICTORY
    severity: major
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        R2 amendment lines 416-434 defines ten states and says the executable
        proof enumerates all 10x10 pairs. Builder, fixture, validator and
        manifest consistently report 100 transition cases.
      - >-
        The same amendment at line 449 instead promises all 121 state-transition
        pairs. No eleven-state set or 121-case interpretation is defined.
    counterexample: >-
      A reviewer cannot satisfy both normative statements: ten states produce
      100 ordered pairs, not 121. Treating 121 as binding makes the fixture
      incomplete; treating 100 as binding leaves a false executable-coverage
      claim in the atomic contract.
    required_correction: >-
      In R3, replace 121 with 100 everywhere, bind the exact ten-state inventory
      once, and make the manifest, amendment, fixture summary and validator use
      that single count source.

  - finding_id: F5_R2_MAJOR_004_DERIVED_ID_MUTATIONS_DO_NOT_MUTATE_THE_CANONICAL_OBJECT_GRAPH
    severity: major
    status: OPEN_REQUIRES_R3
    exact_evidence:
      - >-
        Validator mutation_checks lines 361-362 performs the six derived-ID
        mutations only by replacing a value in the detached
        derived_identities proof map, then re-signing that section and root.
      - >-
        It does not mutate the corresponding ID/token in the canonical intent,
        claim, request or arm object, update dependent refs/fingerprints, or
        re-sign the affected canonical-instance graph. Rejection proves only
        that a copied proof map must equal the unchanged objects.
      - >-
        By contrast, the manifest and amendment describe fully re-signed
        semantic mutations for each protected identity family.
    counterexample: >-
      A defect in which a canonical object and every dependent reference are
      consistently re-signed under a wrong identity formula is not exercised by
      any of the six mutations. The current mutation changes only the detached
      answer cell, so even a validator that merely mirrors the builder formula
      will reject it without testing graph-level identity integrity.
    required_correction: >-
      In R3, for each of the six identity domains mutate the canonical object ID
      or token, propagate the changed value through every dependent reference
      and object fingerprint, re-sign every affected section and the root, and
      require the independent formula validator to reject the fully coherent
      but formula-wrong graph.

