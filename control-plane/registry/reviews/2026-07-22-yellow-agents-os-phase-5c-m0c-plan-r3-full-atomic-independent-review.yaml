finding_details:
  - id: PHASE5C_M0C_PLAN_R3_IR_B01
    severity: blocker
    title: The_normative_subjects_do_not_freeze_the_complete_POSIX_ustar_header_byte_encoding
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-exact-archive-output-lifecycle-profile-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-plan-r3-narrow-correction-amendment-v0.1.md
    author_evidence:
      - control-plane/registry/phase5c_m0c_r3_structural_core.py
      - control-plane/registry/build-phase-5c-m0c-plan-r3-structural-witness.py
      - control-plane/registry/validate-phase-5c-m0c-plan-r3-structural-witness.py
    exact_locations:
      - R3_archive_profile_lines_15_43
      - R3_structural_core_lines_113_141
      - R3_manifest_author_evidence_lines_104_109
    evidence: >-
      The normative R3 profile freezes the logical metadata values but does not
      freeze the regular-file typeflag byte, numeric field padding and
      termination, checksum field encoding, magic and version bytes, unused
      header-field zeroing, or file-body padding bytes. Those byte choices are
      made only inside the structural helper, which the manifest explicitly
      marks as author evidence that may not substitute for independent
      judgment. POSIX tar recognizes both typeflag '0' and NUL as regular-file
      codes. An independently constructed archive changed only the first member
      typeflag from '0' to NUL, recomputed the header checksum, complete archive
      SHA and all lifecycle byte bindings, and remained readable as four
      regular files by the standard tar parser. The R3 validator rejected the
      fully re-signed archive because its non-normative helper hard-codes '0'.
    impact: >-
      The subjects still admit more than one POSIX ustar byte stream while the
      evidence accepts only one unpublished helper encoding. This violates the
      exact-header and no-legal-input-over-rejection review questions and
      prevents an atomic deterministic plan freeze.
    closure_required:
      - move_every_byte_affecting_ustar_header_and_padding_rule_into_the_normative_profile
      - freeze_the_regular_file_typeflag_byte
      - freeze_numeric_field_padding_termination_and_overflow_rules
      - freeze_checksum_field_preimage_and_output_encoding
      - freeze_magic_version_linkname_device_prefix_unused_bytes_and_body_padding
      - add_fully_resigned_regressions_for_each_alternate_legal_encoding

  - id: PHASE5C_M0C_PLAN_R3_IR_B02
    severity: blocker
    title: The_fixed_cleanup_residue_probe_observes_normal_pre_cleanup_state_not_post_cleanup_residue
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-exact-archive-output-lifecycle-profile-v0.1-r3.yaml
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-plan-r3-narrow-correction-amendment-v0.1.md
    author_evidence:
      - control-plane/registry/phase5c_m0c_r3_structural_core.py
      - control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r3-structural-witness-v0.1.json
      - control-plane/registry/validate-phase-5c-m0c-plan-r3-structural-witness.py
    exact_locations:
      - R3_archive_profile_lines_64_72
      - R3_amendment_lines_21_24
      - R3_structural_core_lines_313_332
    evidence: >-
      The profile defines archive.tar as the expected success inventory before
      cleanup and an empty nonexistent root after cleanup. The fixed residue
      probe writes archive.tar, observes it before cleanup, successfully removes
      the root, observes no post-cleanup residue, and then labels that normal
      pre-cleanup state CLEANUP_RESIDUE_DETECTED. It never injects a failed or
      incomplete cleanup and never observes residue after the attempted cleanup
      boundary. Independent fault injection showed that the normal success and
      failure helpers do fail closed when cleanup is forced to leave actual
      residue, but that negative condition is absent from the fixed two-probe
      witness claimed by R3.
    impact: >-
      The fixed evidence overstates its actual cleanup-residue probe count and
      does not execute the exact negative condition required to close R2 B02.
      Reproducing the same helper output cannot prove a post-cleanup residue
      detector because the probe never reaches that state.
    closure_required:
      - inject_an_actual_incomplete_cleanup_in_a_disposable_owned_temp_root
      - observe_root_existence_and_residue_after_the_simulated_cleanup_attempt
      - emit_the_fail_closed_result_from_that_post_cleanup_observation
      - remove_the_test_root_only_in_a_separate_harness_finalizer
      - bind_the_actual_fault_record_and_a_fully_resigned_suppression_attack

