findings:
  - id: F4-R8-FULL-ATOMIC-IR-B01
    severity: BLOCKER
    title: exact effect scope fingerprint has no canonical derivation or resolvable object
    categories:
      - authority_expansion
      - prohibited_boundary_bypass
      - circular_proof
    evidence:
      contract:
        - R8 Section 5 makes exact_effect_scope_fingerprint decisive for the authorization requirement.
        - R8 Section 2 explicitly classifies EffectScopeV0_1R8 as a non-normative evidence wrapper and provides no canonical EffectScope schema or digest formula.
      builder:
        - build-f4-r8-complete-effective-m0a.py derives effect_scope_fp with label("effect-scope:synthetic-noop"), not from the emitted capability, resource, effect-intent, host, presence, secret-handle, payload, or result-contract bytes.
      validator:
        - validate-f4-r8-complete-effective-m0a.py checks exact Jenn scope equality only inside a present exact-Jenn row.
        - It never derives exact_effect_scope_fingerprint from TaskPermitV0_1R8 or EffectIntentBindingV0_1R8 and never resolves it to a normative object.
      independently_resigned_counterexample:
        mutation: replace the builder's effect-scope label digest with 64 zeroes and rebuild every descendant object, ID, reference, fingerprint, inventory entry, and DAG node.
        result: validator accepted the rebuilt fixture with PASS.
        consequence: a policy/PBL-derived authorization mode can be bound to bytes unrelated to the effect scope that the permit and handoff actually carry.
    required_correction:
      - Define one normative fingerprinted EffectScope schema or one exact canonical formula over every authority-relevant effect field.
      - Bind the same derived scope fingerprint into the authorization requirement, permit, capability/resource proofs, final authority recheck, and handoff.
      - Require the scope ref/fingerprint to resolve to the emitted object and add a fully resigned mismatched-scope mutation.

  - id: F4-R8-FULL-ATOMIC-IR-B02
    severity: BLOCKER
    title: capability and resource proofs remain opaque assertions rather than recomputable containment proofs
    categories:
      - authority_expansion
      - circular_proof
      - M0_constructibility
    evidence:
      contract:
        - R8 Section 8 requires current definitions, operation-registry membership, exact source projections, computed intersection, and exact resource containment.
      fixture:
        - The 27-schema/93-object inventory contains no CapabilityDefinition, ResourceDefinition, OperationRegistry, capability source-projection, or resource source-projection object.
        - capability_definition_fingerprint, resource_definition_fingerprint, operation_registry_fingerprint, constraint_fingerprint, and selector_constraint_fingerprint are opaque synthetic label hashes.
        - CapabilitySubsetProofV0_1R8 and ResourceContainmentAssessmentV0_1R8 assert PASS and repeat the requested operation, but no emitted source projection contains an operation or resource scope from which the intersection or containment can be recomputed.
      validator:
        - The validator checks that asserted operation/intersection arrays equal [SYNTHETIC_NOOP] and that source fingerprints equal upstream object fingerprints.
        - It does not compute an operation intersection or resource containment from source-projection bytes because no such bytes exist.
      independently_resigned_counterexample:
        mutation: replace all operation-registry, capability-definition, resource-definition, constraint, and selector label digests with 64 zeroes, rebuild the complete fixture, and validate it.
        result: validator accepted the rebuilt fixture with PASS.
        consequence: possession of source object fingerprints is treated as proof that every source grants the asserted operation, although those objects expose no such grant.
    required_correction:
      - Materialize or hash-bind fixed accepted Definition and OperationRegistry objects.
      - Define one typed source-projection object per required role with its exact operation/resource scope and watermark.
      - Compute the intersection and containment from those projection objects; do not accept caller- or fixture-supplied PASS as the proof.
      - Require proof refs and every projection ref/fingerprint to resolve, then add arbitrary-operation and opaque-proof resigned mutations.

  - id: F4-R8-FULL-ATOMIC-IR-B03
    severity: BLOCKER
    title: final handoff CURRENT is supported by unresolved time, integrity, and fence labels
    categories:
      - revocation_bypass
      - fail_open_currentness
      - M0_constructibility
    evidence:
      contract:
        - R5/R8 require a complete same-watermark re-read immediately before disposition/handoff, including trusted time and all three current fence heads.
        - R8 Section 3 requires fingerprint references in assessments and the handoff chain to resolve to exact emitted objects.
      fixture:
        - FinalHandoffAuthorityAssessmentV0_1R8 marks CANONICAL_INTEGRITY, TRUSTED_TIME, TASK_FENCE, HOST_FENCE, and EFFECT_FENCE PASS using opaque assessment/fence refs and label hashes.
        - No F4FenceStateV0_1, trusted-time evidence object, or canonical-integrity assessment appears in the 93-object inventory.
        - HostLocalAdmissionDecisionV0_1R8 likewise uses fixture:fence-heads and an opaque fingerprint without a resolvable fence-state object.
      validator:
        - validate_identity_and_reference_chain resolves only eight of the thirteen final observation fingerprints.
        - It does not resolve CANONICAL_INTEGRITY, TRUSTED_TIME, TASK_FENCE, HOST_FENCE, or EFFECT_FENCE and does not compare the final fence evidence to permit, acceptance, disposition, and current heads.
      independently_resigned_counterexample:
        mutation: change all five opaque final evidence digests to 64 zeroes and rebuild/re-sign the entire fixture.
        result: validator accepted the rebuilt fixture with PASS.
        consequence: a stale, revoked, quarantined, or unavailable final boundary can be represented as CURRENT by an ungrounded PASS label.
    required_correction:
      - Materialize exact current Task/Host/effect F4FenceState objects, trusted-time evidence, and canonical-integrity evidence at the final watermark.
      - Require all thirteen evidence refs/fingerprints to resolve and compare their generations, epoch, time, quarantine, and event sequences to the permit, acceptance, disposition, and handoff.
      - Make the final assessment DAG depend on the resolved acceptance and every current evidence node.

  - id: F4-R8-FULL-ATOMIC-IR-B04
    severity: BLOCKER
    title: effect-trust eligibility can accept synthetic compromise-absence and current-F2 evidence
    categories:
      - identity_spoofing
      - host_authentication_bypass
      - compromise_bypass
      - fail_open_currentness
    evidence:
      contract:
        - R8 Section 6 says synthetic or last-known no-compromise heads cannot replace an absence proof.
        - A recovered same-lineage F2 Actor with compromise history must remain F4-ineligible.
      fixture:
        - The ELIGIBLE row's F2/F4 compromise history ABSENT evidence is only a stable ref plus an arbitrary label fingerprint.
        - The current F2 Actor assessment ref/fingerprint, Host-trust predecessor, provisioning action/basis, transition action/basis, and Host revocation head do not resolve to materialized evidence objects.
        - The F2ExecutionHostPrincipalBindingExtension repeats F2-looking refs/fingerprints but is not the frozen F2 Actor, Principal, Binding, assessment, or absence-proof object.
      validator:
        - Eligibility validation enforces pair nullability and result precedence but never verifies the content, completeness, subject lineage, or watermark of the claimed absence proofs.
        - Host AUTHENTICATED/MATCH therefore rests on ungrounded ELIGIBLE evidence even though the local ref/fingerprint labels are internally consistent.
      counterexample:
        construction: any arbitrary 64-hex value can occupy both ABSENT evidence fingerprints and the current-F2 assessment fingerprints while the reducer still emits ELIGIBLE, provided the wrapper is re-signed.
        consequence: a compromised-and-recovered Host Actor can be presented as never compromised without a complete-history proof.
    required_correction:
      - Define and materialize canonical compromise-history presence/absence evidence with actor lineage, complete history basis, watermark, and canonical writer.
      - Resolve the current frozen-F2 Actor/Principal/Binding assessments and the F4 Host-trust transition predecessor/action/basis.
      - Require Host authentication to bind those exact resolved objects and reject arbitrary or non-complete absence evidence.

  - id: F4-R8-FULL-ATOMIC-IR-B05
    severity: BLOCKER
    title: authorization negative precedence and revocation currentness are not enforced by the review subjects
    categories:
      - revocation_bypass
      - fail_open_currentness
      - internal_contradiction
    evidence:
      contract:
        - R7/R8 fix present-decision negative precedence as revoked, scope mismatch, then expired.
        - The revocation_event_sequence is the exact current revocation-head sequence; zero is the no-prior-revocation state.
      validator:
        - JENN_DECISION_CURRENT checks only revocation_event_sequence <= evaluation_watermark_event_sequence, so a positive prior revocation remains CURRENT.
        - JENN_SCOPE_MISMATCH checks only unequal scopes and does not reject a concurrently visible revocation that must select JENN_DECISION_REVOKED.
        - The fixed authorization vectors contain one negative at a time and do not exercise the required concurrent-negative precedence.
      independently_resigned_counterexamples:
        - mutation: set the CURRENT row revocation_event_sequence to 89 at watermark 90 and recompute its F4_FP and paired resolution fingerprint
          result: full validator PASS
        - mutation: set the SCOPE_MISMATCH row revocation_event_sequence equal to watermark 90 and recompute its F4_FP and paired resolution fingerprint
          result: full validator PASS with lower-priority JENN_SCOPE_MISMATCH
        - Both mutations preserve field inventory, interface, canonical domain, hashes, and all non-target evidence.
    required_correction:
      - Define the exact revocation observation tuple, including how absence and a visible revocation fact are distinguished.
      - Enforce CURRENT only when the current revocation observation proves no revocation through the evaluation watermark.
      - Evaluate all simultaneous negative predicates and select the fixed first reason.
      - Add cross-product resigned vectors for revoked plus scope mismatch plus expiry, each combined with unavailable evidence.

  - id: F4-R8-FULL-ATOMIC-IR-B06
    severity: BLOCKER
    title: the R8 semantic validator fingerprints but does not apply the effective currentness, admission, start, or expiry reducers
    categories:
      - authority_expansion
      - prohibited_boundary_bypass
      - fail_open_currentness
      - downstream_boundary_leak
      - internal_contradiction
    evidence:
      effective_contract:
        - R2 requires any proven currentness negative to emit REJECTED and dominate unavailable evidence.
        - R2 requires prohibited_boundary REJECTED to emit admission REJECTED / PROHIBITED.
        - R3/R5 require final_handoff_authority_current REJECTED to emit NOT_STARTED / AUTHORITY_STALE.
        - R1 requires a start recheck at or after start_authority_expires_at_utc_ms to emit NOT_STARTED / EXPIRED and forbids a handoff.
      validator:
        - validate_identity_and_reference_chain checks only the fixed positive result/reason strings for currentness, admission, and disposition.
        - It does not derive those outputs from their normalized check fields.
        - It does not compare observed_at_utc_ms to start_authority_expires_at_utc_ms or require the acceptance and handoff expiry to be strictly in the future at disposition.
      fully_cascaded_resigned_counterexamples:
        - mutation: TaskPermitCurrentnessAssessment.task_binding_current = REJECTED while result/reason remain VALID / ALL_CURRENT
          cascade: builder recomputed currentness, decision, acceptance, disposition, handoff, inventory, IDs, refs, fingerprints, and DAG nodes
          result: full validator PASS
        - mutation: HostLocalAdmissionDecision.prohibited_boundary = REJECTED while decision/reason remain ADMITTED / ALL_CHECKS_PASS
          cascade: all descendants and graph nodes re-signed
          result: full validator PASS
        - mutation: HostWorkStartDisposition.final_handoff_authority_current = REJECTED while disposition/reason remain START_AUTHORITY_CURRENT / ALL_RECHECKS_PASS
          cascade: disposition and handoff re-signed
          result: full validator PASS
        - mutation: acceptance and handoff start_authority_expires_at_utc_ms = 2400 while disposition observed_at_utc_ms = 2400
          cascade: acceptance ID chain, observation ID, handoff, refs, fingerprints, and graph nodes re-signed
          result: full validator PASS and a stale handoff remains emitted
    required_correction:
      - Implement the complete effective R2 TaskPermit currentness reducer over every check and lifecycle/time predicate.
      - Implement the complete effective R2 admission reducer and fixed reason precedence.
      - Implement the complete effective R3/R5 start-disposition reducer, including final authority, Host authentication, fence, epoch, secret, attestation, presence, and expiry predicates.
      - Enforce all permit, acceptance, disposition, and handoff time inequalities and reject handoff emission at or after expiry.
      - Add the four fully cascaded mutations above and combined negative/unavailable precedence cases to the fixed validator suite.

