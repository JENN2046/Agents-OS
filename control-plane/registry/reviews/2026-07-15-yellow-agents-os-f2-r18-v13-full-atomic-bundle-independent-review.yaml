findings:
  - finding_id: F2-R18-V13-FULL-IR-B01
    severity: BLOCKER
    title: Actor validity-window start boundary has no closed subject state
    affected_surfaces:
      - Actor identity lifecycle
      - ActorIdentityAssessmentV0_1R16
      - ActorIdentityEffectiveReducer
      - Temporary Worker responsibility projection
    evidence:
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r7-amendment.draft.md
        lines: 259-276
        fact: IdentityValidityWindow has not_before and expiry, and every Temporary Worker requires it.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md
        lines: 318-330
        fact: The effective Actor assessment enum has no NOT_YET_ACTIVE state.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-actor-identity-delegation-v0.1.draft.md
        lines: 235-257
        fact: The Actor reducer does not define the now-before-not_before branch.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 868-880
        fact: V13 independently maps outside-window time to EXPIRED.
    finding: >-
      Fixed R1-R18 provides no unique Actor assessment when trusted time is
      earlier than not_before_utc_ms. V13's EXPIRED interpretation is not an
      authorized subject rule and is semantically different from not-yet-active.
    impact: >-
      Writers and reducers cannot deterministically agree on the state of a
      future-valid Temporary Worker. The derived Worker responsibility reducer
      and downstream use gate therefore lack a closed input state.
    required_amendment: >-
      Amend the subject bundle to define the pre-start branch and its enum,
      dependency, and downstream mapping, or forbid future not_before values at
      creation. Regenerate the derived materialization afterward.

  - finding_id: F2-R18-V13-FULL-IR-B02
    severity: BLOCKER
    title: Activation-evidence RESUME requires new proof without a canonical proof binding
    affected_surfaces:
      - GovernedStateTransitionFactV0_1R9Effective
      - Binding activation evidence lifecycle
      - Delegation activation evidence lifecycle
      - recovery and replay determinism
    evidence:
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r7-amendment.draft.md
        lines: 821-834
        fact: Activation-evidence RESUME requires a new current proof or an exact acknowledgement revalidation.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r8-amendment.draft.md
        lines: 139-147,399-405,421-443
        fact: The closed transition body and fact contain no proof or revalidation ref/fingerprint.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 464-467,1907-1924
        fact: V13 retains the new-proof predicate while retaining the proof-less transition schema.
    finding: >-
      The acceptance subjects require revalidation but provide no canonical
      field that binds the revalidated proof or acknowledgement result into the
      mutation body, intent, CAS, final fact fingerprint, replay identity, or
      recovery path.
    impact: >-
      RESUME cannot be deterministically reconstructed. Implementations must
      query ambient state, reuse stale evidence, or invent an ungoverned field.
    required_amendment: >-
      Add a target-specific canonical revalidation object or exact ref and
      fingerprint to RESUME, including the Binding principal-control proof and
      a closed Delegation acknowledgement rule, then bind it through body,
      intent, fact fingerprint, reducer, replay, and recovery.

  - finding_id: F2-R18-V13-FULL-IR-B03
    severity: BLOCKER
    title: Domain Agent stewardship of a non-ACTIVE Worker is recovery-locked
    affected_surfaces:
      - post-create IdentityStewardshipAssessment
      - TemporaryWorkerResponsibilityBindingAssessmentV0_1R18
      - Actor RESUME RECOVER RETIRE paths
    evidence:
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md
        lines: 197-200,227-230
        fact: Post-create steward actions require the current-target stewardship assessment.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r18-amendment.draft.md
        lines: 111-126,215-244
        fact: Domain Agent stewardship requires an ACTIVE Worker binding, but that binding is non-ACTIVE whenever Worker identity is SUSPENDED or COMPROMISED.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r7-amendment.draft.md
        lines: 302-317
        fact: The lifecycle matrix otherwise assigns RESUME RECOVER and RETIRE to the current identity steward.
    finding: >-
      R18 makes the current target's ACTIVE identity a transitive prerequisite
      of the Domain Agent stewardship assessment used to restore or retire that
      same non-ACTIVE target.
    impact: >-
      A responsible Domain Agent cannot exercise the lifecycle stewardship that
      the subject bundle assigns to it; only an unrelated Jenn-root fallback
      remains, so the declared steward route is internally self-locking.
    required_amendment: >-
      Derive stewardship scope/source validity independently from the target
      Actor current state. Validate the responsibility source, Worker/source/
      resource tuple, and Domain Agent scope separately, and let the Actor
      transition matrix evaluate the target state.

  - finding_id: F2-R18-V13-FULL-IR-B04
    severity: BLOCKER
    title: V13 reverses the fixed parsed-number admission rule
    affected_surfaces:
      - F2 canonical scalar profile
      - cross-writer JCS admission
      - every numeric field in the materialization
    evidence:
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r6-amendment.draft.md
        lines: 39-102
        fact: Admission is exclusively over parsed binary64 values and parser-rounded source tokens are admitted when the parsed result is a safe integer.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 653-660,680-683
        fact: V13 rejects parser-rounding admission while its printed safe_uint predicate accepts the rounded safe-integer result.
    finding: >-
      V13 contradicts both R6 and its own printed predicate by turning token
      information loss into a rejection condition.
    impact: >-
      Conforming implementations can admit different values and produce
      different canonical bytes and fingerprints from the same parsed value.
    required_amendment: >-
      Restore the exact R6 parsed-value predicate and examples; reject only when
      the parsed result itself fails the safe-integer predicate.

  - finding_id: F2-R18-V13-FULL-IR-B05
    severity: BLOCKER
    title: V13 omits required exact fingerprint and derived-digest formulas
    affected_surfaces:
      - complete resolved implementation reading surface
      - BindingScope fingerprint
      - Delegation final fingerprint and issuance intent
      - activation evidence IDs and replay identities
      - lifecycle replay and responsibility lineage
    evidence:
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md
        lines: 566-594
        fact: The materialization must include canonical reference domain and fingerprint rules in full and be one complete resolved implementation surface.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 1230,2353-2359
        fact: V13 refers back to earlier formulas and supplies a generalized complete-object fingerprint statement.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r3-amendment.draft.md
        lines: 136,221,295,385
        fact: These lines define still-effective special replay evidence-ID and issuance-intent formulas absent from V13.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r4-amendment.draft.md
        lines: 128,253,355,439
        fact: These lines define special BindingScope replay and Delegation final-subject formulas absent from V13.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r7-amendment.draft.md
        lines: 1070
        fact: The responsibility-lineage formula is absent from V13.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r8-amendment.draft.md
        lines: 210
        fact: The lifecycle replay formula is absent from V13.
    finding: >-
      V13 does not print multiple still-effective special digest formulas and
      its broad complete-known-object rule is not byte-equivalent to all of
      them. A source reference is not the complete surface required by R16.
    impact: >-
      An implementation cannot reproduce all normative digests from V13 alone
      and may apply the generalized formula to a special projection, producing
      different bytes.
    required_amendment: >-
      Print every still-effective special formula and distinguish registered
      derived-record complete-object fingerprints from special tuple, replay,
      evidence-ID, lineage, intent, and subject projections.

  - finding_id: F2-R18-V13-FULL-IR-B06
    severity: BLOCKER
    title: V13 omits effective closed-set and invariant predicates
    affected_surfaces:
      - Assignment issuance
      - non-transferable responsibility
      - BindingScope and context scalar admission
      - Jenn governance authority basis
    evidence:
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r15-amendment.draft.md
        lines: 175-190
        fact: Assignment cannot be self-issued.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-actor-identity-delegation-v0.1.draft.md
        lines: 555-575
        fact: The non-transferable responsibility set remains effective.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r4-amendment.draft.md
        lines: 110-140
        fact: BindingScope contexts are non-empty and forbid wildcard glob regex subtree future and unknown kinds.
      - path: control-plane/registry/drafts/2026-07-14-agents-os-f2-actor-identity-delegation-v0.1-r5-amendment.draft.md
        lines: 125-150
        fact: context_id has exact length Unicode and control-character rules.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 357,719-728,1089,1191-1243
        fact: V13 prints the fields but omits these controlling predicates and closed sets.
    finding: >-
      Multiple effective admission and authority constraints do not appear in
      the alleged complete implementation surface. Field-list equality and
      index equality do not preserve object validity predicates.
    impact: >-
      A V13-only implementation can admit self-issued Assignments, transferable
      Jenn-only responsibility, invalid Binding scopes or context identifiers,
      or an empty/invalid governance basis-use set.
    required_amendment: >-
      Project every still-effective closed set and invariant into the owning
      V13 section and include them in source-equivalence validation.

  - finding_id: F2-R18-V13-FULL-IR-M01
    severity: MAJOR
    title: V13 Actor CREATE table broadens the class-specific authority union
    evidence:
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-actor-identity-delegation-v0.1-r16-amendment.draft.md
        lines: 81-93
        fact: Resident Domain and Worker classes use stewardship CREATE Jenn uses governance bootstrap and Service Host use provisioning.
      - path: control-plane/registry/drafts/2026-07-15-agents-os-f2-effective-contract-materialization-v0.1-r18-v13.draft.md
        lines: 329-340
        fact: The CREATE row prints the three bases as one generic union and qualifies only the provisioning branch by class.
    finding: >-
      The complete reading table can be implemented as allowing Jenn governance
      bootstrap to create ordinary non-Jenn Actors, which expands the fixed
      class-specific authority rule.
    required_amendment: >-
      Split CREATE by Actor class and print the mutually exclusive R16 routes.

  - finding_id: F2-R18-V13-FULL-IR-M02
    severity: MAJOR
