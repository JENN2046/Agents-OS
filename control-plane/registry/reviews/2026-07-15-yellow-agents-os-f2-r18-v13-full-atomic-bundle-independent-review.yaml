        lines: 1392-1401,1855-1892
        fact: V13 lists only ACTIVE REVOKED SUPERSEDED as later states while its reducers depend on SUSPEND and RESUME.
    finding: >-
      V13's creation/effective-state explanation contradicts its own transition
      and reducer surface, leaving the derived suspension representation unclear.
    required_amendment: >-
      Separate immutable creation status from derived assessment state and
      explicitly retain the R7 SUSPENDED projection.

  - finding_id: F2-R18-V13-FULL-IR-M03
