review_corrections_made_before_hash_fixing:
  - correction_id: F2-R3-SR-01
    issue: >-
      A first draft made the committed issuance action name the final grant
      subject while the final subject also contained that action reference.
    correction: >-
      Added an exact delegation issuance-intent fingerprint, required the F3
      action to commit that intent, then derived the final grant subject from
      the intent, committed action reference, and grant Event sequence.
    outcome: ACYCLIC
  - correction_id: F2-R3-SR-02
    issue: >-
      R3 needed to say exactly which R1/R2 clauses it replaces rather than rely
      on a general later-amendment precedence statement.
    correction: >-
      Added the exact replacement list and explicitly replaced R2 Section 12
      with the R3 atomic acceptance clause.
    outcome: CLOSED
  - correction_id: F2-R3-SR-03
    issue: >-
      Delegation issuance actions needed exact responsibility-source binding.
    correction: >-
      Bound root, assignment-rooted, and child grant issuance actions to the
      exact root direction, source assignment, or active parent delegation.
    outcome: CLOSED

blocker_readjudication:
  - finding_id: F2-R2-IR-B01
    result: RESOLVED_IN_R3
    basis: >-
      DelegationActivationAcknowledgementRef is an F3-owned, COMMITTED,
      activation-purpose-only fact. It authenticates the exact delegate binding
      while requiring responsibility_source_mode NONE_ACTIVATION_PURPOSE_ONLY,
      rejects the pending grant as responsibility, and atomically binds replay,
      evidence, assessment, and activation Event.
  - finding_id: F2-R2-IR-B02
    result: RESOLVED_IN_R3
    basis: >-
      Binding and delegation now use immutable subject fingerprints followed by
      evidence and derived assessment fingerprints. Exact domain-separated JCS
      evidence IDs, ordered field projections, fixed-point rejection, CAS, and
      startup recovery order are defined.
  - finding_id: F2-R2-IR-B03
    result: RESOLVED_IN_R3
    basis: >-
      ResponsibilityAssignmentRevisionR2 now has an exception-free
      actor_id != issued_by_actor_id invariant. Every grant records exact issuer
      identity, binding, action, currentness, root/assignment provenance, and
      acyclic intent/subject fingerprints.

