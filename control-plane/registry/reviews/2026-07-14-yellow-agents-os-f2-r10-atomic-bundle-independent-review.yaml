findings:
  - finding_id: F2-R10-IR-B01
    severity: BLOCKER
    title: Synthetic Binding issuance snapshot introduces manifest, activation, and creation-spec fingerprint cycles
    affected_sections:
      - R10 Sections 3.3-5
      - R8 Sections 6.2-6.4
      - Materialization Sections 3.3 and 7
    finding: >-
      R10 requires SyntheticBindingIssuanceInputSnapshot to be included in the
      Binding creation spec and therefore in that spec's BINDING_REVISION body
      fingerprint. The snapshot itself contains manifest_ref/fingerprint,
      manifest_activation_ref/fingerprint, and
      binding_creation_spec_ref/fingerprint. The manifest fingerprint depends
      on the ordered Binding spec containing this snapshot; the activation
      fingerprint is created only after and depends on that manifest
      fingerprint; and the Binding creation-spec fingerprint directly depends
      on the snapshot containing that same fingerprint.
    impact: >-
      The synthetic snapshot cannot be serialized before manifest creation and
      cannot satisfy the claimed precommitted Binding body. This recreates both
      direct self-reference and post-action back-reference inside the M0 graph,
      so atomic synthetic Binding materialization is not constructible.
    required_amendment: >-
      Split pre-manifest spec inputs from post-activation derived provenance.
      The Binding creation spec may bind only Actor/Principal/Profile/controller
      creation-spec refs or fingerprints, scope, window, and other values that
      exist before the manifest fingerprint. Exclude manifest, activation, and
      own Binding-spec refs/fingerprints from the pre-action snapshot. Insert
      those later values only into a separately defined derived issuance ref or
      final-subject overlay whose fingerprint is not part of the manifest body.

  - finding_id: F2-R10-IR-M01
    severity: MAJOR
    title: The derived materialization still diverges from the effective authority tables
    affected_sections:
      - R10 Section 6
      - Materialization Sections 4.5 and 6
    finding: >-
      The materialization says Assignment SUSPEND, RESUME, and REVOKE allow
      DIRECT_DELEGATOR_ACTION, while the effective R8 Section 3.2 table allows
      only JENN_ROOT_ACTION and R10 does not amend that rule. It also uses the
      removed evidence-steward wording for Delegation activation evidence and
      does not print the complete required/forbidden field matrix for each
      TransitionAuthorityBasis kind despite R10's explicit complete-table
      requirement.
    impact: >-
      The file is non-authoritative, so this does not change the fixed subject
      semantics, but an implementer following the promised resolved surface
      would create an unauthorized Assignment transition route and encounter
      an undefined role. The previous materialization finding is not closed.
    required_amendment: >-
      Regenerate the materialization from the exact R8/R9/R10 tables. Remove
      DIRECT_DELEGATOR_ACTION from every Assignment row, remove all
      evidence-steward wording, and print the full required/forbidden basis-field
      matrix and exact reducers without narrative substitutions.

