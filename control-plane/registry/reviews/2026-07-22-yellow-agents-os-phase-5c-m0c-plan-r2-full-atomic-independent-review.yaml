finding_details:
  - id: PHASE5C_M0C_PLAN_R2_IR_B01
    severity: blocker
    title: The_normative_profile_and_fixed_witness_use_incompatible_member_manifest_preimages
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-exact-archive-output-lifecycle-profile-v0.1-r2.yaml
    author_evidence:
      - control-plane/registry/build-phase-5c-m0c-plan-r2-structural-witness.py
      - control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r2-structural-witness-v0.1.json
      - control-plane/registry/validate-phase-5c-m0c-plan-r2-structural-witness.py
    exact_locations:
      - exact_archive_profile_line_21
      - structural_builder_lines_44_49
      - structural_builder_line_184
      - structural_validator_lines_459_463
    evidence: >-
      The normative archive profile defines the member-manifest preimage as a
      canonical JSON array containing source_path, archive_path, kind,
      byte_length and sha256. The fixed builder and validator instead hash an
      eleven-field projection that additionally contains mode, uid, gid,
      uname, gname and mtime. The profile-conforming five-field preimage hashes
      to 6e990a8a0a0326986b673acdc21752c5bdd58428081fd18358c5fcdefea7a8b1,
      while the fixed witness uses
      3a5b0eac9c6e9c15af5431bba594e15222019b8118d8fb727cf60ce152bcd371.
      A fully re-signed witness carrying the profile-conforming digest is
      rejected by the validator.
    impact: >-
      The atomic unit selects two non-equivalent member-manifest algorithms and
      rejects the one stated by its normative profile. The archive proof is not
      exact and the no-legal-input-over-rejection requirement is not met.
    closure_required:
      - freeze_one_member_manifest_field_inventory_and_canonical_JSON_algorithm
      - make_the_profile_builder_witness_and_validator_use_that_same_preimage
      - add_a_fully_resigned_member_manifest_drift_regression

  - id: PHASE5C_M0C_PLAN_R2_IR_B02
    severity: blocker
    title: Output_delivery_and_cleanup_remain_claimed_labels_not_actual_structural_proof
    subjects:
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-exact-archive-output-lifecycle-profile-v0.1-r2.yaml
      - control-plane/registry/drafts/2026-07-22-agents-os-phase-5c-m0c-plan-r2-narrow-correction-amendment-v0.1.md
    author_evidence:
      - control-plane/registry/build-phase-5c-m0c-plan-r2-structural-witness.py
      - control-plane/registry/examples/2026-07-22-agents-os-phase-5c-m0c-plan-r2-structural-witness-v0.1.json
      - control-plane/registry/validate-phase-5c-m0c-plan-r2-structural-witness.py
    exact_locations:
      - exact_archive_profile_lines_39_58
      - structural_builder_lines_152_207
      - structural_validator_lines_491_517
      - review_manifest_lines_115_119
      - review_manifest_line_131
    evidence: >-
      The profile requires success return fields archive_sha256,
      archive_byte_length and archive_bytes_in_memory, and only
      stable_error_code on failure. The witness success return instead carries
      archive_bytes_delivery without the actual in-memory bytes, and its
      failure return adds the same undeclared delivery label. The builder
      constructs the synthetic archive entirely in memory and never creates,
      enumerates or removes an owned staging root. The validator accepts an
      empty claimed residue list and the delivery label without binding either
      to filesystem observations or actual returned archive bytes.
    favorable_invalid_paths:
      - actual_residue_exists_but_residue_relative_paths_remains_empty
      - wrong_or_absent_returned_bytes_but_archive_bytes_delivery_remains_IN_MEMORY_ONLY
    impact: >-
      The manifest-required attack using actual residue or actual archive
      delivery remains unrepresentable. R1 blocker B02 is therefore not closed
      even though mutations of the declared lists and labels are rejected.
    closure_required:
      - execute_the_synthetic_success_and_failure_lifecycles_in_an_owned_temp_root
      - bind_pre_and_post_filesystem_inventories_to_the_witness
      - bind_the_actual_returned_archive_bytes_to_the_synthetic_archive_bytes
      - make_witness_return_fields_identical_to_the_normative_profile
      - fully_resign_actual_residue_and_wrong_delivery_attacks

  - id: PHASE5C_M0C_PLAN_R2_IR_B03
    severity: blocker
    title: The_complete_ZIP_cannot_execute_all_six_fixed_commands
    subjects:
      - control-plane/registry/reports/2026-07-22-agents-os-phase-5c-m0c-plan-r2-atomic-independent-review-package-v0.1.manifest.yaml
    exact_locations:
      - review_manifest_validator_command_5_line_105
      - archive_map_missing_two_R1_command_dependencies
    evidence: >-
      Command 5 invokes the R1 witness validator and its synthetic fixture.
      Neither file is a declared R2 input or an ARCHIVE_MAP entry. All six
      commands pass in the fixed-commit workspace, but an isolated no-Git tree
      reconstructed solely from the complete ZIP passes only five commands;
      command 5 exits with the validator file missing.
    impact: >-
      An external reviewer holding the declared complete ZIP cannot reproduce
      the mandatory six-command validation without consuming undeclared bytes
      outside the package. The package_ready and complete-review claims are not
      satisfied by the archive itself.
    closure_required:
      - include_and_hash_bind_the_R1_validator_and_fixture_in_the_review_package
      - or_remove_the_external_dependency_and_replace_it_with_an_equivalent_self_contained_check
      - require_all_fixed_commands_to_pass_in_a_no_Git_ZIP_only_extraction

