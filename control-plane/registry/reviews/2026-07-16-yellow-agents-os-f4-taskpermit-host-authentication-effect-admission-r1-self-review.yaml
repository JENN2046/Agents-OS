author_findings_closed_before_fixing_subject_hashes:
  - id: F4-R1-AUTHOR-01
    issue: fact-separation table overclaimed local-admission and start-disposition meaning
    correction: separated advisory decision, committed acceptance, current handoff authority and physical outcome
  - id: F4-R1-AUTHOR-02
    issue: Host authentication lacked an explicit monotonic epoch
    correction: added Host authentication epoch and currentness/recheck bindings
  - id: F4-R1-AUTHOR-03
    issue: first fixture proved DAG shape but did not instantiate every exact F4 schema or accepted handoff
    correction: replaced it with a 14-node, 22-schema-fingerprint exact materialization including the immutable handoff
  - id: F4-R1-AUTHOR-04
    issue: successful start disposition and handoff had a revocation race gap
    correction: required one serializable final-recheck/disposition/handoff transaction
  - id: F4-R1-AUTHOR-05
    issue: human presence, secret-handle currentness, permit attestation and grant currentness were under-bound
    correction: added exact schemas/checks, currentness evidence and handoff bindings
  - id: F4-R1-AUTHOR-06
    issue: execution epoch was described both as upstream-equal and newly allocated
    correction: bound the previous epoch head and required atomic allocation of previous plus one
  - id: F4-R1-AUTHOR-07
    issue: duplicate JSON keys could have been normalized silently by the validator
    correction: validator now rejects duplicate object keys before exact fixture comparison

