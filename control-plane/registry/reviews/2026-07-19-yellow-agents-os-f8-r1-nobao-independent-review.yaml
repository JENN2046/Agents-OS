  items:
  - finding_id: F8-R1-B01
    severity: BLOCKER
    title: Normative F3 intake-result order contradicts the fixture and validator
    evidence:
    - 'subjects/F8-R1-contract.md lines 124-127: COMMITTED, REJECTED, INDETERMINATE'
    - 'validator/build-f8-r1-witness.py line 620: COMMITTED, INDETERMINATE, REJECTED'
    - validator/validate-f8-r1-witness.py line 484 enforces the builder order
    - fixture/F8-R1-synthetic-witness.json lines 2251-2254 uses the builder order
    impact: The hash-bound four-subject atomic unit contains two different exact normative values for the same ordered
      JSON array. R1 therefore has an internal contradiction and cannot be accepted atomically.
    required_fix: Choose one canonical order, amend the contract/builder/fixture/validator consistently, regenerate
      hashes, and submit F8 R2 for fresh full review.
  - finding_id: F8-R1-B02
    severity: BLOCKER
    title: Same-revision owner-assessment rewrite is not bound by the interface
    evidence:
    - 'subjects/F8-R1-contract.md lines 107-109: consumers bind only assessment_id and expected_assessment_revision'
    - 'validator/build-f8-r1-witness.py lines 383-401: assessment_set_fingerprint hashes only role, assessment_id,
      and revision'
    - Independent attack A21 rewrote A-F7-STALE at revision 1 to CURRENT_ACCEPTED/current-head and re-signed it
    - The reducer returned CANDIDATE_FORMED while the consumer remained assessment_id=A-F7-STALE, revision=1
    impact: The exact assessment bytes/fingerprint consumed by F8 are not committed by the consumer or candidate.
      Static fixture anchors catch the packaged mutation, but the normative interface itself cannot detect a same-revision
      rewrite. Exact-current upstream evidence is therefore not closed.
    required_fix: Add expected_assessment_fingerprint (or an equivalent immutable owner-event commitment) to every
      consumer, include exact row fingerprints in assessment_set_fingerprint, and validate them before interpreting
      results.
  - finding_id: F8-R1-B03
    severity: BLOCKER
    title: F3 acknowledgement can report committed from non-exact current evidence
    evidence:
    - subjects/F8-R1-contract.md lines 325-348 requires an exact current F3-owner assessment for the same candidate
    - validator/validate-f8-r1-witness.py lines 432-449 does not check subject_revision, context_fingerprint, or
      based_on_event_sequence
    - Independent attack A22 set subject_revision=999 and based_on_event_sequence=1 while retaining is_current_head=true
    - The acknowledgement reducer still returned ACKNOWLEDGED_COMMITTED
    impact: A malformed or stale F3 outcome assessment can be projected as committed. The output remains nonauthoritative,
      but it violates the contract's exact-current evidence rule and can misstate F3 state.
    required_fix: Bind the exact candidate revision, define and compare an acknowledgement trusted-event watermark,
      close context nullability by assessment kind, and return ACKNOWLEDGED_INDETERMINATE on any mismatch.
  - finding_id: F8-R1-B04
    severity: BLOCKER
    title: Declared schema totality is masked by fixture anchors
    evidence:
    - subjects/F8-R1-contract.md lines 291-310 declares created_event_ref as stable_ref
    - subjects/F8-R1-contract.md lines 371-374 claims types/enums/nullability reject before fingerprints are trusted
    - validator/validate-f8-r1-witness.py lines 554-574 does not type-check created_event_ref or several other stable_ref
      fields
    - Independent full-graph attack A23 changed created_event_ref to integer 17, fully re-signed the graph, and
      passed validate_fixture(..., enforce_anchors=False) with zero errors
    impact: The validator proves equality to a fixed fixture, not the claimed closed schema. Invalid typed objects
      are rejected only by hardcoded history anchors, contrary to the required target-schema rejection rule.
    required_fix: Implement explicit type, nonempty stable-ref, enum, nullability, and cross-field checks for every
      schema field; add coordinated tests that disable inventory anchors and require the target schema error.
  - finding_id: F8-R1-M01
    severity: MAJOR
    title: The review manifest omits two accepted direction inputs named by the immutable F8 start decision
    evidence:
    - governance/F8-start-decision.yaml lines 63-81 lists resident_architecture and high_privilege_architecture
      as accepted_direction_inputs
    - MANIFEST.yaml lines 28-49 does not declare either document as an authority input
    impact: The offline reviewer cannot verify the F8 contract against all direction inputs that the start decision
      itself names.
    required_fix: Add both exact bytes/hashes to the R2 authority input set, or add a new explicit governance decision
      explaining why they are superseded and not review inputs.
  - finding_id: F8-R1-M02
    severity: MAJOR
    title: The third manifest command is not independently reproducible from the offline package
    evidence:
    - MANIFEST.yaml line 59 requires git diff --check
    - Running it in the extracted archive exits 129 because no .git working tree is included
    - A reconstructed intent-to-add working tree exits 2 and reports trailing whitespace/new blank lines
    impact: The required command result cannot be reproduced exactly from the supplied review package, so the author
      PASS claim is not independently established.
    required_fix: Replace the environment-dependent command with a deterministic file-list whitespace validator,
      or include a documented reproducible Git baseline.
