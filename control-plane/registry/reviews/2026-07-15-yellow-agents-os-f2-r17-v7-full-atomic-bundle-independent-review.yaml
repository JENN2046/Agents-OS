findings:
  - finding_id: F2-R17-V7-FULL-IR-M01
    severity: MAJOR
    title: Materialization v7 omits required currentness reducers and indexes a non-definition
    affected_sections:
      - R7 Sections 5.3, 6.4, 7.2-7.4, and R8 Section 6.3
      - R16 Section 4
      - Materialization v7 Sections 3, 18, 20.1, and 21
    finding: >-
      R16 requires the complete resolved implementation reading surface to
      include all reducer precedence and currentness/watermark rules. V7 prints
      the R16 Profile, Principal, Binding-activation, and
      Delegation-activation assessment schemas, but it does not print their
      source-defined currentness reducers. In particular it omits the R7
      Profile checks for current-head CAS, transition authority,
      verifier/clock availability, controller currentness, and fingerprint;
      the R7 Principal checks for the exact current ACTIVE head, ACTIVE Profile,
      every ACTIVE credential handle, transition provenance, and fingerprints;
      and the activation-assessment reductions over exact evidence heads and
      transition facts. Section 20.1 names
      SyntheticM0ManifestAssessmentReducer but supplies no total ACCEPT,
      REVOKE, missing-head, fork, CAS-gap, decision-mismatch, and fingerprint
      reduction from R8 Section 6.3. Section 21 nevertheless indexes that
      heading as a reducer and claims reducer completeness.
    impact: >-
      The fixed R1-R17 subjects remain semantically reviewable, but v7 is not
      the complete resolved implementation reading surface required by R16.
      Independent implementations using v7 must refer back to superseded
      layers or invent reduction behavior for identity-control and synthetic
      bootstrap currentness. The 62-of-62 schema row equality and 8-of-8 named
      reducer row equality prove inventory equality only; they do not prove
      behavioral completeness. Jenn therefore does not yet have the required
      exact materialization for an atomic acceptance decision.
    required_amendment: >-
      Regenerate only the derived materialization. Print the exact effective
      Profile, Principal, Binding-activation, Delegation-activation, and
      Synthetic M0 manifest assessment reducers, including precedence,
      current-head/CAS, dependency, fingerprint, assurance, and watermark
      failure behavior. Index each actual reducer definition exactly once and
      rerun a fresh full atomic-bundle review. Do not change R1-R17.

